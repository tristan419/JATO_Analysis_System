# Skoda Czech Republic Kamiq MSRP page
# Validated via live dry-run on 2026-04-21: 2 extracted / 2 valid.

source_code: skoda_kamiq_cz_scrapling
country: 捷克
brand: SKODA
source_url: https://www.skoda-auto.cz/modely/kamiq/kamiq
source_type: manufacturer_official
price_semantics: base_msrp

extractor_type: scrapling

profile:
  url: https://www.skoda-auto.cz/modely/kamiq/kamiq
  tier: stealth
  headless: true
  network_idle: true
  impersonate: chrome
  default_currency: CZK
  default_tax_included: true
  default_price_label: Doporučená cena včetně DPH
  fixed_model: KAMIQ
  fixed_jato_model: KAMIQ
  fixed_jato_powertrain: null
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
      - key: price_band_entry
        label: Entry price band matched
        max: 0
        delta: 0.0
      - key: price_band_mid
        label: Mid price band matched
        min: 0
        max: 0
        delta: 0.01
      - key: price_band_high
        label: High price band matched
        min: 0
        delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
      - key: powertrain_ice
        label: "Powertrain matched: ICE"
        powertrain: ICE
        delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
      - key: edition_special
        label: Special Edition
        keyword: special edition
        special: true
    powertrain_rules:
      - key: powertrain_ice
        powertrain: ICE
        keywords:
          - benzín
          - TSI
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  json_script_selector: script[type='application/ld+json']

schedule:
  frequency: manual_only
  run_window_start: "00:00"
  run_window_end: "05:00"
  preferred_weekday: monday

notes: Public Skoda Czech Republic model page. Stable ld+json Vehicle pricing;
  validated via targeted dry-run before promotion.
