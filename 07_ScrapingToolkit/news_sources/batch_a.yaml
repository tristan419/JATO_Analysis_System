batch_code: country_news_batch_a
description: First batch country automotive news feeds for Nordics and CEE markets with keyword-filtered multi-source inputs.
countries:
  - country_code: SE
    country_label: Sweden / 瑞典
    feeds:
      - source_code: se_google_auto_market
        publisher: Google News
        feed_url: https://news.google.com/rss/search?q=Sweden+car+market+EV+subsidy&hl=en-GB&gl=GB&ceid=GB:en
        language: en
        tags: [market, policy, automotive]
      - source_code: se_acea_auto_policy
        publisher: ACEA
        feed_url: https://www.acea.auto/feed/
        language: en
        tags: [association, policy, automotive]
        include_keywords: [Sweden, Swedish]
      - source_code: se_transport_environment_policy
        publisher: Transport & Environment
        feed_url: https://www.transportenvironment.org/articles/rss
        language: en
        tags: [policy, regulation, automotive]
        include_keywords: [Sweden, Swedish]
