source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.kia.com/se/nya-bilar/sportage/upptack/
  headless: true
  default_currency: SEK
  default_tax_included: true
  default_price_label: Rekommenderat cirkapris inkl. moms
  fixed_model: SPORTAGE
  fixed_jato_model: SPORTAGE
  fixed_jato_powertrain: null
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_hev
      label: 'Powertrain matched: HEV'
      powertrain: HEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - plug-in hybrid
      - laddhybrid
      - laddbar
      - Sportage Plug-In Hybrid
    - key: powertrain_hev
      powertrain: HEV
      keywords:
      - hybrid
      - Sportage Hybrid
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - bensin
      - diesel
      - 1.6 T-GDi
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  text_regex:
    source_selector: body
    entry_patterns:
    - pattern: 'Nya Kia Sportage Plug-In Hybrid.*?Rek\s*ca\s*pris\s*från\s+(?P<price>\d{3}[\s\xa0]\d{3})\s*kr'
      official_trim: Plug-In Hybrid
      official_powertrain: PHEV
  tier: stealth
  network_idle: true
  impersonate: chrome
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Keywords filled from official manufacturer website research (SE market). CSS
