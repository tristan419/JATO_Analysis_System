source_code: volvo_ex30_se_draft_scrapling
country: 瑞典
brand: VOLVO
source_url: https://www.volvocars.com/se/build/ex30-electric/
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.volvocars.com/se/build/ex30-electric/
  tier: stealth
  headless: true
  network_idle: false
  timeout_ms: 75000
  retries: 2
  impersonate: chrome
  css:
    vehicle_container: '[data-testid="selection-card"]'
    model: ''
    trim: '[data-testid="title"]'
    price: '[data-testid="price"]'
    exclude_if_selector: '[data-testid="selection-card-unavailable"]'
  exclude_price_prefixes:
  - 'Från '
  - Leasing
  default_currency: SEK
  default_tax_included: true
  default_price_label: Rekommenderat cirkapris
  fixed_model: EX30
  fixed_jato_model: EX30
  fixed_jato_powertrain: BEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    exclude_price_prefixes_bonus: 0.04
    exclude_if_selector_bonus: 0.04
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_primary
      powertrain: BEV
      keywords:
      - ex30-electric
      - ex30
      - electric
      - single motor
      - twin motor performance
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  json_script_selector: script[type='application/ld+json']
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Volvo Sweden build-page candidate aligned with the existing XC60 pattern. URL was verified during SUV-only backlog
  landing and should be validated with a browser runner because raw curl returns 403 on Volvo build pages. The selector pattern
  mirrors volvo_se_xc60.yaml and is intended to capture trim cards while excluding Från family-price cards.
bootstrap_meta:
  country_model_rank: 5
  suggested_scope_kind: single_model
  sales_12m: 5231.0
  model: EX30
