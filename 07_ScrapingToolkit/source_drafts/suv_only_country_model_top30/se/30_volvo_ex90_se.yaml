source_code: volvo_ex90_se_draft_scrapling
country: 瑞典
brand: VOLVO
source_url: https://www.volvocars.com/se/choose/ex90-electric/
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.volvocars.com/se/choose/ex90-electric/
  tier: stealth
  headless: true
  network_idle: false
  timeout_ms: 75000
  retries: 2
  impersonate: chrome
  css:
    vehicle_container: '[data-testid="selection-card"]'
    model: ''
    trim: '[data-testid="title"]'
    price: '[data-testid="price"]'
    exclude_if_selector: '[data-testid="selection-card-unavailable"]'
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: '<article\s+class="preSelect[^>]*?"[^>]*?aria-labelledby="preselect-card-[^"]+".*?<h3[^>]*>\s*<span>(?P<powertrain>Single Motor|Twin Motor(?: Performance)?)</span>\s*<span[^>]*>(?P<trim>[^<]+)</span>.*?<span>Från\s+(?P<price>\d[\d\s\xa0]{5,})\s*kr</span>'
      official_powertrain: BEV
      price_label: Rekommenderat cirkapris
  default_currency: SEK
  default_tax_included: true
  default_price_label: Rekommenderat cirkapris
  fixed_model: EX90
  fixed_jato_model: EX90
  fixed_jato_powertrain: null
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_bev
      powertrain: BEV
      keywords:
      - ex90-electric
      - ex90
      - electric
      - single motor
      - twin motor
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  json_script_selector: script[type='application/ld+json']
  exclude_price_prefixes:
  - 'Från '
  - Leasing
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Keywords filled from official manufacturer website research (SE market). CSS selectors still require browser-based
  inspection before promotion. [Updated to final /choose/ URL and embedded preselect-card
