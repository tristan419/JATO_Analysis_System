  structured_fields:
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - phev
      - plug-in hybrid
      - plug in hybrid
      - plugin hybrid
      - epanafortizomeno yvridiko
    - key: powertrain_hev
      powertrain: HEV
      keywords:
      - hev
      - full hybrid
      - self-charging hybrid
      - self charging hybrid
      - hybrid
      - yvridiko
schedule:
