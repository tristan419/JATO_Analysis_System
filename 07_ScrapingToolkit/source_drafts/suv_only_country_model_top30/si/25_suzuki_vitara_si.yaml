source_code: suzuki_vitara_si_draft_scrapling
country: 斯洛文尼亚
brand: SUZUKI
source_url: https://auto.suzuki.si/pages/katalogi-in-ceniki
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://auto.suzuki.si/pages/katalogi-in-ceniki
  tier: http
  headless: true
  network_idle: false
  load_dom: false
  timeout_ms: 30000
  impersonate: chrome
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: 'VITARA\s+1\.4\s+(?:BOOSTERJET\s+)?(?:ALLGRIP\s+)?HIBRID(?:\s+AT)?\s+(?P<trim>(?:COMFORT|PREMIUM|ELEGANCE TOP|ELEGANCE|SPECIAL EDITION)\s+V6[A-Z0-9]+)\s+M(?:HEV|EHV)\s+81\s+1373\s+[0-9,.-]+\s+[0-9,-]+\s+6-st\.\s+(?:ročni|avt\.)\s+5\s+(?P<price>[0-9.]+,[0-9]{2})'
      official_powertrain: MHEV
      price_label: PRIPOROČENA MALOPRODAJNA CENA
  default_currency: EUR
  default_tax_included: true
  default_price_label: PRIPOROČENA MALOPRODAJNA CENA
  fixed_model: VITARA
  fixed_jato_model: VITARA
  fixed_jato_powertrain: MHEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_hev
      label: 'Powertrain matched: HEV'
      powertrain: HEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mhev
      - mehv
      - hibrid
      - hibridni
      - mild hybrid
      - mild-hybrid
      - 48V
      - blagi hibrid
    - key: powertrain_hev
      powertrain: HEV
      keywords:
      - hev
      - full hybrid
      - self-charging hybrid
      - self charging hybrid
      - hybrid
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
