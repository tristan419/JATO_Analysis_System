source_code: volkswagen_t_roc_pl_draft_scrapling
country: 波兰
brand: VOLKSWAGEN
source_url: https://www.volkswagen.pl/pl/modele/t-roc.html
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: http_text
profile:
  url: https://www.volkswagen.pl/pl/modele/t-roc.html
  timeout_seconds: 45
  headers:
    User-Agent: Mozilla/5.0
    Accept-Language: pl-PL,pl;q=0.9,en;q=0.8
  entry_patterns:
  - pattern: '"highlightedTechnicalData"\s*:\s*\[\{.*?"key"\s*:\s*"Cena specjalna".*?"value"\s*:\s*"od\s+(?P<price>[\d\s]+)\s*zł"'
    official_trim: T-ROC special price
    price_label: Cena specjalna
  default_currency: PLN
  default_tax_included: true
  fixed_model: T-ROC
  fixed_jato_model: T-ROC
  copy_trim_to_jato_trim: true
  default_price_label: Cena specjalna
  match_confidence: 0.72
  match_status: review_required
  match_reason:
    kind: official_model_page_special_price
    source: volkswagen_pl_highlighted_technical_data
    note: Official Volkswagen Poland page exposes a static Cena specjalna value; keep review_required because the label is promotional rather than explicit catalog MSRP.
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: The raw HTML exposes a stable `car-technical-data-section-v2` block where the
  first list item is `Cena specjalna` and the finance metrics follow in a separate
  technical-data list. This draft intentionally extracts the total campaign price
  and excludes monthly-payment copy, but still needs a semantic review before promotion
  because the page label is promotional rather than explicit catalog MSRP. [Switched
  to playwright_card_flow with volkswagen_configurator_trim_overview_playwright.yaml]
  [Switched to http_text over highlightedTechnicalData to avoid Playwright timeout]
bootstrap_meta:
  country_model_rank: 19
  suggested_scope_kind: single_model
  sales_12m: 4604.0
  model: T-ROC
