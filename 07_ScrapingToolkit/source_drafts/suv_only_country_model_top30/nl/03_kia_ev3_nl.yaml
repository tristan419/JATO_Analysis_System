price_semantics: base_msrp
extractor_type: http_text
profile:
  url: https://www.kia.com/nl/modellen/ev3/ontdekken/
  timeout_seconds: 30
  headers:
    User-Agent: Mozilla/5.0
    Accept-Language: nl-NL,nl;q=0.9,en;q=0.8
  default_currency: EUR
  default_tax_included: true
  default_price_label: Consumenten adviesprijs
  fixed_model: EV3
  fixed_jato_model: EV3
  fixed_jato_powertrain: BEV
  copy_trim_to_jato_trim: true
  match_confidence: 0.88
  match_status: review_required
  match_reason:
    kind: official_model_page_trim_price_block
    source: kia_nl_ev3_powerkraut_trim_block
