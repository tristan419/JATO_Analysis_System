  entry_patterns:
  - pattern: "price:\\s*(?P<price>\\d+)\\s*,\\s*trim:\\s*'Air'\\s*,\\s*motor:\\s*'(?P<powertrain>[^']+)'"
    official_trim: Air
    official_powertrain: BEV 58.3kWh or 81.4kWh
    jato_powertrain: BEV
    price_label: Consumenten adviesprijs
  - pattern: "price:\\s*(?P<price>\\d+)\\s*,\\s*trim:\\s*'Plus'\\s*,\\s*motor:\\s*'(?P<powertrain>[^']+)'"
    official_trim: Plus
    official_powertrain: BEV 58.3kWh or 81.4kWh
    jato_powertrain: BEV
    price_label: Consumenten adviesprijs
  - pattern: "price:\\s*(?P<price>\\d+)\\s*,\\s*trim:\\s*'Plus Advanced'\\s*,\\s*motor:\\s*'(?P<powertrain>[^']+)'"
    official_trim: Plus Advanced
    official_powertrain: BEV 58.3kWh or 81.4kWh
    jato_powertrain: BEV
    price_label: Consumenten adviesprijs
  - pattern: "price:\\s*(?P<price>\\d+)\\s*,\\s*trim:\\s*'GT-Line Business Edition'\\s*,\\s*motor:\\s*'(?P<powertrain>[^']+)'"
    official_trim: GT-Line Business Edition
    official_powertrain: BEV 81.4kWh
    jato_powertrain: BEV
    price_label: Consumenten adviesprijs
  - pattern: "price:\\s*(?P<price>\\d+)\\s*,\\s*trim:\\s*'GT-Line'\\s*,\\s*motor:\\s*'(?P<powertrain>[^']+)'"
    official_trim: GT-Line
    official_powertrain: BEV 81.4kWh
    jato_powertrain: BEV
    price_label: Consumenten adviesprijs
  - pattern: "price:\\s*(?P<price>\\d+)\\s*,\\s*trim:\\s*'GT-PlusLine'\\s*,\\s*motor:\\s*'(?P<powertrain>[^']+)'"
    official_trim: GT-PlusLine
    official_powertrain: BEV 81.4kWh
    jato_powertrain: BEV
    price_label: Consumenten adviesprijs
