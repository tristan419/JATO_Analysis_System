  - pattern: '"schema:name":"Captur esprit Alpine"(?:(?!"schema:name").)*?"schema:priceSpecification":\{"@type":"schema:UnitPriceSpecification","schema:price":"(?P<price>\d+(?:\.\d+)?)","schema:priceCurrency":"EUR","schema:validFrom":"[^"]+","schema:priceType":"SRP"\}'
