source_code: audi_q3_hr_draft_scrapling
country: 克罗地亚
brand: AUDI
source_url: https://www.audi.hr/modeli/svi-modeli
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.audi.hr/modeli/svi-modeli
  tier: http
  headless: true
  network_idle: false
  load_dom: false
  timeout_ms: 20000
  impersonate: chrome
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: '\\"pageName\\":\\"(?P<trim>Novi Q3 SUV)\\".{0,12000}?\\"grossPriceData\\":(?P<price>\d+\.\d+),\\"currency\\":\\"EUR\\".{0,1000}?\\"status\\":\\"SALE\\"'
      official_powertrain: Q3 SUV starting price ICE
      price_label: Preporučena maloprodajna cijena
  default_currency: EUR
  default_tax_included: true
  default_price_label: Preporučena maloprodajna cijena s PDV-om
  fixed_model: Q3
  fixed_jato_model: Q3
  fixed_jato_powertrain: ICE
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - plug-in hibrid
      - plug-in hybrid
      - TFSI e
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mild hybrid
      - MHEV
      - 48V
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - benzin
      - dizel
      - TFSI
      - TDI
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  match_confidence: 0.82
  match_status: review_required
  match_reason:
    kind: official_model_overview_starting_price
    source: audi_hr_model_overview
    note: Official Audi Croatia model overview embeds Novi Q3 SUV grossPriceData in EUR with SALE status.
  json_script_selector: script[type='application/ld+json']
  css:
    vehicle_container: body
    model: h2
    trim: h3
    price: '[class*="price"]'
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
