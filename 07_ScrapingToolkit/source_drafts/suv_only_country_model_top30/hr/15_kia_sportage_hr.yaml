source_code: kia_sportage_hr_draft_scrapling
country: 克罗地亚
brand: KIA
source_url: https://www.kia.hr/nova_vozila
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.kia.hr/nova_vozila
  headless: true
  timeout_ms: 30000
  text_regex:
    source_selector: body
    entry_patterns:
    - pattern: 'Novi Sportage\s+Ve[cć]\s+od\s+(?P<price>[\d.]+)\*?\s*€'
      official_trim: Novi Sportage
      official_powertrain: Kia HR model-list starting price
      price_label: Cijene vrijede uz Kia SMART financiranje
  default_currency: EUR
  default_tax_included: true
  default_price_label: Preporučena maloprodajna cijena s PDV-om
  fixed_model: SPORTAGE
  fixed_jato_model: SPORTAGE
  fixed_jato_powertrain: ICE
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_hev
      label: 'Powertrain matched: HEV'
      powertrain: HEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - plug-in hibrid
      - plug-in hybrid
      - Sportage Plug-In Hybrid
    - key: powertrain_hev
      powertrain: HEV
      keywords:
      - hibrid
      - hybrid
      - Sportage Hybrid
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mild hybrid
      - MHEV
      - blagi hibrid
      - 48V
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - benzin
      - dizel
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  css:
    vehicle_container: body
    model: h2, h3
    trim: h3
    price: '[class*="price"]'
  tier: stealth
  network_idle: true
  impersonate: chrome
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Keywords filled from official manufacturer website research (HR market).
  Replaced stale /modeli/sportage/ URL with Kia Croatia's official Nova vozila
  model list and text_regex over the visible "Novi Sportage Već od" starting
  price. Price is marked review_required because the page states SMART financing
  campaign conditions.
bootstrap_meta:
  country_model_rank: 15
  suggested_scope_kind: single_model
  sales_12m: 821.0
  model: SPORTAGE
