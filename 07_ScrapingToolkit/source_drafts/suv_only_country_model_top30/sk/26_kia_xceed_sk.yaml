source_code: kia_xceed_sk_draft_scrapling
country: 斯洛伐克
brand: KIA
source_url: https://www.kia.com/sk/nove-auta/cd-cuv/zistit-viac/
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.kia.com/sk/nove-auta/cd-cuv/zistit-viac/
  headless: true
  tier: http
  network_idle: false
  load_dom: false
  timeout_ms: 20000
  impersonate: chrome
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: '<div class="elp-trimlist-box">[\s\S]*?<span class="trim-currency">\s*(?P<price>19\s*890)\s*€\s*</span>[\s\S]*?<p class="elp_trimname">\s*(?P<trim>Kia\s+XCeed\s+Silver)\s*</p>'
      official_powertrain: ICE
      price_label: Starting price with VAT
  default_currency: EUR
  default_tax_included: true
  default_price_label: MSRP
  fixed_model: XCEED
  fixed_jato_model: XCEED
  fixed_jato_powertrain: ICE
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - ice
      - petrol
      - gasoline
      - diesel
      - combustion
      - benzin
      - nafta
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - phev
      - plug-in hybrid
      - plug in hybrid
      - plugin hybrid
      - nabijatelny hybrid
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mhev
      - mild hybrid
      - mild-hybrid
      - 48V
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
