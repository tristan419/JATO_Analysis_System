source_code: suzuki_vitara_sk_draft_scrapling
country: 斯洛伐克
brand: SUZUKI
source_url: https://www.suzuki.sk/automobily/cennik
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.suzuki.sk/automobily/cennik
  tier: http
  headless: true
  network_idle: false
  load_dom: false
  timeout_ms: 20000
  impersonate: chrome
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: '<a href="/automobily/modely/nova-vitara-hybrid#na-stiahnutie">[\s\S]*?<span>\s*(?P<trim>1,4 l BOOSTERJET MILD HYBRID COMFORT 2WD)\s*</span>[\s\S]*?<div class="e-model-price__discount">\s*AKCIA\s*18\s*990\s*€\s*</div>[\s\S]*?<div class="e-model-price__price">\s*(?P<price>24\s*540)\s*€\s*</div>'
      official_powertrain: 1.4 BOOSTERJET MILD HYBRID
      price_label: List price before Suzuki AKCIA discount
  default_currency: EUR
  default_tax_included: true
  default_price_label: MSRP
  fixed_model: VITARA
  fixed_jato_model: VITARA
  fixed_jato_powertrain: MHEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_hev
      label: 'Powertrain matched: HEV'
      powertrain: HEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mhev
      - mild hybrid
      - mild-hybrid
      - boosterjet mild hybrid
      - 48V
    - key: powertrain_hev
      powertrain: HEV
      keywords:
      - hev
      - full hybrid
      - self-charging hybrid
      - self charging hybrid
      - hybrid
      - hybridny
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - ice
      - petrol
      - gasoline
      - diesel
      - combustion
      - benzin
      - nafta
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Official Suzuki Slovakia automobile price-list page filled from manufacturer
