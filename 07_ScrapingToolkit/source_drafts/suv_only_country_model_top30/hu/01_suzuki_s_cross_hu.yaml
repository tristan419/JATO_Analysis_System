source_code: suzuki_s_cross_hu_draft_scrapling
country: 匈牙利
brand: SUZUKI
source_url: https://konfigurator.suzuki.hu/
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: http_text
profile:
  url: https://konfigurator.suzuki.hu/
  timeout_seconds: 45
  prefer_curl_fetch: true
  headers:
    Accept-Language: hu-HU,hu;q=0.9,en;q=0.8
  default_currency: HUF
  default_tax_included: true
  default_price_label: Listaár (ÁFA-val)
  fixed_model: S-CROSS
  fixed_jato_model: S-CROSS
  fixed_jato_powertrain: MHEV
  copy_trim_to_jato_trim: true
  match_confidence: 0.92
  match_status: review_required
  match_reason:
    kind: official_configurator_embedded_list_price
    source: suzuki_hu_configurator
    price_field: prices.list
    excluded_field: prices.discount
    note: The official configurator embeds each S-CROSS variation's gross list
      price separately from its discount price. This profile extracts only
      prices.list for the base MSRP fact family.
  entry_patterns:
  - pattern: '&quot;code&quot;:\{&quot;basic&quot;:&quot;(?P<trim>R5[67][0-9A-Z])&quot;(?:,&quot;panorama&quot;:&quot;R5[67][0-9A-Z]&quot;)?\}(?:(?!&quot;code&quot;).){0,900}?&quot;prices&quot;:\{&quot;list&quot;:(?P<price>\d+)'
    official_powertrain: 1.4L Boosterjet lágy hibrid
    jato_powertrain: MHEV
    price_label: Listaár (ÁFA-val)
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Replaced the unstable public model-page CSS scrape with the official Suzuki
  Hungary configurator. Its server response contains the current S-CROSS variation
  records with distinct prices.list and prices.discount fields. The regex is limited
  to standard R56/R57 S-CROSS variants and captures only prices.list, never
  campaign or fleet discount values. The separate Urban Black R5P range is excluded.
bootstrap_meta:
  country_model_rank: 1
  suggested_scope_kind: single_model
  sales_12m: 5892.0
  model: S-CROSS
