source_code: hyundai_tucson_be_official_brochures
country: 比利时
brand: HYUNDAI
source_url: https://www.hyundai.com/be/nl/tools/brochures.html
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: http_text
profile:
  url: https://www.hyundai.com/be/nl/tools/brochures.html
  timeout_seconds: 45
  curl_fallback: true
  headers:
    User-Agent: Mozilla/5.0
    Accept-Language: nl-BE,nl;q=0.9,en;q=0.8
    Accept: text/html,application/xhtml+xml,*/*;q=0.8
  entry_patterns:
  - pattern: '<h3[^>]*>\s*TUCSON\s*</h3>\s*<p[^>]*>\s*Vanaf\s*[^0-9]{0,12}(?P<price>\d{1,3}\.\d{3})'
    official_trim: TUCSON
    official_powertrain: TUCSON petrol starting price
    jato_powertrain: ICE
    price_label: Vanaf price
  - pattern: '<h3[^>]*>\s*TUCSON\s+Hybrid\s*</h3>\s*<p[^>]*>\s*Vanaf\s*[^0-9]{0,12}(?P<price>\d{1,3}\.\d{3})'
    official_trim: TUCSON Hybrid
    official_powertrain: TUCSON Hybrid starting price
    jato_powertrain: HEV
    price_label: Vanaf price
  - pattern: '<h3[^>]*>\s*TUCSON\s+Plug-in\s+Hybrid\s*</h3>\s*<p[^>]*>\s*Vanaf\s*[^0-9]{0,12}(?P<price>\d{1,3}\.\d{3})'
    official_trim: TUCSON Plug-in Hybrid
    official_powertrain: TUCSON Plug-in Hybrid starting price
    jato_powertrain: PHEV
    price_label: Vanaf price
  default_currency: EUR
  default_tax_included: true
  default_price_label: Vanaf price
  fixed_model: TUCSON
  fixed_jato_model: TUCSON
  copy_trim_to_jato_trim: true
  match_confidence: 0.82
  match_status: review_required
  match_reason:
    kind: official_brochures_price_list_starting_price
    source: hyundai_be_brochures_prijslijsten_page
    note: Official Hyundai Belgium Brochures & Prijslijsten page exposes TUCSON, TUCSON Hybrid, and TUCSON Plug-in Hybrid starting prices labeled "Vanaf"; extraction captures only those model starting prices and leaves configured trim prices to the configurator/backlog.
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
