source_code: ford_puma_be_draft_scrapling
country: 比利时
brand: FORD
source_url: https://www.nl.ford.be/alle-modellen/new-puma/aanbiedingen/particulieren
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.nl.ford.be/alle-modellen/new-puma/aanbiedingen/particulieren
  tier: http
  headless: true
  network_idle: false
  load_dom: false
  timeout_ms: 20000
  impersonate: chrome
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: 'PUMA\s+TITANIUM[\s\S]{0,12000}?Aanbevolen\s+catalogusprijs[\s\S]{0,1000}?€\s*(?P<price>\d{2}\.\d{3})'
      official_trim: PUMA TITANIUM 1.0i EcoBoost 125pk mHEV M6
      official_powertrain: MHEV
      price_label: Aanbevolen catalogusprijs incl. btw
  default_currency: EUR
  default_tax_included: true
  default_price_label: Aanbevolen catalogusprijs incl. btw
  fixed_model: PUMA
  fixed_jato_model: PUMA
  fixed_jato_powertrain: MHEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  match_confidence: 0.86
  match_status: review_required
  match_reason:
    kind: official_offer_page_catalog_price
    source: ford_be_puma_private_offers_page
    excluded_fields:
    - Korting
    - Nettoprijs
    - Promotionele prijs
    note: Official Ford Belgium offer page exposes the recommended catalogue price before discount and net promotional price fields.
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_bev
      powertrain: BEV
      keywords:
      - bev
      - ev
      - electric
      - battery electric
      - fully electric
      - electric vehicle
      - elektrisch
      - volledig elektrisch
      - electrique
      - 100% electrique
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mhev
      - mild hybrid
      - mild-hybrid
      - 48V
      - hybride leger
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - ice
      - petrol
      - gasoline
      - diesel
      - combustion
      - benzine
      - essence
      - thermique
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Official Ford Belgium Puma private-offers page. The text regex anchors the
  PUMA TITANIUM MHEV block and extracts only the "Aanbevolen catalogusprijs" before
  Korting, Nettoprijs, and promotional price fields. This is a tax-included
  model-entry catalogue price and remains review-required pending a current
  trim-level price-list PDF that is directly fetchable in the runner environment.
bootstrap_meta:
  country_model_rank: 21
  suggested_scope_kind: single_model
  sales_12m: 3458.0
  model: PUMA
