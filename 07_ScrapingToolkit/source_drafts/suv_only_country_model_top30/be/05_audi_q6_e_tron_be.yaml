source_code: audi_q6_e_tron_be_draft_scrapling
country: 比利时
brand: AUDI
source_url: https://www.audi.be/nl/modellen/suv/
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.audi.be/nl/modellen/suv/
  tier: http
  headless: true
  network_idle: false
  load_dom: false
  timeout_ms: 20000
  impersonate: chrome
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: '<h4[^>]*carlineTitle[^>]*>\s*Q6\s+SUV\s+e-tron\s*</h4>[\s\S]{0,1200}?data-testid="price">Vanaf\s*:\s*EUR\s*(?P<price>\d{2}\.\d{3},\d{2})</span>[\s\S]{0,300}?incl\.\s*BTW'
      official_trim: Q6 SUV e-tron entry price
      official_powertrain: Elektrisch
      price_label: Vanaf incl. BTW
  default_currency: EUR
  default_tax_included: true
  default_price_label: Vanaf incl. BTW
  fixed_model: Q6 E-TRON
  fixed_jato_model: Q6 E-TRON
  fixed_jato_powertrain: BEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  match_confidence: 0.86
  match_status: review_required
  match_reason:
    kind: official_range_page_model_starting_price
    source: audi_be_suv_model_overview
    note: Official Audi Belgium SUV range page exposes the Q6 SUV e-tron starting price including VAT in its model card.
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_bev
      powertrain: BEV
      keywords:
      - bev
      - ev
      - electric
      - battery electric
      - fully electric
      - electric vehicle
      - elektrisch
      - volledig elektrisch
      - electrique
      - 100% electrique
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Official Audi Belgium SUV range page. The regex anchors the Q6 SUV e-tron
  model card and extracts only the tax-included "Vanaf" entry price. This is a
  model-level price and remains review-required until a current trim-level
  official price-list or configurator API is available.
bootstrap_meta:
  country_model_rank: 5
  suggested_scope_kind: single_model
  sales_12m: 5193.0
  model: Q6 E-TRON
