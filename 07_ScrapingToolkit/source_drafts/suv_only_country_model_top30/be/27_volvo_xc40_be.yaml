source_code: volvo_xc40_be_draft_scrapling
country: 比利时
brand: VOLVO
source_url: https://www.volvocars.com/nl-be/cars/xc40/
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.volvocars.com/nl-be/cars/xc40/
  tier: http
  headless: true
  network_idle: false
  load_dom: false
  timeout_ms: 20000
  impersonate: chrome
  text_regex:
    source_selector: body
    include_element_html: true
    entry_patterns:
    - pattern: 'data-testid="equipmentLevelsItem:title"[^>]*>XC40\s*<span[^>]*>Essential</span></h3>[\s\S]{0,1000}?data-testid="equipmentLevelsItem:price"[^>]*>vanaf\s*<span>€\s*(?P<price>\d{2}\.\d{3})</span>\s*\(incl\.\s*btw\)'
      official_trim: XC40 Essential MY27
      official_powertrain: Mild-hybride MHEV
      price_label: Vanaf incl. btw
  default_currency: EUR
  default_tax_included: true
  default_price_label: Vanaf incl. btw
  fixed_model: XC40
  fixed_jato_model: XC40
  fixed_jato_powertrain: MHEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  match_confidence: 0.88
  match_status: review_required
  match_reason:
    kind: official_model_equipment_level_list_price
    source: volvo_be_xc40_model_page
    excluded_fields:
    - Financiële Renting
    - Private Lease
    - per maand
    - Limited Edition
    note: Official Volvo Belgium XC40 model page exposes the Essential MHEV equipment-level price including VAT separately from finance and promotional offer blocks.
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_bev
      powertrain: BEV
      keywords:
      - bev
      - ev
      - electric
      - battery electric
      - fully electric
      - electric vehicle
      - elektrisch
      - volledig elektrisch
      - electrique
      - 100% electrique
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - phev
      - plug-in hybrid
      - plug in hybrid
      - plugin hybrid
      - plug-in hybride
      - stekkerhybride
      - hybride rechargeable
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mhev
      - mild hybrid
      - mild-hybrid
      - 48V
      - hybride leger
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - ice
      - petrol
      - gasoline
      - diesel
      - combustion
      - benzine
      - essence
      - thermique
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Official Volvo Belgium XC40 model page. The regex anchors the Essential
  MHEV equipment-level title and its adjacent tax-included price. Finance, private
  lease, monthly payment, and Limited Edition promotional blocks are not extracted.
bootstrap_meta:
  country_model_rank: 27
  suggested_scope_kind: single_model
  sales_12m: 2994.0
  model: XC40
