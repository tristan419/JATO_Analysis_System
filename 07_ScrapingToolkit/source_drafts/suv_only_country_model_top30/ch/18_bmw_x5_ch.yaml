source_code: bmw_x5_ch_draft_scrapling
country: 瑞士
brand: BMW
source_url: https://www.bmw.ch/de/bmw-neuwagen.html?series=x
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.bmw.ch/de/bmw-neuwagen.html?series=x
  tier: http
  headless: true
  network_idle: true
  impersonate: chrome
  default_currency: CHF
  default_tax_included: true
  default_price_label: BMW Switzerland Ab Preis inkl. MwSt
  text_regex:
    source_selector: body
    entry_patterns:
    - pattern: 'SUV\s+Neu\s+X5\s+Modelle\s+Diesel\s+Ab\s+CHF\s*(?P<price>\d{1,3}(?:[’''\s]\d{3})*)'
      official_trim: X5 Modelle Diesel
      official_powertrain: ICE
      price_label: BMW Switzerland Ab Preis inkl. MwSt
  fixed_model: X5
  fixed_jato_model: X5
  fixed_jato_powertrain: null
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - Plug-in-Hybrid
      - xDrive50e
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - Mild-Hybrid
      - 48V
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - Benzin
      - Diesel
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Keywords filled from official manufacturer website research (CH market).
  Updated from retired /modelle/x-modelle URL to BMW Switzerland's current
  official new-car overview and narrowed extraction to the visible X5 Diesel
  "Ab CHF" MSRP text, avoiding the overview card that exposes a zero PHEV price.
bootstrap_meta:
  country_model_rank: 18
  suggested_scope_kind: single_model
  sales_12m: 1962.0
  model: X5
