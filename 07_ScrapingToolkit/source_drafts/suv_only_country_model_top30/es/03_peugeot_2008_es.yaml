schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Replaced the todo.invalid scaffold with Peugeot Spain's official store
  data. The page displays a lower promotional cash/monthly finance price, but
  the embedded offer JSON separately exposes cash.catalogAmount for the 2008
  Style Turbo 100 card; extraction targets that catalog amount and keeps
  review_required because the store contains both catalog and promotional
  prices.
