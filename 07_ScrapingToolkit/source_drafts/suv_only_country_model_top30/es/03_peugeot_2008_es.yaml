brand: PEUGEOT
source_url: https://store.peugeot.es/
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: http_text
profile:
  url: https://store.peugeot.es/
  timeout_seconds: 45
  curl_fallback: true
  headers:
