  entry_patterns:
  - pattern: '"externalId"\s*:\s*"1PP1SYHJLKB02PH2\+0MM00NSU\+0PG90RFX".*?"model"\s*:\s*\{[^}]*"title"\s*:\s*"2008"\s*\}.*?"trim"\s*:\s*\{[^}]*"title"\s*:\s*"(?P<trim>[^"]+)".*?"engine"\s*:\s*\{[^}]*"title"\s*:\s*"(?P<powertrain>[^"]+)".*?"cash"\s*:\s*\{[^}]*"catalogAmount"\s*:\s*(?P<price>\d+(?:\.\d+)?)'
