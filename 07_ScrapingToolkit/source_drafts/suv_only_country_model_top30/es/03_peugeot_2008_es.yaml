  default_currency: EUR
  default_tax_included: true
  default_price_label: PVP recomendado
  fixed_model: '2008'
  fixed_jato_model: '2008'
  copy_trim_to_jato_trim: true
  match_confidence: 0.86
  match_status: review_required
  match_reason:
    kind: official_store_embedded_catalog_amount
    source: peugeot_es_store_next_data
