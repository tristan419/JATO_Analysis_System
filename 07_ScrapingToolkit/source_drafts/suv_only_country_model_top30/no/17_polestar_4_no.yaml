    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_bev
      powertrain: BEV
      keywords:
      - elbil
      - electric
      - Polestar 4
      - helelektrisk
  auto_accept_gates:
