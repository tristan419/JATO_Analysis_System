  tier: stealth
  headless: true
  network_idle: true
  impersonate: chrome
  text_regex:
    source_selector: body
    entry_patterns:
    - pattern: 'CUPRA Formentor 1\.5 eTSI 150 HK DSG\s+vejl\. udsalgspris\s+(?P<price>\d{3}\.\d{3})\s*kr\.'
      official_trim: 1.5 eTSI 150 HK DSG
      official_powertrain: MHEV
    - pattern: 'CUPRA Formentor VZ 2\.0 TSI 4x4 333 HK DSG\s+vejl\. udsalgspris\s+(?P<price>\d{3}\.\d{3})\s*kr\.'
      official_trim: VZ 2.0 TSI 4x4 333 HK DSG
      official_powertrain: ICE
    - pattern: 'CUPRA Formentor VZ5 2\.5 TSI 4x4 390 HK DSG\s+vejl\. udsalgspris\s+(?P<price>\d{3}\.\d{3})\s*kr\.'
      official_trim: VZ5 2.5 TSI 4x4 390 HK DSG
      official_powertrain: ICE
  default_currency: DKK
  default_tax_included: true
  default_price_label: Vejl. udsalgspris
  fixed_model: FORMENTOR
  fixed_jato_model: FORMENTOR
  fixed_jato_powertrain: null
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - eHybrid
      - plug-in hybrid
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - eTSI
      - mild hybrid
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - TSI
      - benzin
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
