source_code: kia_ev3_dk_draft_scrapling
country: 丹麦
brand: KIA
source_url: https://www.kia.com/dk/modeller/ev3/prisliste/
source_type: official_price_list
price_semantics: base_msrp
extractor_type: pdf_text
profile:
  url: https://api.kiaonline.dk/dokumenter/ev3-priser.pdf
  timeout_seconds: 60
  retry_attempts: 3
  retry_delay_seconds: 1.0
  default_currency: DKK
  default_tax_included: true
  default_price_label: Pris inkl. leveringsomkostninger
  fixed_model: EV3
  fixed_jato_model: EV3
  fixed_jato_powertrain: BEV
  copy_trim_to_jato_trim: true
  match_confidence: 0.86
  match_status: review_required
  match_reason:
    kind: pdf_price_list
    source: official_kia_dk_prisliste
    note: Official Kia Denmark EV3 price-list PDF exposes model-year 2027 variant prices including delivery costs.
  entry_patterns:
  - pattern: 'Modelprogram(?:(?!Priser og specifikationer).)*?Access\s+Standard Range \(FWD\).*?460 kr\.\s+(?P<price>\d{3}\.\d{3}) kr\.'
    official_trim: Access Standard Range
    official_powertrain: BEV
    jato_powertrain: BEV
  - pattern: 'Modelprogram(?:(?!Priser og specifikationer).)*?Access\s+Standard Range \(FWD\).*?Long Range \(FWD\).*?460 kr\.\s+(?P<price>\d{3}\.\d{3}) kr\.'
    official_trim: Access Long Range
    official_powertrain: BEV
    jato_powertrain: BEV
  - pattern: 'Modelprogram(?:(?!Priser og specifikationer).)*?Prestige\s+Standard Range \(FWD\).*?460 kr\.\s+(?P<price>\d{3}\.\d{3}) kr\.'
    official_trim: Prestige Standard Range
    official_powertrain: BEV
    jato_powertrain: BEV
  - pattern: 'Modelprogram(?:(?!Priser og specifikationer).)*?Prestige\s+Standard Range \(FWD\).*?Long Range \(FWD\).*?460 kr\.\s+(?P<price>\d{3}\.\d{3}) kr\.'
    official_trim: Prestige Long Range
    official_powertrain: BEV
    jato_powertrain: BEV
  - pattern: 'Modelprogram(?:(?!Priser og specifikationer).)*?Upgrade\s+Long Range \(FWD\).*?460 kr\.\s+(?P<price>\d{3}\.\d{3}) kr\.'
    official_trim: Upgrade Long Range
    official_powertrain: BEV
    jato_powertrain: BEV
  - pattern: 'Modelprogram(?:(?!Priser og specifikationer).)*?GT-Line\s+Long Range \(FWD\).*?460 kr\.\s+(?P<price>\d{3}\.\d{3}) kr\.'
    official_trim: GT-Line Long Range
    official_powertrain: BEV
    jato_powertrain: BEV
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Draft source repaired to use Kia Denmark's official EV3 prisliste PDF.
  The public /prisliste/ page redirects to the API-hosted PDF. Regexes are
  anchored to the Modelprogram section to avoid matching color/accessory prices.
