extractor_type: scrapling
profile:
  url: https://modelinformation.toyota.dk/Toyota/specs/Prislister/yaris-cross-prisliste/
  headless: true
  default_currency: DKK
  default_tax_included: true
  default_price_label: Vejledende udsalgspris inkl. lev.omk.
  fixed_model: YARIS CROSS
  fixed_jato_model: YARIS CROSS
  fixed_jato_powertrain: HEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_hev
      label: 'Powertrain matched: HEV'
      powertrain: HEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_hev
      powertrain: HEV
      keywords:
      - hybrid
      - 1.5 hybrid
      - yaris cross
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  text_regex:
    source_selector: script
    entry_patterns:
    - pattern: 'Vejl\. udsalgspris inkl\. lev\.omk\.¹\s+Active\s+(?P<price>\d{3}\.\d{3})'
      official_trim: Active
      official_powertrain: HEV
    - pattern: 'Active\s+\d{3}\.\d{3}\s+Style\s+(?P<price>\d{3}\.\d{3})'
      official_trim: Style
      official_powertrain: HEV
    - pattern: 'Style\s+\d{3}\.\d{3}\s+Executive\s+(?P<price>\d{3}\.\d{3})'
      official_trim: Executive
      official_powertrain: HEV
    - pattern: 'Executive\s+\d{3}\.\d{3}\s+GR Sport\s+(?P<price>\d{3}\.\d{3})'
      official_trim: GR Sport
      official_powertrain: HEV
  tier: http
  network_idle: true
  impersonate: chrome
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
