    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  json_script_selector: script[type='application/ld+json']
  text_regex:
    source_selector: script
    entry_patterns:
    - pattern: '"name":"IONIQ 5","url":"/modeller/ioniq-5","price":"(?P<price>\d{3}\.\d{3}) kr\.","isCampaign":false'
