    model: h2, h3
    trim: h3
    price: '[class*="price"]'
  tier: stealth
  network_idle: true
  impersonate: chrome
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
