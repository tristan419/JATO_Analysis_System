# Shared Volkswagen configurator defaults for trim-card -> engine-card flows.
browser: chromium
headless: true
wait_until: domcontentloaded
page_timeout_ms: 120000
viewport_width: 1440
viewport_height: 1200
initial_ready_selector: '[data-testid="trimcard"]'
initial_ready_timeout_ms: 60000
startup_dismiss_selectors:
  - '#vwaUBNCloseButton'
  - '#ensRejectAll'
  - '#tcf2__ensCancel'
  - '#onetrust-reject-all-handler'
cookie_banner_selector: '#ensNotifyBanner'
cookie_reject_selector: '#ensRejectAll'
trim_card_selector: '[data-testid="trimcard"]'
trim_name_selector: h3
trim_card_wait_ms: 1200
next_step_selector: '[data-testid="smart-offer-trim-next-step-cta"]'
detail_ready_selector: '[data-testid="engine-card"]'
detail_card_selector: '[data-testid="engine-card"]'
detail_price_selector: '[data-testid="price-container"]'
detail_card_wait_ms: 1500
powertrain_line_count: 2
combine_trim_and_powertrain: true
combined_trim_separator: ' | '
default_tax_included: true
match_confidence: 0.84
match_status: review_required
structured_fields:
  edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true