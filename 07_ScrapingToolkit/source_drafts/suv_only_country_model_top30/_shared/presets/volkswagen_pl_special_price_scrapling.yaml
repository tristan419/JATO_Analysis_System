# Shared Volkswagen Poland model-page defaults for pages that expose a
# campaign total price block ahead of finance metrics.
tier: http
headless: true
network_idle: true
impersonate: chrome
fixed_jato_powertrain: null
model_rules: []
skip_if_model_unmapped: false
copy_trim_to_jato_trim: true
confidence_rules:
  base: 0.2
  fixed_model_bonus: 0.18
  fixed_jato_model_bonus: 0.12
  model_rule_bonus: 0.12
  trim_present_bonus: 0.1
  copy_trim_to_jato_trim_bonus: 0.09
  parsed_price_text_bonus: 0.03
  currency_bonus: 0.01
  price_label_bonus: 0.02
  price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
  powertrain_keyword_bonuses: []
  powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
  clamp_min: 0.0
  clamp_max: 1.0
structured_fields:
  edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
auto_accept_gates:
  review_threshold: 0.95
  semi_auto_threshold: 0.98
  require_powertrain_match: true
  force_review_if_powertrain_missing: true
  force_review_if_powertrain_ambiguous: true
  force_review_for_special_edition: true
json_script_selector: null
css:
  vehicle_container: '[data-testid="car-technical-data-section-v2"] ul:first-of-type > li:first-child'
  price: 'span:nth-of-type(2)'
default_price_label: Cena specjalna
