# Skoda trim overview — VW Group, probe-verified on skoda.se
# Uses data-component selectors and .price-value classes
browser: chromium
headless: true
wait_until: domcontentloaded
page_timeout_ms: 120000
viewport_width: 1440
viewport_height: 1200
initial_ready_selector: '.price-value, [data-component="moveup"], h2'
initial_ready_timeout_ms: 60000
startup_dismiss_selectors:
  - '#ensRejectAll'
  - '#onetrust-reject-all-handler'
  - '#didomi-notice-agree-button'
cookie_banner_selector: '#ensNotifyBanner'
cookie_reject_selector: '#ensRejectAll'
trim_card_selector: '[data-component="moveup"], [class*="trim"], [class*="model-card"]'
trim_name_selector: 'h2, h3'
detail_price_selector: '.price-value, .full-price, [class*="prices"]'
trim_card_wait_ms: 1200
extract_from_trim_cards: true
combine_trim_and_powertrain: false
default_tax_included: true
match_confidence: 0.80
match_status: review_required
