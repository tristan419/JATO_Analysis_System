source_code: mercedes_eqa_at_draft_scrapling
country: 奥地利
brand: MERCEDES
source_url: https://www.mercedes-benz.at/passengercars/models/suv/eqa/overview.html
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.mercedes-benz.at/passengercars/models/suv/eqa/overview.html
  tier: stealth
  headless: true
  network_idle: true
  impersonate: chrome
  text_regex:
    source_selector: script
    entry_patterns:
    - pattern: '"aria":"EQA".{0,4000}?"price":"ab\s*(?:€|\\u20ac)\s*(?P<price>\d{2}\.\d{3},\d{2})"'
      official_trim: EQA starting price
      official_powertrain: BEV electric
      price_label: Listenpreis inkl. NoVA und 20% MwSt.
  default_currency: EUR
  default_tax_included: true
  default_price_label: Listenpreis inkl. NoVA und 20% MwSt.
  fixed_model: EQA
  fixed_jato_model: EQA
  fixed_jato_powertrain: null
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_bev
      label: 'Powertrain matched: BEV'
      powertrain: BEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_bev
      powertrain: BEV
      keywords:
      - BEV
      - eqa
      - electric
      - elektro
      - elektrisch
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  json_script_selector: script[type='application/ld+json']
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Manually added. Replaced broad CSS fallback with text_regex over the official
  Mercedes-Benz Austria model-navigation payload for the EQA card starting price.
bootstrap_meta:
  country_model_rank: 31
  suggested_scope_kind: single_model
  sales_12m: null
