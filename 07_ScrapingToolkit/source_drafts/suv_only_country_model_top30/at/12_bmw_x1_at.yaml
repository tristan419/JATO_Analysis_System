source_code: bmw_x1_at_draft_scrapling
country: 奥地利
brand: BMW
source_url: https://www.bmw.at/de/konfigurator.html
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.bmw.at/de/konfigurator.html
  tier: http
  headless: true
  network_idle: true
  impersonate: chrome
  attr_json:
    vehicle_container: ".cmp-allmodelscard"
    filter_attr: "data-card-filter-info"
    tracking_attr: "data-tracking-attributes"
    price_key: "price"
    fuel_key: "fuelType"
    category_key: "category"
    series_key: "series"
    name_key: "name"
    range_key: "range"
  text_regex:
    source_selector: body
    entry_patterns:
    - pattern: 'SUV\s+X1\s+Modelle\s+Benzin\s+Ab\s+€\s*(?P<price>\d{1,3}(?:\.\d{3})*(?:,\d{2})?)'
      official_trim: X1 Modelle Benzin
      official_powertrain: ICE
      price_label: BMW Konfigurator Ab Preis
  default_currency: EUR
  default_tax_included: true
  default_price_label: BMW Konfigurator Ab Preis
  fixed_model: null
  fixed_jato_model: null
  fixed_jato_powertrain: null
  match_confidence: 0.82
  match_status: review_required
  match_reason:
    kind: official_configurator_overview_from_price
    source: bmw_at_configurator
    note: Official BMW Austria configurator overview exposes X1 model card prices.
  model_rules:
  - key: model_x1
    jato_model: X1
    official_model: X1
    keywords:
    - BMW X1
  skip_if_model_unmapped: true
  copy_trim_to_jato_trim: true
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      max: 0
      delta: 0.0
    - key: price_band_mid
      label: Mid price band matched
      min: 0
      max: 0
      delta: 0.01
    - key: price_band_high
      label: High price band matched
      min: 0
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_phev
      label: 'Powertrain matched: PHEV'
      powertrain: PHEV
      delta: 0.03
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    edition_rules:
    - key: edition_special
      label: Special Edition
      keyword: special edition
      special: true
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - Plug-in-Hybrid
      - xDrive25e
      - xDrive30e
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - Mild-Hybrid
      - 48V
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - Benzin
      - Diesel
      - sDrive18i
      - xDrive23d
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
  json_script_selector: script[type='application/ld+json']
  css:
    vehicle_container: body
    model: h1
    trim: h2, h3
    price: '[class*="price"]'
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Keywords filled from official manufacturer website research (AT market).
  Uses the official BMW Austria configurator overview via static HTTP and the
  embedded allmodels card JSON, avoiding browser automation failures on
  configure.bmw.at.
bootstrap_meta:
  country_model_rank: 12
  suggested_scope_kind: single_model
  sales_12m: 2845.0
  model: X1
