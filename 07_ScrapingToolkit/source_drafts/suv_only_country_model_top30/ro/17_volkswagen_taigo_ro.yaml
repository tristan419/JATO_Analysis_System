  default_tax_included: true
  default_price_label: Preț recomandat incl. TVA
  fixed_model: TAIGO
  fixed_jato_model: TAIGO
  copy_trim_to_jato_trim: true
  match_confidence: 0.82
  match_status: review_required
  match_reason:
    kind: official_model_page_entry_price
    source: volkswagen_ro_taigo_model_page
    note: Official Volkswagen Romania Taigo model page exposes a static price block labeled "Preț" with "incl. TVA"; the global disclaimer states displayed prices are recommended prices including TVA, so the extractor captures the gross recommended entry price and keeps it review_required because trim/powertrain are not explicit beside the price.
  structured_fields:
    powertrain_rules:
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - ice
      - petrol
      - gasoline
      - diesel
      - combustion
      - benzina
      - motorina
schedule:
