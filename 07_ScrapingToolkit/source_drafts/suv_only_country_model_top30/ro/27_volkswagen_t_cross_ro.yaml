source_code: volkswagen_t_cross_ro_draft_scrapling
country: 罗马尼亚
brand: VOLKSWAGEN
source_url: https://configurator.volkswagen.ro/cc-ro/ro_RO_VW22/V/models
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: http_json
profile:
  url: https://configurator.volkswagen.ro/cc-ro/be/ro_RO_VW22/api/v2/modelgroup?brand=V
  method: GET
  headers:
    Accept-Language: ro-RO,ro;q=0.9,en;q=0.8
  default_currency: EUR
  default_tax_included: true
  default_price_label: Pret recomandat
  fixed_model: T-CROSS
  fixed_jato_model: T-CROSS
  copy_trim_to_jato_trim: true
  match_confidence: 0.84
  match_status: review_required
  match_reason:
    kind: official_configurator_modelgroup_api
    source: volkswagen_ro_configurator_modelgroup_api
    note: Official Volkswagen Romania configurator modelgroup API exposes the T-Cross entry gross recommended price. The configurator labels the model-list price as "Pret recomandat" and the site disclaimer states displayed website prices are recommended selling prices; keep review_required because the modelgroup price is an entry price without explicit trim/powertrain detail.
  filters:
  - path: name
    equals: T-Cross
  field_mapping:
    vehicles_path: modelgroups
    model: name
    trim: name
    price: price.gross
    currency: ''
    tax_included: ''
    price_label: ''
    availability: additionalText
  structured_fields:
    powertrain_rules:
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - ice
      - petrol
      - gasoline
      - diesel
      - combustion
      - benzina
      - motorina
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
