source_code: volkswagen_tiguan_ro_draft_scrapling
country: 罗马尼亚
brand: VOLKSWAGEN
source_url: https://www.volkswagen.ro/modele-si-configurator/toate-modelele
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: http_text
profile:
  url: https://www.volkswagen.ro/modele-si-configurator/toate-modelele
  timeout_seconds: 45
  headers:
    User-Agent: Mozilla/5.0
    Accept-Language: ro-RO,ro;q=0.9,en;q=0.8
  entry_patterns:
  - pattern: '>Noul\s+Tiguan</h3>[\s\S]{0,260}?De la\s*<!-- -->\s*(?P<price>[\d\.\s]+)EUR<!-- -->\s*incl\. TVA'
    official_trim: Noul Tiguan starting price
    official_powertrain: null
    price_label: Preț recomandat incl. TVA
  default_currency: EUR
  default_tax_included: true
  default_price_label: Preț recomandat incl. TVA
  fixed_model: TIGUAN
  fixed_jato_model: TIGUAN
  copy_trim_to_jato_trim: true
  match_confidence: 0.82
  match_status: review_required
  match_reason:
    kind: official_model_overview_entry_price
    source: volkswagen_ro_all_models_page
    note: Official Volkswagen Romania model overview exposes the Tiguan "De la" price; the global disclaimer states displayed prices are recommended prices including TVA, so the extractor captures the gross recommended entry price and keeps it review_required because trim/powertrain are not explicit beside the price.
  structured_fields:
    powertrain_rules:
    - key: powertrain_phev
      powertrain: PHEV
      keywords:
      - phev
      - plug-in hybrid
      - plug in hybrid
      - plugin hybrid
      - hibrid plug-in
    - key: powertrain_mhev
      powertrain: MHEV
      keywords:
      - mhev
      - mild hybrid
      - mild-hybrid
      - 48V
      - hibrid usor
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - ice
      - petrol
      - gasoline
      - diesel
      - combustion
      - benzina
      - motorina
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
