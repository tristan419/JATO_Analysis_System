source_code: renault_captur_it_draft_scrapling
country: 意大利
brand: RENAULT
source_url: https://www.renault.it/veicoli-ibridi/captur.html
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.renault.it/veicoli-ibridi/captur.html
  tier: http
  headless: true
  network_idle: false
  impersonate: chrome
  text_regex:
    source_selector: body
    entry_patterns:
    - pattern: 'Versione\s+evolution.*?prezzo\s+a\s+partire\s+da\s+(?P<price>23\.576)\s*€\s+CAPTUR\s+evolution\s+ECO-G\s+120\s+MY26'
      official_trim: evolution
      official_powertrain: ECO-G 120
      price_label: Prezzo di listino, IVA inclusa
    - pattern: 'Versione\s+techno.*?prezzo\s+a\s+partire\s+da\s+(?P<price>26\.124)\s*€\s+CAPTUR\s+techno\s+TCe\s+115\s+MY26'
      official_trim: techno
      official_powertrain: TCe 115
      price_label: Prezzo di listino, IVA inclusa
  default_currency: EUR
  default_tax_included: true
  default_price_label: Prezzo di listino, IVA inclusa
  fixed_model: CAPTUR
  fixed_jato_model: CAPTUR
  fixed_jato_powertrain: null
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  match_reason:
    kind: official_model_page
    source: official_renault_it
    page_audited_on: '2026-07-20'
    price_scope: my26_trim_starting_list_price
    note: Official cash list prices for the current MY26 grades. The 24,900 EUR
      full-hybrid campaign price and finance terms are excluded.
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      min: 23000
      max: 27000
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_lpg
      label: 'Powertrain matched: LPG'
      powertrain: LPG
      delta: 0.03
    - key: powertrain_ice
      label: 'Powertrain matched: ICE'
      powertrain: ICE
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  structured_fields:
    powertrain_rules:
    - key: powertrain_lpg
      powertrain: LPG
      keywords:
      - eco-g
      - gpl
    - key: powertrain_ice
      powertrain: ICE
      keywords:
      - tce
      - benzina
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Replaced the obsolete 404 URL and generic CSS selector with current MY26
  grade-scoped list prices on the official Captur page.
bootstrap_meta:
  country_model_rank: 8
  suggested_scope_kind: single_model
  sales_12m: 24978.0
  model: CAPTUR
