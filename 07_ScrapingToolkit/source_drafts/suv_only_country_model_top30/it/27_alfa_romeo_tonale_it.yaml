      price_label: Prezzo di listino, IVA e MIS incluse
    - pattern: 'SPRINT\s+Prezzo\s+di\s+listino\s+da\s+(?P<price>43\.550)\s*€'
      official_trim: Sprint
      official_powertrain: 1.6 Diesel 130 CV
      price_label: Prezzo di listino, IVA e MIS incluse
    - pattern: 'TI\s+Prezzo\s+di\s+listino\s+da\s+(?P<price>46\.300)\s*€'
      official_trim: TI
      official_powertrain: 1.6 Diesel 130 CV
      price_label: Prezzo di listino, IVA e MIS incluse
    - pattern: 'SPORT\s+SPECIALE\s+Prezzo\s+di\s+listino\s+da\s+(?P<price>46\.950)\s*€'
      official_trim: Sport Speciale
      official_powertrain: 1.6 Diesel 130 CV
      price_label: Prezzo di listino, IVA e MIS incluse
    - pattern: 'VELOCE\s+Prezzo\s+di\s+listino\s+da\s+(?P<price>49\.050)\s*€'
