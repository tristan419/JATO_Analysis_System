source_code: bmw_x3_it_draft_scrapling
country: 意大利
brand: BMW
source_url: https://www.bmw.it/it/configuratore.html
source_type: manufacturer_official
price_semantics: base_msrp
extractor_type: scrapling
profile:
  url: https://www.bmw.it/it/configuratore.html
  tier: stealth
  headless: true
  network_idle: true
  impersonate: chrome
  text_regex:
    source_selector: body
    entry_patterns:
    - pattern: 'SUV\s+Nuovo\s+X3\s+Modelli\s+Benzina\s+Da\s+(?P<price>66\.200)\s*€'
      official_trim: X3 Benzina
      official_powertrain: xDrive20 48V mild hybrid petrol
      price_label: Prezzo raccomandato, IVA inclusa e consegna esclusa
  default_currency: EUR
  default_tax_included: true
  default_price_label: Prezzo raccomandato, IVA inclusa e consegna esclusa
  fixed_model: X3
  fixed_jato_model: X3
  fixed_jato_powertrain: MHEV
  model_rules: []
  skip_if_model_unmapped: false
  copy_trim_to_jato_trim: true
  match_reason:
    kind: official_configurator_model_card
    source: official_bmw_it
    page_audited_on: '2026-07-20'
    price_scope: petrol_model_starting_price
    note: Model-scoped recommended starting price including 22% VAT and excluding
      delivery. Other BMW model cards are excluded.
  confidence_rules:
    base: 0.2
    fixed_model_bonus: 0.18
    fixed_jato_model_bonus: 0.12
    model_rule_bonus: 0.12
    trim_present_bonus: 0.1
    copy_trim_to_jato_trim_bonus: 0.09
    parsed_price_text_bonus: 0.03
    currency_bonus: 0.01
    price_label_bonus: 0.02
    trim_keyword_bonuses: []
    price_band_bonuses:
    - key: price_band_entry
      label: Entry price band matched
      min: 66000
      max: 67000
      delta: 0.03
    powertrain_keyword_bonuses: []
    powertrain_bonuses:
    - key: powertrain_mhev
      label: 'Powertrain matched: MHEV'
      powertrain: MHEV
      delta: 0.03
    clamp_min: 0.0
    clamp_max: 1.0
  auto_accept_gates:
    review_threshold: 0.95
    semi_auto_threshold: 0.98
    require_powertrain_match: true
    force_review_if_powertrain_missing: true
    force_review_if_powertrain_ambiguous: true
    force_review_for_special_edition: true
schedule:
  frequency: manual_only
  run_window_start: 00:00
  run_window_end: 05:00
  preferred_weekday: monday
notes: Replaced the generic configurator CSS selector, which returned the same
  unrelated 35,500 EUR price as X1, with the X3 petrol model-card contract.
bootstrap_meta:
  country_model_rank: 30
  suggested_scope_kind: single_model
  sales_12m: 9280.0
  model: X3
