<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JATO App Platform</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .bootstrap-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1119;
        color: #e5edf7;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .bootstrap-loading__panel {
        width: min(360px, calc(100vw - 48px));
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: #101722;
        padding: 24px;
      }

      .bootstrap-loading__kicker {
        margin: 0 0 12px;
        color: #60a5fa;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .bootstrap-loading__title {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .bootstrap-loading__detail {
        margin: 8px 0 18px;
        color: #94a3b8;
        font-size: 14px;
      }

      .bootstrap-loading__bar {
        height: 3px;
        overflow: hidden;
        background: #1e293b;
      }

      .bootstrap-loading__bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        background: #2563eb;
        animation: bootstrap-loading-bar 1.2s ease-in-out infinite;
      }

      @keyframes bootstrap-loading-bar {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bootstrap-loading" role="status" aria-live="polite">
        <div class="bootstrap-loading__panel">
          <p class="bootstrap-loading__kicker">JATO ANALYSIS SYSTEM</p>
          <p class="bootstrap-loading__title">Loading workspace</p>
          <p class="bootstrap-loading__detail">Preparing the nearest access route.</p>
          <div class="bootstrap-loading__bar"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var routeHosts = { cn: "www.ojeur.cloud", intl: "intl.ojeur.cloud" };
        var decisionKey = "jato_route_decision_v2";
        var manualKey = "jato_route_manual_v1";
        var probeInFlightKey = "jato_route_probe_inflight_v1";
        var probeTimeoutMs = 1800;
        var redirectMarginMs = 450;
        var autoDecisionTtlMs = 2 * 60 * 60 * 1000;
        var host = window.location.hostname;
        var currentTarget = targetForHost(host);
        var searchParams = new URLSearchParams(window.location.search);

        function targetForHost(value) {
          if (value === routeHosts.cn || value === "ojeur.cloud") return "cn";
          if (value === routeHosts.intl) return "intl";
          return null;
        }

        function targetHost(target) {
          return routeHosts[target] || "";
        }

        function readDecision(key) {
          try {
            var raw = window.localStorage.getItem(key);
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if ((parsed.target !== "cn" && parsed.target !== "intl") || parsed.expiresAt < Date.now()) {
              window.localStorage.removeItem(key);
              return null;
            }
            return parsed;
          } catch (_error) {
            return null;
          }
        }

        function saveDecision(payload) {
          window.localStorage.setItem(payload.source === "manual" ? manualKey : decisionKey, JSON.stringify(payload));
        }

        function setTransferParams(url, payload) {
          url.searchParams.set("jatoRouteTarget", payload.target);
          url.searchParams.set("jatoRouteExpires", String(payload.expiresAt));
          url.searchParams.set("jatoRouteCreated", String(payload.createdAt || Date.now()));
          url.searchParams.set("jatoRouteSource", payload.source || "auto");
          if (payload.reason) url.searchParams.set("jatoRouteReason", payload.reason);
          if (payload.cnOk !== undefined) url.searchParams.set("jatoRouteCnOk", String(payload.cnOk));
          if (payload.intlOk !== undefined) url.searchParams.set("jatoRouteIntlOk", String(payload.intlOk));
          if (payload.cnMs !== undefined) url.searchParams.set("jatoRouteCnMs", String(payload.cnMs));
          if (payload.intlMs !== undefined) url.searchParams.set("jatoRouteIntlMs", String(payload.intlMs));
          if (payload.marginMs !== undefined) url.searchParams.set("jatoRouteMarginMs", String(payload.marginMs));
          if (payload.cnBuildCommit) url.searchParams.set("jatoRouteCnBuildCommit", payload.cnBuildCommit);
          if (payload.intlBuildCommit) url.searchParams.set("jatoRouteIntlBuildCommit", payload.intlBuildCommit);
          if (payload.cnFrontendBuildId) url.searchParams.set("jatoRouteCnFrontendBuildId", payload.cnFrontendBuildId);
          if (payload.intlFrontendBuildId) url.searchParams.set("jatoRouteIntlFrontendBuildId", payload.intlFrontendBuildId);
        }

        function redirectTo(nextTarget, payload) {
          var nextHost = targetHost(nextTarget);
          if (nextHost === host) return false;
          if (!nextHost) return false;
          var url = new URL(window.location.href);
          url.hostname = nextHost;
          setTransferParams(url, payload);
          window.location.replace(url.toString());
          return true;
        }

        function markProbeInFlight() {
          window.__JATO_ROUTE_PROBE_IN_FLIGHT__ = true;
          try {
            window.sessionStorage.setItem(probeInFlightKey, String(Date.now()));
          } catch (_error) {
            // The app can still boot if storage is unavailable.
          }
        }

        function clearProbeInFlight() {
          window.__JATO_ROUTE_PROBE_IN_FLIGHT__ = false;
          try {
            window.sessionStorage.removeItem(probeInFlightKey);
          } catch (_error) {
            // The app can still boot if storage is unavailable.
          }
        }

        function detectProfile() {
          var timeZone = "";
          try {
            timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
          } catch (_error) {
            timeZone = "";
          }
          var languages = [];
          if (navigator.languages && navigator.languages.length) {
            languages = Array.prototype.slice.call(navigator.languages);
          } else if (navigator.language) {
            languages = [navigator.language];
          }
          var chinaTimeZone = /^(Asia\/Shanghai|Asia\/Chongqing|Asia\/Harbin|Asia\/Urumqi)$/.test(timeZone);
          var mainlandChineseLanguage = languages.some(function (language) {
            var normalized = String(language || "").toLowerCase();
            return normalized === "zh-cn" || normalized.indexOf("zh-cn-") === 0 || normalized === "zh-hans" || normalized.indexOf("zh-hans-") === 0;
          });
          return {
            prefersChinaRoute: chinaTimeZone || mainlandChineseLanguage,
            reason: chinaTimeZone ? "China-local browser signal: time zone " + timeZone : mainlandChineseLanguage ? "China-local browser signal: language " + languages.join(", ") : "No China-local browser signal"
          };
        }

        function probe(target) {
          var startedAt = performance.now();
          var controller = new AbortController();
          var timeout = window.setTimeout(function () { controller.abort(); }, probeTimeoutMs);
          var checkedAt = new Date().toLocaleTimeString();
          var buildInfoPromise = fetch("https://" + targetHost(target) + "/build-meta.json?ts=" + Date.now(), {
            cache: "no-store",
            credentials: "omit",
            signal: controller.signal
          }).then(function (response) {
            if (!response.ok) return {};
            return response.json();
          }).catch(function () {
            return {};
          });
          return fetch("https://" + targetHost(target) + "/route-probe.txt?ts=" + Date.now(), {
            cache: "no-store",
            credentials: "omit",
            mode: "no-cors",
            signal: controller.signal
          }).then(function () {
            return buildInfoPromise.then(function (buildInfo) {
              window.clearTimeout(timeout);
              return {
                target: target,
                ok: true,
                ms: Math.round(performance.now() - startedAt),
                checkedAt: checkedAt,
                buildCommit: typeof buildInfo.commit === "string" ? buildInfo.commit : undefined,
                frontendBuildId: typeof buildInfo.frontendBuildId === "string" ? buildInfo.frontendBuildId : undefined
              };
            });
          }).catch(function () {
            return buildInfoPromise.then(function (buildInfo) {
              window.clearTimeout(timeout);
              return {
                target: target,
                ok: false,
                ms: Math.round(performance.now() - startedAt),
                checkedAt: checkedAt,
                buildCommit: typeof buildInfo.commit === "string" ? buildInfo.commit : undefined,
                frontendBuildId: typeof buildInfo.frontendBuildId === "string" ? buildInfo.frontendBuildId : undefined
              };
            });
          });
        }

        function chooseAutoPayload(cn, intl, profile) {
          var now = Date.now();
          var currentOrCn = currentTarget || "cn";
          var cnMs = cn && cn.ms !== undefined ? cn.ms : probeTimeoutMs;
          var intlMs = intl && intl.ms !== undefined ? intl.ms : probeTimeoutMs;
          var target = currentOrCn;
          var reason = "Both probes failed; stay on the current host.";
          var marginMs = redirectMarginMs;
          if (cn.ok && profile.prefersChinaRoute) {
            target = "cn";
            marginMs = undefined;
            reason = "www probe succeeded and the browser has China-local signals; keep the domestic route (" + profile.reason + ").";
          } else if (cn && cn.ok && !(intl && intl.ok)) {
            target = "cn";
            reason = "intl probe failed and www probe succeeded.";
          } else if (intl && intl.ok && !(cn && cn.ok)) {
            if (currentTarget === "cn") {
              target = "cn";
              reason = "www is the current entry; keep the domestic route when only the www probe failed once.";
            } else {
              target = "intl";
              reason = "www probe failed and intl probe succeeded.";
            }
          } else if (cn && cn.ok && intl && intl.ok) {
            var deltaMs = Math.abs(cnMs - intlMs);
            if (deltaMs <= redirectMarginMs) {
              target = currentOrCn;
              reason = "Both probes are within " + redirectMarginMs + " ms; keep the current route to avoid route churn.";
            } else if (intlMs < cnMs) {
              target = "intl";
              reason = "intl is faster by " + (cnMs - intlMs) + " ms, above the measured-route margin.";
            } else {
              target = "cn";
              reason = "www is faster by " + (intlMs - cnMs) + " ms, above the measured-route margin.";
            }
          }
          return {
            target: target,
            source: "auto",
            reason: reason,
            createdAt: now,
            expiresAt: now + autoDecisionTtlMs,
            cnOk: cn ? cn.ok : undefined,
            intlOk: intl ? intl.ok : undefined,
            cnMs: cn ? cn.ms : undefined,
            intlMs: intl ? intl.ms : undefined,
            marginMs: marginMs,
            cnBuildCommit: cn ? cn.buildCommit : undefined,
            intlBuildCommit: intl ? intl.buildCommit : undefined,
            cnFrontendBuildId: cn ? cn.frontendBuildId : undefined,
            intlFrontendBuildId: intl ? intl.frontendBuildId : undefined
          };
        }

        if (!currentTarget || window.location.pathname === "/route-diagnostics" || searchParams.has("token") || searchParams.has("code") || searchParams.has("state") || searchParams.get("route") === "stay") {
          return;
        }

        var manualDecision = readDecision(manualKey);
        if (manualDecision) {
          redirectTo(manualDecision.target, manualDecision);
          return;
        }

        var cachedDecision = readDecision(decisionKey);
        if (cachedDecision) {
          redirectTo(cachedDecision.target, cachedDecision);
          return;
        }

        var profile = detectProfile();
        if (currentTarget === "intl" && !profile.prefersChinaRoute) {
          saveDecision({
            target: "intl",
            source: "auto",
            reason: "Current intl route loaded without China-local browser signals; start the Cloudflare route immediately.",
            createdAt: Date.now(),
            expiresAt: Date.now() + autoDecisionTtlMs,
            intlOk: true
          });
          return;
        }

        var decisionSettled = false;
        markProbeInFlight();

        function completeDecision(cn, intl) {
          if (decisionSettled) return;
          decisionSettled = true;
          var autoPayload = chooseAutoPayload(cn, intl, profile);
          saveDecision(autoPayload);
          var nextTarget = autoPayload.target;
          var didRedirect = redirectTo(nextTarget, autoPayload);
          if (!didRedirect) {
            clearProbeInFlight();
          }
        }

        var cnProbePromise = probe("cn");
        var intlProbePromise = probe("intl");

        cnProbePromise.then(function (cn) {
          if (decisionSettled) return;
          if (profile.prefersChinaRoute && cn.ok) {
            completeDecision(cn, null);
          }
        }).catch(function () {
          clearProbeInFlight();
        });

        Promise.all([cnProbePromise, intlProbePromise]).then(function (results) {
          if (decisionSettled) return;
          completeDecision(results[0], results[1]);
        }).catch(function () {
          clearProbeInFlight();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
