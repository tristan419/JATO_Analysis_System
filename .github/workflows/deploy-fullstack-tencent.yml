name: deploy-fullstack-tencent  # auto-deploy DeepSeek + NVIDIA-first

on:
  push:
    branches: ["main"]
    paths:
      - "06_AppPlatform/**"
      - "07_ScrapingToolkit/**"
      - "03_Scripts/**"
      - "01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
      - ".github/workflows/deploy-fullstack-tencent.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fullstack-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required GitHub secrets
        id: auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=0
          auth_mode=""
          for key in SSH_HOST SSH_USER; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub secret: $key"
              missing=1
            fi
          done

          if [ -n "$SSH_PRIVATE_KEY" ]; then
            auth_mode="key"
          elif [ -n "$SSH_PASSWORD" ]; then
            auth_mode="password"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "mode=$auth_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Package deploy archive
        run: |
          REQUIRED_WORKBOOK="01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
          if [ ! -f "$GITHUB_WORKSPACE/$REQUIRED_WORKBOOK" ]; then
            echo "::error::Missing required workbook: $REQUIRED_WORKBOOK"
            exit 1
          fi

          tar cf "$RUNNER_TEMP/JATO_deploy.tar" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='.claude' \
            --exclude='tmp' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='01_RAW_DATA' \
            --exclude='04_Processed_data' \
            --exclude='*.ipynb' \
            --exclude='data_wangler' \
            --exclude='Markdown_Readme' \
            -C "$GITHUB_WORKSPACE" .
          tar rf "$RUNNER_TEMP/JATO_deploy.tar" \
            -C "$GITHUB_WORKSPACE" \
            "$REQUIRED_WORKBOOK"
          gzip -f "$RUNNER_TEMP/JATO_deploy.tar"
          ls -lh "$RUNNER_TEMP/JATO_deploy.tar.gz"
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" "$REQUIRED_WORKBOOK"

      - name: Upload archive to server
        if: ${{ steps.auth.outputs.mode == 'key' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
          chmod 600 ~/.ssh/github_actions_tencent_key

          scp -v -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/github_actions_tencent_key \
            "$RUNNER_TEMP/JATO_deploy.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/JATO_deploy.tar.gz"

      - name: Upload archive to server
        if: ${{ steps.auth.outputs.mode == 'password' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PASSWORD:?Missing SSH_PASSWORD}"
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          sshpass -p "$SSH_PASSWORD" \
            scp -v -P "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "$RUNNER_TEMP/JATO_deploy.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/JATO_deploy.tar.gz"

      - name: Deploy on server via SSH
        if: ${{ steps.auth.outputs.mode == 'key' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          if [ -z "${DEPLOY_SERVER_NAME:-}" ]; then
            DEPLOY_SERVER_NAME="ojeur.cloud www.ojeur.cloud"
          fi
          if [ -z "${DEPLOY_ENABLE_HTTPS:-}" ]; then
            DEPLOY_ENABLE_HTTPS="true"
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
          chmod 600 ~/.ssh/github_actions_tencent_key

          REMOTE_EXPORTS="export DEPLOY_SERVER_NAME=$(printf '%q' "$DEPLOY_SERVER_NAME"); "
          REMOTE_EXPORTS+="export DEPLOY_ENABLE_HTTPS=$(printf '%q' "$DEPLOY_ENABLE_HTTPS"); "
          REMOTE_EXPORTS+="export DEPLOY_CERTBOT_EMAIL=$(printf '%q' "${DEPLOY_CERTBOT_EMAIL:-}"); "
          REMOTE_EXPORTS+="export DEEPSEEK_API_KEY=$(printf '%q' '${{ secrets.DEEPSEEK_API_KEY }}'); "

          ssh -v -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/github_actions_tencent_key \
            "$SSH_USER@$SSH_HOST" "${REMOTE_EXPORTS}bash -s" <<'EOF'
          set -euo pipefail

          REPO_DIR="/opt/JATO_Analysis_System-main"
          ENV_FILE="/etc/jato-fullstack/backend.env"

          sudo mkdir -p "$REPO_DIR"
          sudo chown -R "$USER":"$USER" "$REPO_DIR"
          sudo tar xzf /tmp/JATO_deploy.tar.gz -C "$REPO_DIR"
          rm -f /tmp/JATO_deploy.tar.gz

          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "[INFO] Configuring DeepSeek in backend env..."
            (sudo mkdir -p "$(dirname "$ENV_FILE")" 2>/dev/null || true)
            if sudo test -f "$ENV_FILE" 2>/dev/null; then
              (sudo sed -i '/^DEEPSEEK_API_KEY=/d' "$ENV_FILE" 2>/dev/null || true)
              (echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" | sudo tee -a "$ENV_FILE" > /dev/null 2>&1 || true)
              (sudo sed -i '/^DEEPSEEK_CHAT_TIMEOUT_SECONDS=/d' "$ENV_FILE" 2>/dev/null || true)
              (echo "DEEPSEEK_CHAT_TIMEOUT_SECONDS=15" | sudo tee -a "$ENV_FILE" > /dev/null 2>&1 || true)
              if ! grep -q 'nvidia:meta/llama-3.3-70b-instruct' "$ENV_FILE" 2>/dev/null; then
                (sudo sed -i 's/^APP_COUNTRY_CHAT_MODEL_OPTIONS=.*/APP_COUNTRY_CHAT_MODEL_OPTIONS=nvidia:meta\/llama-3.3-70b-instruct,deepseek:deepseek-chat,gemini:*/' "$ENV_FILE" 2>/dev/null || true)
              fi
              echo "[INFO] DeepSeek config updated in existing env file"
            else
              (echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" | sudo tee "$ENV_FILE" > /dev/null 2>&1 || true)
              (echo "APP_COUNTRY_CHAT_MODEL_OPTIONS=nvidia:meta/llama-3.3-70b-instruct,deepseek:deepseek-chat,gemini:*" | sudo tee -a "$ENV_FILE" > /dev/null 2>&1 || true)
              echo "[INFO] DeepSeek env file created"
            fi
          fi

          cd "$REPO_DIR"
          export REPO_DIR SKIP_GIT_SYNC=true
          export BACKEND_SERVICE_NAME="jato-fullstack-backend@8000"
          export VITE_API_BASE="/v1"
          export VITE_USER_ROLE="viewer"
          export VITE_USER_NAME="github-actions"
          bash 03_Scripts/deploy_fullstack_server.sh 2>&1 || true
          DEPLOY_RC=${PIPESTATUS[0]:-$?}

          FRONTEND_ROOT="$REPO_DIR/06_AppPlatform/frontend/dist"

          if [ -n "$DEPLOY_SERVER_NAME" ] && [ "$DEPLOY_SERVER_NAME" != "_" ]; then
            if [ "${DEPLOY_ENABLE_HTTPS,,}" = "true" ]; then
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                CERTBOT_EMAIL="$DEPLOY_CERTBOT_EMAIL" CERTBOT_RENEW_DRY_RUN=false \
                bash 03_Scripts/deploy/nginx/enable_jato_fullstack_https.sh
            else
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                bash 03_Scripts/deploy/nginx/install_jato_fullstack_nginx.sh
            fi
          fi

          DIST="$REPO_DIR/06_AppPlatform/frontend/dist"
          {
            echo "deploy_exit_code=$DEPLOY_RC"
            echo "timestamp=$(date -u)"
            echo "---systemctl---"
            sudo -n systemctl status jato-fullstack-backend@8000 --no-pager 2>&1 || true
            echo "---healthz---"
            curl -fsS http://127.0.0.1:8000/healthz 2>&1 || echo "HEALTHZ_FAILED"
            echo "---nginx---"
            sudo -n systemctl status nginx --no-pager 2>&1 | head -5 || true
            echo "---index.html---"
            head -1 "$DIST/index.html" 2>&1 || echo "INDEX_MISSING"
          } > "$DIST/_deploy_status.txt" 2>&1

          curl -fsS http://127.0.0.1:8000/healthz >/dev/null
          EOF

      - name: Deploy on server via SSH
        if: ${{ steps.auth.outputs.mode == 'password' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          if [ -z "${DEPLOY_SERVER_NAME:-}" ]; then
            DEPLOY_SERVER_NAME="ojeur.cloud www.ojeur.cloud"
          fi
          if [ -z "${DEPLOY_ENABLE_HTTPS:-}" ]; then
            DEPLOY_ENABLE_HTTPS="true"
          fi

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          REMOTE_EXPORTS="export DEPLOY_SERVER_NAME=$(printf '%q' "$DEPLOY_SERVER_NAME"); "
          REMOTE_EXPORTS+="export DEPLOY_ENABLE_HTTPS=$(printf '%q' "$DEPLOY_ENABLE_HTTPS"); "
          REMOTE_EXPORTS+="export DEPLOY_CERTBOT_EMAIL=$(printf '%q' "${DEPLOY_CERTBOT_EMAIL:-}"); "
          REMOTE_EXPORTS+="export DEEPSEEK_API_KEY=$(printf '%q' '${{ secrets.DEEPSEEK_API_KEY }}'); "

          sshpass -p "$SSH_PASSWORD" \
            ssh -v -p "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "${REMOTE_EXPORTS}bash -s" <<'EOF'
          set -euo pipefail

          REPO_DIR="/opt/JATO_Analysis_System-main"
          ENV_FILE="/etc/jato-fullstack/backend.env"

          sudo mkdir -p "$REPO_DIR"
          sudo chown -R "$USER":"$USER" "$REPO_DIR"
          sudo tar xzf /tmp/JATO_deploy.tar.gz -C "$REPO_DIR"
          rm -f /tmp/JATO_deploy.tar.gz

          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "[INFO] Configuring DeepSeek in backend env..."
            (sudo mkdir -p "$(dirname "$ENV_FILE")" 2>/dev/null || true)
            if sudo test -f "$ENV_FILE" 2>/dev/null; then
              (sudo sed -i '/^DEEPSEEK_API_KEY=/d' "$ENV_FILE" 2>/dev/null || true)
              (echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" | sudo tee -a "$ENV_FILE" > /dev/null 2>&1 || true)
              (sudo sed -i '/^DEEPSEEK_CHAT_TIMEOUT_SECONDS=/d' "$ENV_FILE" 2>/dev/null || true)
              (echo "DEEPSEEK_CHAT_TIMEOUT_SECONDS=15" | sudo tee -a "$ENV_FILE" > /dev/null 2>&1 || true)
              if ! grep -q 'nvidia:meta/llama-3.3-70b-instruct' "$ENV_FILE" 2>/dev/null; then
                (sudo sed -i 's/^APP_COUNTRY_CHAT_MODEL_OPTIONS=.*/APP_COUNTRY_CHAT_MODEL_OPTIONS=nvidia:meta\/llama-3.3-70b-instruct,deepseek:deepseek-chat,gemini:*/' "$ENV_FILE" 2>/dev/null || true)
              fi
              echo "[INFO] DeepSeek config updated in existing env file"
            else
              (echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" | sudo tee "$ENV_FILE" > /dev/null 2>&1 || true)
              (echo "APP_COUNTRY_CHAT_MODEL_OPTIONS=nvidia:meta/llama-3.3-70b-instruct,deepseek:deepseek-chat,gemini:*" | sudo tee -a "$ENV_FILE" > /dev/null 2>&1 || true)
              echo "[INFO] DeepSeek env file created"
            fi
          fi

          cd "$REPO_DIR"
          export REPO_DIR SKIP_GIT_SYNC=true
          export BACKEND_SERVICE_NAME="jato-fullstack-backend@8000"
          export VITE_API_BASE="/v1"
          export VITE_USER_ROLE="viewer"
          export VITE_USER_NAME="github-actions"
          bash 03_Scripts/deploy_fullstack_server.sh 2>&1 || true
          DEPLOY_RC=${PIPESTATUS[0]:-$?}

          FRONTEND_ROOT="$REPO_DIR/06_AppPlatform/frontend/dist"

          if [ -n "$DEPLOY_SERVER_NAME" ] && [ "$DEPLOY_SERVER_NAME" != "_" ]; then
            if [ "${DEPLOY_ENABLE_HTTPS,,}" = "true" ]; then
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                CERTBOT_EMAIL="$DEPLOY_CERTBOT_EMAIL" CERTBOT_RENEW_DRY_RUN=false \
                bash 03_Scripts/deploy/nginx/enable_jato_fullstack_https.sh
            else
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                bash 03_Scripts/deploy/nginx/install_jato_fullstack_nginx.sh
            fi
          fi

          DIST="$REPO_DIR/06_AppPlatform/frontend/dist"
          {
            echo "deploy_exit_code=$DEPLOY_RC"
            echo "timestamp=$(date -u)"
            echo "---systemctl---"
            sudo -n systemctl status jato-fullstack-backend@8000 --no-pager 2>&1 || true
            echo "---healthz---"
            curl -fsS http://127.0.0.1:8000/healthz 2>&1 || echo "HEALTHZ_FAILED"
            echo "---nginx---"
            sudo -n systemctl status nginx --no-pager 2>&1 | head -5 || true
            echo "---index.html---"
            head -1 "$DIST/index.html" 2>&1 || echo "INDEX_MISSING"
          } > "$DIST/_deploy_status.txt" 2>&1

          curl -fsS http://127.0.0.1:8000/healthz >/dev/null
          EOF
