name: deploy-fullstack-tencent  # auto-deploy DeepSeek + Governed Copilot v2

on:
  push:
    branches: ["main"]
    paths:
      - "06_AppPlatform/**"
      - "07_ScrapingToolkit/**"
      - "03_Scripts/**"
      - "hermes/**"
      - "!hermes/dev_events/**"
      - "01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
      - ".github/workflows/deploy-fullstack-tencent.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fullstack-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required GitHub secrets
        id: auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=0
          auth_mode=""
          for key in SSH_HOST SSH_USER; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub secret: $key"
              missing=1
            fi
          done

          if [ -n "$SSH_PRIVATE_KEY" ]; then
            auth_mode="key"
          elif [ -n "$SSH_PASSWORD" ]; then
            auth_mode="password"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "mode=$auth_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Package deploy archive
        env:
          MIHOMO_SUB_URL: ${{ secrets.MIHOMO_SUB_URL }}
        run: |
          REQUIRED_WORKBOOK="01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
          if [ ! -f "$GITHUB_WORKSPACE/$REQUIRED_WORKBOOK" ]; then
            echo "::error::Missing required workbook: $REQUIRED_WORKBOOK"
            exit 1
          fi
          MSRP_TOP30_PACK="03_Scripts/diagnostics/artifacts/msrp_backfill/sweden_swiss_top30_suv"
          MSRP_TOP30_CANDIDATES="$MSRP_TOP30_PACK/top30_suv_price_movement_candidates.json"
          MSRP_TOP30_EVIDENCE="$MSRP_TOP30_PACK/official_evidence_leads.json"
          for required_msrp_pack_file in "$MSRP_TOP30_CANDIDATES" "$MSRP_TOP30_EVIDENCE"; do
            if [ ! -f "$GITHUB_WORKSPACE/$required_msrp_pack_file" ]; then
              echo "::error::Missing required MSRP monitor pack file: $required_msrp_pack_file"
              exit 1
            fi
          done

          python3 - <<'PY'
          import datetime as _dt
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sha = os.environ["GITHUB_SHA"]
          try:
              short_sha = subprocess.check_output(
                  ["git", "rev-parse", "--short=8", "HEAD"],
                  cwd=root,
                  text=True,
              ).strip()
          except Exception:
              short_sha = sha[:8]
          payload = {
              "releaseId": f"{os.environ.get('GITHUB_RUN_ID', '')}-{os.environ.get('GITHUB_RUN_ATTEMPT', '')}",
              "service": "jato-fullstack-backend",
              "environment": "production",
              "expectedCommitSha": sha,
              "commitSha": sha,
              "shortSha": short_sha,
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "workflowRunId": os.environ.get("GITHUB_RUN_ID", ""),
              "workflowRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "deployMethod": "github_actions",
              "packagedAt": _dt.datetime.now(_dt.UTC).isoformat(),
              "source": "github_actions_archive",
          }
          out = root / "hermes" / "deploy_release.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Wrote {out.relative_to(root)} for release {short_sha}")
          PY

          MIHOMO_PAYLOAD_ROOT="$RUNNER_TEMP/mihomo_payload"
          MIHOMO_PACKAGED_CONFIG="$MIHOMO_PAYLOAD_ROOT/hermes/runtime/mihomo/config.yaml"
          if [ -n "${MIHOMO_SUB_URL:-}" ]; then
            echo "[mihomo-sub] Building prebuilt mihomo config on GitHub runner"
            if MIHOMO_OUTPUT_CONFIG="$MIHOMO_PACKAGED_CONFIG" \
              bash 03_Scripts/deploy/update_mihomo_subscription.sh; then
              echo "[mihomo-sub] Prebuilt mihomo config ready"
            else
              echo "[WARN] Prebuilt mihomo config failed; server will try local refresh"
              rm -f "$MIHOMO_PACKAGED_CONFIG"
            fi
          fi

          tar cf "$RUNNER_TEMP/JATO_deploy.tar" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='.claude' \
            --exclude='tmp' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='01_RAW_DATA' \
            --exclude='04_Processed_data' \
            --exclude='*.ipynb' \
            --exclude='03_Scripts/diagnostics/artifacts' \
            --exclude='03_Scripts/probe_results' \
            --exclude='data_wangler' \
            --exclude='Markdown_Readme' \
            -C "$GITHUB_WORKSPACE" .
          tar rf "$RUNNER_TEMP/JATO_deploy.tar" \
            -C "$GITHUB_WORKSPACE" \
            "$REQUIRED_WORKBOOK"
          tar rf "$RUNNER_TEMP/JATO_deploy.tar" \
            -C "$GITHUB_WORKSPACE" \
            "$MSRP_TOP30_PACK"
          if [ -f "$MIHOMO_PACKAGED_CONFIG" ]; then
            tar rf "$RUNNER_TEMP/JATO_deploy.tar" \
              -C "$MIHOMO_PAYLOAD_ROOT" \
              hermes/runtime/mihomo/config.yaml
          fi
          gzip -f "$RUNNER_TEMP/JATO_deploy.tar"
          ls -lh "$RUNNER_TEMP/JATO_deploy.tar.gz"
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" "$REQUIRED_WORKBOOK"
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" "$MSRP_TOP30_CANDIDATES" "$MSRP_TOP30_EVIDENCE"

      - name: Upload archive to server
        if: ${{ steps.auth.outputs.mode == 'key' && vars.DEPLOY_UPLOAD_ARCHIVE != 'false' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          SSH_CONNECT_HOST="$SSH_HOST"
          if command -v getent >/dev/null 2>&1; then
            SSH_RESOLVED_HOST="$(getent ahostsv4 "$SSH_HOST" | awk 'NR == 1 {print $1}' || true)"
            if [ -n "$SSH_RESOLVED_HOST" ]; then
              SSH_CONNECT_HOST="$SSH_RESOLVED_HOST"
              echo "SSH_RESOLVED_HOST=$SSH_RESOLVED_HOST" >> "$GITHUB_ENV"
              echo "[INFO] SSH host resolved for deploy: $SSH_HOST -> $SSH_RESOLVED_HOST"
            fi
          fi
          echo "SSH_HOST=$SSH_CONNECT_HOST" >> "$GITHUB_ENV"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
          chmod 600 ~/.ssh/github_actions_tencent_key

          ARCHIVE_PATH="$RUNNER_TEMP/JATO_deploy.tar.gz"
          REMOTE_ARCHIVE="JATO_deploy_${GITHUB_SHA}.tar.gz"
          REMOTE_ARCHIVE_TMP="${REMOTE_ARCHIVE}.uploading"
          CHUNK_DIR="$RUNNER_TEMP/JATO_deploy_chunks"
          ls -lh "$ARCHIVE_PATH"
          ARCHIVE_BYTES="$(wc -c < "$ARCHIVE_PATH" | tr -d '[:space:]')"
          rm -rf "$CHUNK_DIR"
          mkdir -p "$CHUNK_DIR"
          split -b 8M "$ARCHIVE_PATH" "$CHUNK_DIR/chunk_"

          fallback_to_sparse_deploy() {
            echo "::warning::$1; continuing without uploaded archive so server deploy can fall back to sparse Git fetch."
            echo "DEPLOY_ARCHIVE_PATH=" >> "$GITHUB_ENV"
            return 0
          }

          SSH_COMMON_OPTS=(
            -T
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
            -o IPQoS=none
            -o HostKeyAlias="$SSH_HOST"
            -i ~/.ssh/github_actions_tencent_key
          )

          upload_archive_stream() {
            echo "[INFO] Uploading deploy archive via single ssh stream (${ARCHIVE_BYTES} bytes)"
            if timeout 600s ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_CONNECT_HOST" \
              "rm -f '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && cat > '$REMOTE_ARCHIVE_TMP'" < "$ARCHIVE_PATH"; then
              if timeout 120s ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_CONNECT_HOST" \
                "remote_size=\$(wc -c < '$REMOTE_ARCHIVE_TMP' | tr -d '[:space:]'); if [ \"\$remote_size\" != '$ARCHIVE_BYTES' ]; then echo \"remote archive size mismatch: \$remote_size != $ARCHIVE_BYTES\" >&2; exit 1; fi; mv '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && ls -lh '$REMOTE_ARCHIVE'"; then
                return 0
              fi
            fi

            timeout 120s ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_CONNECT_HOST" \
              "rm -f '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE'" || true
            return 1
          }

          if upload_archive_stream; then
            echo "DEPLOY_ARCHIVE_PATH=$REMOTE_ARCHIVE" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "[WARN] Single-stream archive upload failed; falling back to 8MiB ssh chunks"

          if ! timeout 120s ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_CONNECT_HOST" \
            "rm -f '$REMOTE_ARCHIVE_TMP' && : > '$REMOTE_ARCHIVE_TMP'"; then
            fallback_to_sparse_deploy "Remote archive preparation failed"
            exit 0
          fi

          echo "[INFO] Uploading deploy archive in 8MiB ssh chunks (${ARCHIVE_BYTES} bytes)"
          chunk_index=0
          for chunk_path in "$CHUNK_DIR"/chunk_*; do
            chunk_index=$((chunk_index + 1))
            chunk_bytes="$(wc -c < "$chunk_path" | tr -d '[:space:]')"
            echo "[INFO] Upload chunk ${chunk_index}: ${chunk_bytes} bytes"
            if ! timeout 120s ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_CONNECT_HOST" \
              "cat >> '$REMOTE_ARCHIVE_TMP'" < "$chunk_path"; then
              timeout 120s ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_CONNECT_HOST" \
                "rm -f '$REMOTE_ARCHIVE_TMP'" || true
              fallback_to_sparse_deploy "Deploy archive ssh chunk upload failed or timed out at chunk ${chunk_index}"
              exit 0
            fi
          done

          if ! timeout 120s ssh -T -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IPQoS=none \
            -o HostKeyAlias="$SSH_HOST" \
            -i ~/.ssh/github_actions_tencent_key \
            "$SSH_USER@$SSH_CONNECT_HOST" \
            "remote_size=\$(wc -c < '$REMOTE_ARCHIVE_TMP' | tr -d '[:space:]'); if [ \"\$remote_size\" != '$ARCHIVE_BYTES' ]; then echo \"remote archive size mismatch: \$remote_size != $ARCHIVE_BYTES\" >&2; exit 1; fi; mv '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && ls -lh '$REMOTE_ARCHIVE'"; then
            timeout 120s ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_CONNECT_HOST" \
              "rm -f '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE'" || true
            fallback_to_sparse_deploy "Remote archive finalization failed"
            exit 0
          fi
          echo "DEPLOY_ARCHIVE_PATH=$REMOTE_ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload archive to server
        if: ${{ steps.auth.outputs.mode == 'password' && vars.DEPLOY_UPLOAD_ARCHIVE != 'false' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PASSWORD:?Missing SSH_PASSWORD}"
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          ARCHIVE_PATH="$RUNNER_TEMP/JATO_deploy.tar.gz"
          REMOTE_ARCHIVE="JATO_deploy_${GITHUB_SHA}.tar.gz"
          REMOTE_ARCHIVE_TMP="${REMOTE_ARCHIVE}.uploading"
          CHUNK_DIR="$RUNNER_TEMP/JATO_deploy_chunks"
          ls -lh "$ARCHIVE_PATH"
          ARCHIVE_BYTES="$(wc -c < "$ARCHIVE_PATH" | tr -d '[:space:]')"
          rm -rf "$CHUNK_DIR"
          mkdir -p "$CHUNK_DIR"
          split -b 8M "$ARCHIVE_PATH" "$CHUNK_DIR/chunk_"

          fallback_to_sparse_deploy() {
            echo "::warning::$1; continuing without uploaded archive so server deploy can fall back to sparse Git fetch."
            echo "DEPLOY_ARCHIVE_PATH=" >> "$GITHUB_ENV"
            return 0
          }

          SSH_COMMON_OPTS=(
            -T
            -p "$SSH_PORT"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
            -o IPQoS=none
          )

          upload_archive_stream() {
            echo "[INFO] Uploading deploy archive via single ssh stream (${ARCHIVE_BYTES} bytes)"
            if timeout 600s sshpass -p "$SSH_PASSWORD" \
              ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && cat > '$REMOTE_ARCHIVE_TMP'" < "$ARCHIVE_PATH"; then
              if timeout 120s sshpass -p "$SSH_PASSWORD" \
                ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
                "remote_size=\$(wc -c < '$REMOTE_ARCHIVE_TMP' | tr -d '[:space:]'); if [ \"\$remote_size\" != '$ARCHIVE_BYTES' ]; then echo \"remote archive size mismatch: \$remote_size != $ARCHIVE_BYTES\" >&2; exit 1; fi; mv '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && ls -lh '$REMOTE_ARCHIVE'"; then
                return 0
              fi
            fi

            timeout 120s sshpass -p "$SSH_PASSWORD" \
              ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE'" || true
            return 1
          }

          if upload_archive_stream; then
            echo "DEPLOY_ARCHIVE_PATH=$REMOTE_ARCHIVE" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "[WARN] Single-stream archive upload failed; falling back to 8MiB ssh chunks"

          if ! timeout 120s sshpass -p "$SSH_PASSWORD" \
            ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "rm -f '$REMOTE_ARCHIVE_TMP' && : > '$REMOTE_ARCHIVE_TMP'"; then
            fallback_to_sparse_deploy "Remote archive preparation failed"
            exit 0
          fi

          echo "[INFO] Uploading deploy archive in 8MiB ssh chunks (${ARCHIVE_BYTES} bytes)"
          chunk_index=0
          for chunk_path in "$CHUNK_DIR"/chunk_*; do
            chunk_index=$((chunk_index + 1))
            chunk_bytes="$(wc -c < "$chunk_path" | tr -d '[:space:]')"
            echo "[INFO] Upload chunk ${chunk_index}: ${chunk_bytes} bytes"
            if ! timeout 120s sshpass -p "$SSH_PASSWORD" \
              ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
              "cat >> '$REMOTE_ARCHIVE_TMP'" < "$chunk_path"; then
              timeout 120s sshpass -p "$SSH_PASSWORD" \
                ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
                "rm -f '$REMOTE_ARCHIVE_TMP'" || true
              fallback_to_sparse_deploy "Deploy archive ssh chunk upload failed or timed out at chunk ${chunk_index}"
              exit 0
            fi
          done

          if ! timeout 120s sshpass -p "$SSH_PASSWORD" \
            ssh -T -p "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IPQoS=none \
            "$SSH_USER@$SSH_HOST" \
            "remote_size=\$(wc -c < '$REMOTE_ARCHIVE_TMP' | tr -d '[:space:]'); if [ \"\$remote_size\" != '$ARCHIVE_BYTES' ]; then echo \"remote archive size mismatch: \$remote_size != $ARCHIVE_BYTES\" >&2; exit 1; fi; mv '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && ls -lh '$REMOTE_ARCHIVE'"; then
            timeout 120s sshpass -p "$SSH_PASSWORD" \
              ssh "${SSH_COMMON_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE'" || true
            fallback_to_sparse_deploy "Remote archive finalization failed"
            exit 0
          fi
          echo "DEPLOY_ARCHIVE_PATH=$REMOTE_ARCHIVE" >> "$GITHUB_ENV"

      - name: Deploy on server via SSH
        if: ${{ steps.auth.outputs.mode == 'key' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          if [ -z "${DEPLOY_SERVER_NAME:-}" ]; then
            DEPLOY_SERVER_NAME="ojeur.cloud www.ojeur.cloud"
          fi
          if [ -z "${DEPLOY_ENABLE_HTTPS:-}" ]; then
            DEPLOY_ENABLE_HTTPS="true"
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
          chmod 600 ~/.ssh/github_actions_tencent_key

          DEPLOY_SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          REMOTE_EXPORTS="export DEPLOY_SERVER_NAME=$(printf '%q' "$DEPLOY_SERVER_NAME"); "
          REMOTE_EXPORTS+="export DEPLOY_ENABLE_HTTPS=$(printf '%q' "$DEPLOY_ENABLE_HTTPS"); "
          REMOTE_EXPORTS+="export DEPLOY_CERTBOT_EMAIL=$(printf '%q' "${DEPLOY_CERTBOT_EMAIL:-}"); "
          REMOTE_EXPORTS+="export VITE_ASSET_BASE_URL=$(printf '%q' "${VITE_ASSET_BASE_URL:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_COMMIT_SHA=$(printf '%q' "${GITHUB_SHA:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_SHORT_SHA=$(printf '%q' "$DEPLOY_SHORT_SHA"); "
          REMOTE_EXPORTS+="export DEPLOY_RELEASE_ID=$(printf '%q' "${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ID=$(printf '%q' "${GITHUB_RUN_ID:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ATTEMPT=$(printf '%q' "${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_ARCHIVE_PATH=$(printf '%q' "${DEPLOY_ARCHIVE_PATH:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_REPOSITORY=$(printf '%q' "${GITHUB_REPOSITORY:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_WORKFLOW=$(printf '%q' "${GITHUB_WORKFLOW:-}"); "
          REMOTE_EXPORTS+="export DEEPSEEK_API_KEY=$(printf '%q' '${{ secrets.DEEPSEEK_API_KEY }}'); "
          REMOTE_EXPORTS+="export HERMES_SYNC_TOKEN=$(printf '%q' '${{ secrets.HERMES_SYNC_TOKEN }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_ID=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_ID }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_SECRET=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_SECRET }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_PROXY_URL=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_PROXY_URL }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_RELAY_URL=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_RELAY_URL }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_RELAY_TOKEN=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_RELAY_TOKEN }}'); "
          REMOTE_EXPORTS+="export MIHOMO_SUB_URL=$(printf '%q' '${{ secrets.MIHOMO_SUB_URL }}'); "
          REMOTE_EXPORTS+="export MIHOMO_DB_PATH=$(printf '%q' '${{ vars.MIHOMO_DB_PATH }}'); "

          timeout 1800s ssh -v -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/github_actions_tencent_key \
            "$SSH_USER@$SSH_HOST" "${REMOTE_EXPORTS}bash -s" < 03_Scripts/deploy/fullstack_remote_release.sh

      - name: Deploy on server via SSH
        if: ${{ steps.auth.outputs.mode == 'password' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          if [ -z "${DEPLOY_SERVER_NAME:-}" ]; then
            DEPLOY_SERVER_NAME="ojeur.cloud www.ojeur.cloud"
          fi
          if [ -z "${DEPLOY_ENABLE_HTTPS:-}" ]; then
            DEPLOY_ENABLE_HTTPS="true"
          fi

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          DEPLOY_SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          REMOTE_EXPORTS="export DEPLOY_SERVER_NAME=$(printf '%q' "$DEPLOY_SERVER_NAME"); "
          REMOTE_EXPORTS+="export DEPLOY_ENABLE_HTTPS=$(printf '%q' "$DEPLOY_ENABLE_HTTPS"); "
          REMOTE_EXPORTS+="export DEPLOY_CERTBOT_EMAIL=$(printf '%q' "${DEPLOY_CERTBOT_EMAIL:-}"); "
          REMOTE_EXPORTS+="export VITE_ASSET_BASE_URL=$(printf '%q' "${VITE_ASSET_BASE_URL:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_COMMIT_SHA=$(printf '%q' "${GITHUB_SHA:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_SHORT_SHA=$(printf '%q' "$DEPLOY_SHORT_SHA"); "
          REMOTE_EXPORTS+="export DEPLOY_RELEASE_ID=$(printf '%q' "${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ID=$(printf '%q' "${GITHUB_RUN_ID:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ATTEMPT=$(printf '%q' "${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_ARCHIVE_PATH=$(printf '%q' "${DEPLOY_ARCHIVE_PATH:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_REPOSITORY=$(printf '%q' "${GITHUB_REPOSITORY:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_WORKFLOW=$(printf '%q' "${GITHUB_WORKFLOW:-}"); "
          REMOTE_EXPORTS+="export DEEPSEEK_API_KEY=$(printf '%q' '${{ secrets.DEEPSEEK_API_KEY }}'); "
          REMOTE_EXPORTS+="export HERMES_SYNC_TOKEN=$(printf '%q' '${{ secrets.HERMES_SYNC_TOKEN }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_ID=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_ID }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_SECRET=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_SECRET }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_PROXY_URL=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_PROXY_URL }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_RELAY_URL=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_RELAY_URL }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_RELAY_TOKEN=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_RELAY_TOKEN }}'); "
          REMOTE_EXPORTS+="export MIHOMO_SUB_URL=$(printf '%q' '${{ secrets.MIHOMO_SUB_URL }}'); "
          REMOTE_EXPORTS+="export MIHOMO_DB_PATH=$(printf '%q' '${{ vars.MIHOMO_DB_PATH }}'); "

          sshpass -p "$SSH_PASSWORD" \
            timeout 1800s ssh -v -p "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" "${REMOTE_EXPORTS}bash -s" < 03_Scripts/deploy/fullstack_remote_release.sh

      - name: Verify public frontend build metadata
        env:
          PUBLIC_BUILD_META_URLS: ${{ vars.DEPLOY_PUBLIC_BUILD_META_URLS }}
        run: |
          set -euo pipefail

          if [ -z "${PUBLIC_BUILD_META_URLS:-}" ]; then
            PUBLIC_BUILD_META_URLS="https://www.ojeur.cloud https://ojeur.cloud"
          fi

          expected="$GITHUB_SHA"
          failed=0

          for origin in $PUBLIC_BUILD_META_URLS; do
            origin="${origin%/}"
            echo "[INFO] Verifying frontend build metadata: $origin"
            matched=false

            for attempt in $(seq 1 24); do
              cache_bust="deploy_verify=${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}-${attempt}"
              meta="$(
                curl -L -fsS --max-time 20 "$origin/build-meta.json?$cache_bust" 2>/dev/null \
                  || true
              )"
              commit="$(
                printf '%s' "$meta" | python3 -c 'import json, sys; payload = sys.stdin.read(); print((json.loads(payload).get("commit") or "") if payload else "")' 2>/dev/null \
                  || true
              )"

              if [ "$commit" = "$expected" ]; then
                echo "[INFO] $origin is serving $commit"
                matched=true
                break
              fi

              short="${commit:-missing}"
              echo "[INFO] $origin attempt $attempt/24 served ${short:0:12}; expected ${expected:0:12}"
              sleep 10
            done

            if [ "$matched" != "true" ]; then
              echo "::error::$origin did not serve build-meta commit $expected"
              failed=1
            fi
          done

          exit "$failed"
