name: deploy-fullstack-tencent

on:
  push:
    branches: ["main"]
    paths:
      - "06_AppPlatform/**"
      - "03_Scripts/deploy_fullstack_server.sh"
      - "03_Scripts/deploy/nginx/jato_fullstack.conf.example"
      - "03_Scripts/deploy/nginx/install_jato_fullstack_nginx.sh"
      - "03_Scripts/deploy/systemd/jato-fullstack-backend@.service"
      - "03_Scripts/deploy/systemd/jato-fullstack-backend.env.example"
      - ".github/workflows/deploy-fullstack-tencent.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fullstack-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate required GitHub secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=0
          for key in SSH_HOST SSH_USER; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub secret: $key"
              missing=1
            fi
          done

          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package deploy archive
        run: |
          tar czf /tmp/JATO_deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            -C "$GITHUB_WORKSPACE" .
          ls -lh /tmp/JATO_deploy.tar.gz

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: /tmp/JATO_deploy.tar.gz
          target: /tmp/
          strip_components: 0

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            REPO_DIR="${{ vars.DEPLOY_REPO_DIR }}"
            BACKEND_SERVICE_NAME="${{ vars.FULLSTACK_BACKEND_SERVICE_NAME }}"
            VITE_API_BASE="${{ vars.FULLSTACK_VITE_API_BASE }}"
            VITE_USER_ROLE="${{ vars.FULLSTACK_VITE_USER_ROLE }}"
            VITE_USER_NAME="${{ vars.FULLSTACK_VITE_USER_NAME }}"

            export REPO_DIR="${REPO_DIR:-/opt/JATO_Analysis_System-main}"
            export BACKEND_SERVICE_NAME="${BACKEND_SERVICE_NAME:-jato-fullstack-backend@8000}"
            export VITE_API_BASE="${VITE_API_BASE:-/v1}"
            export VITE_USER_ROLE="${VITE_USER_ROLE:-viewer}"
            export VITE_USER_NAME="${VITE_USER_NAME:-github-actions}"
            export SKIP_GIT_SYNC=true

            # Extract fresh code pushed by GitHub Actions (no server→GitHub needed)
            echo "[INFO] Extracting deploy archive to $REPO_DIR …"
            sudo mkdir -p "$REPO_DIR"
            sudo chown -R "$USER":"$USER" "$REPO_DIR"
            sudo tar xzf /tmp/JATO_deploy.tar.gz -C "$REPO_DIR"
            rm -f /tmp/JATO_deploy.tar.gz

            cd "$REPO_DIR"
            bash 03_Scripts/deploy_fullstack_server.sh
