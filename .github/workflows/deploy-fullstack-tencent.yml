name: deploy-fullstack-tencent  # auto-deploy DeepSeek + Governed Copilot v2

on:
  push:
    branches: ["main"]
    paths:
      - "06_AppPlatform/**"
      - "07_ScrapingToolkit/**"
      - "03_Scripts/**"
      - "hermes/**"
      - "01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
      - ".github/workflows/deploy-fullstack-tencent.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fullstack-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required GitHub secrets
        id: auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=0
          auth_mode=""
          for key in SSH_HOST SSH_USER; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub secret: $key"
              missing=1
            fi
          done

          if [ -n "$SSH_PRIVATE_KEY" ]; then
            auth_mode="key"
          elif [ -n "$SSH_PASSWORD" ]; then
            auth_mode="password"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "mode=$auth_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Package deploy archive
        env:
          MIHOMO_SUB_URL: ${{ secrets.MIHOMO_SUB_URL }}
        run: |
          REQUIRED_WORKBOOK="01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
          if [ ! -f "$GITHUB_WORKSPACE/$REQUIRED_WORKBOOK" ]; then
            echo "::error::Missing required workbook: $REQUIRED_WORKBOOK"
            exit 1
          fi

          python3 - <<'PY'
          import datetime as _dt
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sha = os.environ["GITHUB_SHA"]
          try:
              short_sha = subprocess.check_output(
                  ["git", "rev-parse", "--short=8", "HEAD"],
                  cwd=root,
                  text=True,
              ).strip()
          except Exception:
              short_sha = sha[:8]
          payload = {
              "releaseId": f"{os.environ.get('GITHUB_RUN_ID', '')}-{os.environ.get('GITHUB_RUN_ATTEMPT', '')}",
              "service": "jato-fullstack-backend",
              "environment": "production",
              "expectedCommitSha": sha,
              "commitSha": sha,
              "shortSha": short_sha,
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "workflowRunId": os.environ.get("GITHUB_RUN_ID", ""),
              "workflowRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "deployMethod": "github_actions",
              "packagedAt": _dt.datetime.now(_dt.UTC).isoformat(),
              "source": "github_actions_archive",
          }
          out = root / "hermes" / "deploy_release.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Wrote {out.relative_to(root)} for release {short_sha}")
          PY

          MIHOMO_PAYLOAD_ROOT="$RUNNER_TEMP/mihomo_payload"
          MIHOMO_PACKAGED_CONFIG="$MIHOMO_PAYLOAD_ROOT/hermes/runtime/mihomo/config.yaml"
          if [ -n "${MIHOMO_SUB_URL:-}" ]; then
            echo "[mihomo-sub] Building prebuilt mihomo config on GitHub runner"
            if MIHOMO_OUTPUT_CONFIG="$MIHOMO_PACKAGED_CONFIG" \
              bash 03_Scripts/deploy/update_mihomo_subscription.sh; then
              echo "[mihomo-sub] Prebuilt mihomo config ready"
            else
              echo "[WARN] Prebuilt mihomo config failed; server will try local refresh"
              rm -f "$MIHOMO_PACKAGED_CONFIG"
            fi
          fi

          tar cf "$RUNNER_TEMP/JATO_deploy.tar" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='.claude' \
            --exclude='tmp' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='01_RAW_DATA' \
            --exclude='04_Processed_data' \
            --exclude='*.ipynb' \
            --exclude='data_wangler' \
            --exclude='Markdown_Readme' \
            -C "$GITHUB_WORKSPACE" .
          tar rf "$RUNNER_TEMP/JATO_deploy.tar" \
            -C "$GITHUB_WORKSPACE" \
            "$REQUIRED_WORKBOOK"
          if [ -f "$MIHOMO_PACKAGED_CONFIG" ]; then
            tar rf "$RUNNER_TEMP/JATO_deploy.tar" \
              -C "$MIHOMO_PAYLOAD_ROOT" \
              hermes/runtime/mihomo/config.yaml
          fi
          gzip -f "$RUNNER_TEMP/JATO_deploy.tar"
          ls -lh "$RUNNER_TEMP/JATO_deploy.tar.gz"
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" "$REQUIRED_WORKBOOK"

      - name: Upload archive to server
        if: ${{ steps.auth.outputs.mode == 'key' }}
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
          chmod 600 ~/.ssh/github_actions_tencent_key

          ARCHIVE_PATH="$RUNNER_TEMP/JATO_deploy.tar.gz"
          REMOTE_ARCHIVE="/tmp/JATO_deploy.tar.gz"
          REMOTE_ARCHIVE_TMP="${REMOTE_ARCHIVE}.uploading"
          ls -lh "$ARCHIVE_PATH"

          timeout 600s scp -q -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o Compression=yes \
            -o IPQoS=none \
            -i ~/.ssh/github_actions_tencent_key \
            "$ARCHIVE_PATH" \
            "$SSH_USER@$SSH_HOST:$REMOTE_ARCHIVE_TMP"

          timeout 180s ssh -T -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IPQoS=none \
            -i ~/.ssh/github_actions_tencent_key \
            "$SSH_USER@$SSH_HOST" \
            "mv '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && ls -lh '$REMOTE_ARCHIVE'"

      - name: Upload archive to server
        if: ${{ steps.auth.outputs.mode == 'password' }}
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PASSWORD:?Missing SSH_PASSWORD}"
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          ARCHIVE_PATH="$RUNNER_TEMP/JATO_deploy.tar.gz"
          REMOTE_ARCHIVE="/tmp/JATO_deploy.tar.gz"
          REMOTE_ARCHIVE_TMP="${REMOTE_ARCHIVE}.uploading"
          ls -lh "$ARCHIVE_PATH"

          timeout 600s sshpass -p "$SSH_PASSWORD" \
            scp -q -P "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o Compression=yes \
            -o IPQoS=none \
            "$ARCHIVE_PATH" \
            "$SSH_USER@$SSH_HOST:$REMOTE_ARCHIVE_TMP"

          timeout 180s sshpass -p "$SSH_PASSWORD" \
            ssh -T -p "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IPQoS=none \
            "$SSH_USER@$SSH_HOST" \
            "mv '$REMOTE_ARCHIVE_TMP' '$REMOTE_ARCHIVE' && ls -lh '$REMOTE_ARCHIVE'"

      - name: Deploy on server via SSH
        if: ${{ steps.auth.outputs.mode == 'key' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          if [ -z "${DEPLOY_SERVER_NAME:-}" ]; then
            DEPLOY_SERVER_NAME="ojeur.cloud www.ojeur.cloud"
          fi
          if [ -z "${DEPLOY_ENABLE_HTTPS:-}" ]; then
            DEPLOY_ENABLE_HTTPS="true"
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
          chmod 600 ~/.ssh/github_actions_tencent_key

          DEPLOY_SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          REMOTE_EXPORTS="export DEPLOY_SERVER_NAME=$(printf '%q' "$DEPLOY_SERVER_NAME"); "
          REMOTE_EXPORTS+="export DEPLOY_ENABLE_HTTPS=$(printf '%q' "$DEPLOY_ENABLE_HTTPS"); "
          REMOTE_EXPORTS+="export DEPLOY_CERTBOT_EMAIL=$(printf '%q' "${DEPLOY_CERTBOT_EMAIL:-}"); "
          REMOTE_EXPORTS+="export VITE_ASSET_BASE_URL=$(printf '%q' "${VITE_ASSET_BASE_URL:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_COMMIT_SHA=$(printf '%q' "${GITHUB_SHA:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_SHORT_SHA=$(printf '%q' "$DEPLOY_SHORT_SHA"); "
          REMOTE_EXPORTS+="export DEPLOY_RELEASE_ID=$(printf '%q' "${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ID=$(printf '%q' "${GITHUB_RUN_ID:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ATTEMPT=$(printf '%q' "${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_REPOSITORY=$(printf '%q' "${GITHUB_REPOSITORY:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_WORKFLOW=$(printf '%q' "${GITHUB_WORKFLOW:-}"); "
          REMOTE_EXPORTS+="export DEEPSEEK_API_KEY=$(printf '%q' '${{ secrets.DEEPSEEK_API_KEY }}'); "
          REMOTE_EXPORTS+="export HERMES_SYNC_TOKEN=$(printf '%q' '${{ secrets.HERMES_SYNC_TOKEN }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_ID=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_ID }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_SECRET=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_SECRET }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_PROXY_URL=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_PROXY_URL }}'); "
          REMOTE_EXPORTS+="export MIHOMO_SUB_URL=$(printf '%q' '${{ secrets.MIHOMO_SUB_URL }}'); "
          REMOTE_EXPORTS+="export MIHOMO_DB_PATH=$(printf '%q' '${{ vars.MIHOMO_DB_PATH }}'); "

          timeout 1800s ssh -v -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/github_actions_tencent_key \
            "$SSH_USER@$SSH_HOST" "${REMOTE_EXPORTS}bash -s" <<'EOF'
          set -euo pipefail

          REPO_DIR="/opt/JATO_Analysis_System-main"
          ENV_FILE="/etc/jato-fullstack/backend.env"
          LOCAL_NO_PROXY_HOSTS="localhost,127.0.0.1,::1"
          export no_proxy="${no_proxy:+$no_proxy,}$LOCAL_NO_PROXY_HOSTS"
          export NO_PROXY="${NO_PROXY:+$NO_PROXY,}$LOCAL_NO_PROXY_HOSTS"

          if [ -z "${DEPLOY_COMMIT_SHA:-}" ]; then
            echo "[ERROR] DEPLOY_COMMIT_SHA is required for sparse deployment"
            exit 1
          fi

          RELEASE_WORKTREE="/tmp/JATO_deploy_work_${DEPLOY_COMMIT_SHA}"
          RELEASE_ARCHIVE="/tmp/JATO_deploy.tar.gz"
          RELEASE_REMOTE="https://github.com/tristan419/JATO_Analysis_System.git"
          DEPLOY_SOURCE="github_sparse_checkout"
          RUNTIME_PRESERVE_DIR="$(mktemp -d /tmp/JATO_deploy_runtime.XXXXXX)"
          RUNTIME_PRESERVE_PATHS="
          03_Scripts/diagnostics/artifacts
          03_Scripts/logs
          06_AppPlatform/frontend/dist
          hermes/reports
          "

          rm -rf "$RELEASE_WORKTREE"
          mkdir -p "$RELEASE_WORKTREE"
          if [ -f "$RELEASE_ARCHIVE" ] && ! tar tzf "$RELEASE_ARCHIVE" >/dev/null 2>&1; then
            echo "[WARN] Uploaded deploy archive is incomplete or invalid; falling back to sparse Git fetch"
            rm -f "$RELEASE_ARCHIVE"
          fi
          ARCHIVE_READY=false
          if [ -f "$RELEASE_ARCHIVE" ]; then
            echo "[INFO] Inspecting uploaded deploy archive: $RELEASE_ARCHIVE"
            if tar xzf "$RELEASE_ARCHIVE" -C "$RELEASE_WORKTREE"; then
              ARCHIVE_COMMIT="$(python3 -c 'import json, sys; from pathlib import Path; p = Path(sys.argv[1]); payload = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; print(payload.get("expectedCommitSha") or payload.get("commitSha") or "")' "$RELEASE_WORKTREE/hermes/deploy_release.json")"
              if [ "$ARCHIVE_COMMIT" = "$DEPLOY_COMMIT_SHA" ]; then
                echo "[INFO] Using uploaded deploy archive for ${DEPLOY_SHORT_SHA:-$DEPLOY_COMMIT_SHA}"
                DEPLOY_SOURCE="github_actions_archive"
                ARCHIVE_READY=true
                rm -f "$RELEASE_ARCHIVE"
              else
                echo "[WARN] Uploaded deploy archive commit mismatch: archive=${ARCHIVE_COMMIT:-missing} expected=$DEPLOY_COMMIT_SHA; falling back to sparse Git fetch"
                rm -rf "$RELEASE_WORKTREE"
                mkdir -p "$RELEASE_WORKTREE"
                rm -f "$RELEASE_ARCHIVE"
              fi
            else
              echo "[WARN] Uploaded deploy archive extraction failed; falling back to sparse Git fetch"
              rm -rf "$RELEASE_WORKTREE"
              mkdir -p "$RELEASE_WORKTREE"
              rm -f "$RELEASE_ARCHIVE"
            fi
          fi
          if [ "$ARCHIVE_READY" != "true" ]; then
            echo "[WARN] Uploaded deploy archive not found; falling back to sparse Git fetch"
            git -C "$RELEASE_WORKTREE" init
            git -C "$RELEASE_WORKTREE" remote add origin "$RELEASE_REMOTE"
            git -C "$RELEASE_WORKTREE" config advice.detachedHead false
            git -C "$RELEASE_WORKTREE" config core.sparseCheckout true
            git -C "$RELEASE_WORKTREE" config core.sparseCheckoutCone false
            git -C "$RELEASE_WORKTREE" config http.version HTTP/1.1
            git -C "$RELEASE_WORKTREE" config http.lowSpeedLimit 1
            git -C "$RELEASE_WORKTREE" config http.lowSpeedTime 600
            mkdir -p "$RELEASE_WORKTREE/.git/info"
            cat > "$RELEASE_WORKTREE/.git/info/sparse-checkout" <<'SPARSE'
          /03_Scripts/
          /06_AppPlatform/
          /07_ScrapingToolkit/
          /hermes/
          /01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx
          /.nvmrc
          /requirements.txt
          /CODEX.md
          SPARSE
            FETCH_RC=1
            for fetch_attempt in 1 2 3 4 5; do
              echo "[INFO] Sparse fetch attempt ${fetch_attempt}/5 for ${DEPLOY_SHORT_SHA:-$DEPLOY_COMMIT_SHA}"
              if git -C "$RELEASE_WORKTREE" fetch --depth=1 --filter=blob:none origin "$DEPLOY_COMMIT_SHA"; then
                FETCH_RC=0
                break
              fi
              FETCH_RC=$?
              rm -f "$RELEASE_WORKTREE/.git/FETCH_HEAD.lock" \
                "$RELEASE_WORKTREE/.git/index.lock" \
                "$RELEASE_WORKTREE/.git/shallow.lock"
              sleep $((fetch_attempt * 10))
            done
            if [ "$FETCH_RC" -ne 0 ]; then
              echo "[ERROR] Sparse fetch failed after retries"
              exit "$FETCH_RC"
            fi
            git -C "$RELEASE_WORKTREE" checkout --force FETCH_HEAD
          fi

          for runtime_path in $RUNTIME_PRESERVE_PATHS; do
            if [ -e "$REPO_DIR/$runtime_path" ]; then
              mkdir -p "$RUNTIME_PRESERVE_DIR/$(dirname "$runtime_path")"
              cp -a "$REPO_DIR/$runtime_path" "$RUNTIME_PRESERVE_DIR/$runtime_path"
              echo "[INFO] Preserved runtime path: $runtime_path"
            fi
          done

          sudo mkdir -p "$REPO_DIR"
          sudo chown -R "$USER":"$USER" "$REPO_DIR"
          for release_path in 03_Scripts 06_AppPlatform 07_ScrapingToolkit hermes; do
            if [ -e "$RELEASE_WORKTREE/$release_path" ]; then
              rm -rf "$REPO_DIR/$release_path"
              (cd "$RELEASE_WORKTREE" && tar cf - "$release_path") | (cd "$REPO_DIR" && tar xf -)
            fi
          done
          if [ ! -f "$RELEASE_WORKTREE/01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx" ]; then
            echo "[ERROR] Sparse deploy missing required workbook"
            exit 1
          fi
          mkdir -p "$REPO_DIR/01_RAW_DATA"
          cp -f "$RELEASE_WORKTREE/01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx" \
            "$REPO_DIR/01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
          for release_file in .nvmrc requirements.txt CODEX.md; do
            if [ -f "$RELEASE_WORKTREE/$release_file" ]; then
              cp -f "$RELEASE_WORKTREE/$release_file" "$REPO_DIR/$release_file"
            fi
          done
          for runtime_path in $RUNTIME_PRESERVE_PATHS; do
            if [ -e "$RUNTIME_PRESERVE_DIR/$runtime_path" ]; then
              rm -rf "$REPO_DIR/$runtime_path"
              mkdir -p "$(dirname "$REPO_DIR/$runtime_path")"
              cp -a "$RUNTIME_PRESERVE_DIR/$runtime_path" "$REPO_DIR/$runtime_path"
              echo "[INFO] Restored runtime path: $runtime_path"
            fi
          done
          rm -rf "$RUNTIME_PRESERVE_DIR"
          rm -rf "$RELEASE_WORKTREE"

          echo "[INFO] Refreshing local mihomo subscription before backend restart..."
          mkdir -p "$REPO_DIR/hermes/reports"
          MIHOMO_REFRESH_LOG="$REPO_DIR/hermes/reports/mihomo_refresh_status.txt"
          PACKAGED_MIHOMO_CONFIG="$REPO_DIR/hermes/runtime/mihomo/config.yaml"
          {
            date -u
            if [ -n "${MIHOMO_SUB_URL:-}" ]; then
              echo "[mihomo-sub] MIHOMO_SUB_URL configured from deploy environment"
            else
              echo "[mihomo-sub] MIHOMO_SUB_URL not configured; trying local protected file and 0dcloud discovery"
            fi
            echo "[mihomo-sub] MIHOMO_SUB_URL_FILE=${MIHOMO_SUB_URL_FILE:-/etc/mihomo/subscription_url}"
            echo "[mihomo-sub] MIHOMO_DB_PATH=${MIHOMO_DB_PATH:-auto}"
            if [ -r "$PACKAGED_MIHOMO_CONFIG" ]; then
              echo "[mihomo-sub] Using packaged mihomo config from GitHub runner"
              MIHOMO_LOCAL=true MIHOMO_SOURCE_CONFIG="$PACKAGED_MIHOMO_CONFIG" \
                bash "$REPO_DIR/03_Scripts/deploy/update_mihomo_subscription.sh"
            else
              MIHOMO_LOCAL=true bash "$REPO_DIR/03_Scripts/deploy/update_mihomo_subscription.sh"
            fi
            rm -f "$PACKAGED_MIHOMO_CONFIG"
          } > "$MIHOMO_REFRESH_LOG" 2>&1 \
            || echo "[WARN] Local mihomo refresh failed; continuing with existing proxy config" >> "$MIHOMO_REFRESH_LOG"

          export REPO_DIR DEPLOY_SOURCE
          python3 - <<'PY'
          import datetime as _dt
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["REPO_DIR"])
          commit_sha = os.environ.get("DEPLOY_COMMIT_SHA", "")
          payload = {
              "releaseId": os.environ.get("DEPLOY_RELEASE_ID", ""),
              "service": "jato-fullstack-backend",
              "environment": "production",
              "expectedCommitSha": commit_sha,
              "commitSha": commit_sha,
              "shortSha": os.environ.get("DEPLOY_SHORT_SHA") or commit_sha[:8],
              "branch": os.environ.get("DEPLOY_BRANCH", "main"),
              "repository": os.environ.get("DEPLOY_REPOSITORY", "tristan419/JATO_Analysis_System"),
              "workflow": os.environ.get("DEPLOY_WORKFLOW", "deploy-fullstack-tencent"),
              "workflowRunId": os.environ.get("DEPLOY_RUN_ID", ""),
              "workflowRunAttempt": os.environ.get("DEPLOY_RUN_ATTEMPT", ""),
              "deployMethod": "github_actions",
              "packagedAt": _dt.datetime.now(_dt.UTC).isoformat(),
              "source": os.environ.get("DEPLOY_SOURCE", "github_sparse_checkout"),
          }
          out = root / "hermes" / "deploy_release.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"[INFO] Wrote {out.relative_to(root)} for release {payload['shortSha']}")
          PY

          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "[INFO] Configuring DeepSeek in backend env..."
            sudo -n mkdir -p "$(dirname "$ENV_FILE")" 2>/dev/null || true
            if sudo -n test -f "$ENV_FILE" 2>/dev/null; then
              sudo -n sed -i '/^DEEPSEEK_API_KEY=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^HERMES_SYNC_TOKEN=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_COUNTRY_CHAT_DEEPSEEK_TIMEOUT_SECONDS=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_COUNTRY_CHAT_MODEL_OPTIONS=/d' "$ENV_FILE" 2>/dev/null || true
              {
                echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
                echo "HERMES_SYNC_TOKEN=$HERMES_SYNC_TOKEN"
                echo "APP_COUNTRY_CHAT_DEEPSEEK_TIMEOUT_SECONDS=60"
                echo "APP_COUNTRY_CHAT_MODEL_OPTIONS=deepseek:deepseek-chat"
              } | sudo -n tee -a "$ENV_FILE" > /dev/null 2>&1 || true
              echo "[INFO] DeepSeek config updated"
            fi
          fi

          if [ -n "${GOOGLE_CLIENT_ID:-}" ]; then
            echo "[INFO] Configuring Google OAuth in backend env..."
            sudo -n mkdir -p "$(dirname "$ENV_FILE")" 2>/dev/null || true
            if sudo -n test -f "$ENV_FILE" 2>/dev/null; then
              sudo -n sed -i '/^APP_GOOGLE_CLIENT_ID=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_CLIENT_SECRET=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_REDIRECT_URI=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_FRONTEND_ORIGIN=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_FRONTEND_ORIGINS=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_CORS_ORIGINS=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_OAUTH_PROXY_URL=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_OAUTH_TIMEOUT_SECONDS=/d' "$ENV_FILE" 2>/dev/null || true
              GOOGLE_OAUTH_PROXY_URL="${GOOGLE_OAUTH_PROXY_URL:-http://127.0.0.1:7897}"
              {
                echo "APP_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
                echo "APP_GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
                echo "APP_GOOGLE_REDIRECT_URI=https://www.ojeur.cloud/v1/auth/google/callback"
                echo "APP_FRONTEND_ORIGIN=https://www.ojeur.cloud"
                echo "APP_FRONTEND_ORIGINS=https://www.ojeur.cloud,https://intl.ojeur.cloud"
                echo "APP_CORS_ORIGINS=https://www.ojeur.cloud,https://intl.ojeur.cloud,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
                echo "APP_GOOGLE_OAUTH_PROXY_URL=$GOOGLE_OAUTH_PROXY_URL"
                echo "APP_GOOGLE_OAUTH_TIMEOUT_SECONDS=30"
              } | sudo -n tee -a "$ENV_FILE" > /dev/null 2>&1 || true
              echo "[INFO] Google OAuth config updated"
            fi
            check_google_oauth_proxy() {
              local label="$1"
              local proxy_url="${GOOGLE_OAUTH_PROXY_URL:-http://127.0.0.1:7897}"
              echo "[INFO] Google OAuth proxy check (${label}) via ${proxy_url}"
              curl -I --max-time 20 --proxy "$proxy_url" https://oauth2.googleapis.com/token
            }
            if ! check_google_oauth_proxy "before-mihomo-restart"; then
              echo "[WARN] Google OAuth proxy check failed; restarting mihomo"
              sudo -n systemctl restart mihomo.service 2>/dev/null \
                || sudo -n systemctl restart mihomo 2>/dev/null \
                || true
              sleep 5
              if ! check_google_oauth_proxy "after-mihomo-restart"; then
                echo "[WARN] Google OAuth proxy still failed; selecting a working mihomo node"
                bash "$REPO_DIR/03_Scripts/deploy/select_mihomo_google_proxy.sh" || true
                check_google_oauth_proxy "after-mihomo-select" || true
              fi
            fi
          fi

          cd "$REPO_DIR"
          export REPO_DIR SKIP_GIT_SYNC=true
          export BACKEND_SERVICE_NAME="jato-fullstack-backend@8000"
          export VITE_API_BASE="/v1"
          export VITE_ASSET_BASE_URL="${VITE_ASSET_BASE_URL:-}"
          export VITE_USER_ROLE="viewer"
          export VITE_USER_NAME="github-actions"
          set +e
          bash 03_Scripts/deploy_fullstack_server.sh 2>&1
          DEPLOY_RC=$?
          set -e

          FRONTEND_ROOT="$REPO_DIR/06_AppPlatform/frontend/dist"

          if [ "$DEPLOY_RC" -eq 0 ] && [ -n "$DEPLOY_SERVER_NAME" ] && [ "$DEPLOY_SERVER_NAME" != "_" ]; then
            if [ "${DEPLOY_ENABLE_HTTPS,,}" = "true" ]; then
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                CERTBOT_EMAIL="$DEPLOY_CERTBOT_EMAIL" CERTBOT_RENEW_DRY_RUN=false \
                bash 03_Scripts/deploy/nginx/enable_jato_fullstack_https.sh
            else
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                bash 03_Scripts/deploy/nginx/install_jato_fullstack_nginx.sh
            fi
            NGINX_CONF=$(sudo -n nginx -T 2>/dev/null | grep -l 'proxy_pass http://jato_fullstack_api' /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null | head -1 || echo "")
            if [ -n "$NGINX_CONF" ] && sudo -n test -f "$NGINX_CONF"; then
              sudo -n sed -i 's/proxy_buffering on;/proxy_buffering off;/g' "$NGINX_CONF" 2>/dev/null || true
              sudo -n nginx -t 2>/dev/null && sudo -n systemctl reload nginx 2>/dev/null || true
              echo "[INFO] nginx proxy_buffering disabled for SSE streaming"
            fi
          fi

          DIST="$REPO_DIR/06_AppPlatform/frontend/dist"
          mkdir -p "$DIST"
          {
            echo "deploy_exit_code=$DEPLOY_RC"
            echo "timestamp=$(date -u)"
            echo "---systemctl---"
            sudo -n systemctl status jato-fullstack-backend@8000 --no-pager 2>&1 || true
            echo "---healthz---"
            curl --noproxy '*' -fsS http://127.0.0.1:8000/healthz 2>&1 || echo "HEALTHZ_FAILED"
            echo "---google oauth proxy---"
            sudo -n awk -F= '/^(APP_GOOGLE_OAUTH_PROXY_URL|APP_GOOGLE_OAUTH_TIMEOUT_SECONDS|APP_GOOGLE_REDIRECT_URI|APP_FRONTEND_ORIGIN|APP_FRONTEND_ORIGINS|APP_CORS_ORIGINS)=/ {print}' "$ENV_FILE" 2>&1 || true
            systemctl is-active mihomo 2>&1 || true
            ss -ltnp | grep -E '(:7897)\b' 2>&1 || true
            curl -I --max-time 20 --proxy "${GOOGLE_OAUTH_PROXY_URL:-http://127.0.0.1:7897}" https://oauth2.googleapis.com/token 2>&1 || true
            echo "---mihomo refresh---"
            cat "$REPO_DIR/hermes/reports/mihomo_refresh_status.txt" 2>&1 || echo "MIHOMO_REFRESH_STATUS_MISSING"
            echo "---release---"
            cat "$REPO_DIR/hermes/deploy_release.json" 2>&1 || echo "RELEASE_METADATA_MISSING"
            echo "---deploy failure context---"
            cat "$REPO_DIR/hermes/deploy_failure_context.txt" 2>&1 || echo "DEPLOY_FAILURE_CONTEXT_MISSING"
            echo "---nginx---"
            sudo -n systemctl status nginx --no-pager 2>&1 | head -5 || true
            echo "---msrp scheduler---"
            sudo -n systemctl status jato-msrp-dryrun.timer --no-pager 2>&1 || true
            sudo -n systemctl status jato-msrp-sync@dryrun.service --no-pager 2>&1 || true
            echo "---msrp timers---"
            sudo -n systemctl list-timers --all 'jato-msrp*' --no-pager 2>&1 || true
            echo "---msrp env---"
            bash "$REPO_DIR/03_Scripts/ops/print_msrp_env_status.sh" 2>&1 || true
            echo "---msrp artifacts---"
            for artifact_path in \
              03_Scripts/diagnostics/artifacts/dryrun_report.json \
              03_Scripts/diagnostics/artifacts/dryrun_runs_index.json \
              hermes/reports/msrp_country_progress.json \
              hermes/reports/pipeline_status/msrp_dryrun.json
            do
              if [ -e "$REPO_DIR/$artifact_path" ]; then
                stat -c "$artifact_path size=%s mtime=%y" "$REPO_DIR/$artifact_path" 2>&1 || true
              else
                echo "missing $artifact_path"
              fi
            done
            echo "---index.html---"
            head -1 "$DIST/index.html" 2>&1 || echo "INDEX_MISSING"
          } > "$DIST/_deploy_status.txt" 2>&1

          if [ "$DEPLOY_RC" -ne 0 ]; then
            exit "$DEPLOY_RC"
          fi
          curl --noproxy '*' -fsS http://127.0.0.1:8000/healthz >/dev/null
          EOF

      - name: Deploy on server via SSH
        if: ${{ steps.auth.outputs.mode == 'password' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PORT:-}" ]; then
            SSH_PORT=22
          fi
          if [ -z "${DEPLOY_SERVER_NAME:-}" ]; then
            DEPLOY_SERVER_NAME="ojeur.cloud www.ojeur.cloud"
          fi
          if [ -z "${DEPLOY_ENABLE_HTTPS:-}" ]; then
            DEPLOY_ENABLE_HTTPS="true"
          fi

          sudo apt-get update -y
          sudo apt-get install -y sshpass

          DEPLOY_SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          REMOTE_EXPORTS="export DEPLOY_SERVER_NAME=$(printf '%q' "$DEPLOY_SERVER_NAME"); "
          REMOTE_EXPORTS+="export DEPLOY_ENABLE_HTTPS=$(printf '%q' "$DEPLOY_ENABLE_HTTPS"); "
          REMOTE_EXPORTS+="export DEPLOY_CERTBOT_EMAIL=$(printf '%q' "${DEPLOY_CERTBOT_EMAIL:-}"); "
          REMOTE_EXPORTS+="export VITE_ASSET_BASE_URL=$(printf '%q' "${VITE_ASSET_BASE_URL:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_COMMIT_SHA=$(printf '%q' "${GITHUB_SHA:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_SHORT_SHA=$(printf '%q' "$DEPLOY_SHORT_SHA"); "
          REMOTE_EXPORTS+="export DEPLOY_RELEASE_ID=$(printf '%q' "${GITHUB_RUN_ID:-}-${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ID=$(printf '%q' "${GITHUB_RUN_ID:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_RUN_ATTEMPT=$(printf '%q' "${GITHUB_RUN_ATTEMPT:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_REPOSITORY=$(printf '%q' "${GITHUB_REPOSITORY:-}"); "
          REMOTE_EXPORTS+="export DEPLOY_WORKFLOW=$(printf '%q' "${GITHUB_WORKFLOW:-}"); "
          REMOTE_EXPORTS+="export DEEPSEEK_API_KEY=$(printf '%q' '${{ secrets.DEEPSEEK_API_KEY }}'); "
          REMOTE_EXPORTS+="export HERMES_SYNC_TOKEN=$(printf '%q' '${{ secrets.HERMES_SYNC_TOKEN }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_ID=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_ID }}'); "
          REMOTE_EXPORTS+="export GOOGLE_CLIENT_SECRET=$(printf '%q' '${{ secrets.GOOGLE_CLIENT_SECRET }}'); "
          REMOTE_EXPORTS+="export GOOGLE_OAUTH_PROXY_URL=$(printf '%q' '${{ secrets.GOOGLE_OAUTH_PROXY_URL }}'); "
          REMOTE_EXPORTS+="export MIHOMO_SUB_URL=$(printf '%q' '${{ secrets.MIHOMO_SUB_URL }}'); "
          REMOTE_EXPORTS+="export MIHOMO_DB_PATH=$(printf '%q' '${{ vars.MIHOMO_DB_PATH }}'); "

          sshpass -p "$SSH_PASSWORD" \
            timeout 1800s ssh -v -p "$SSH_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" "${REMOTE_EXPORTS}bash -s" <<'EOF'
          set -euo pipefail

          REPO_DIR="/opt/JATO_Analysis_System-main"
          ENV_FILE="/etc/jato-fullstack/backend.env"
          LOCAL_NO_PROXY_HOSTS="localhost,127.0.0.1,::1"
          export no_proxy="${no_proxy:+$no_proxy,}$LOCAL_NO_PROXY_HOSTS"
          export NO_PROXY="${NO_PROXY:+$NO_PROXY,}$LOCAL_NO_PROXY_HOSTS"

          if [ -z "${DEPLOY_COMMIT_SHA:-}" ]; then
            echo "[ERROR] DEPLOY_COMMIT_SHA is required for sparse deployment"
            exit 1
          fi

          RELEASE_WORKTREE="/tmp/JATO_deploy_work_${DEPLOY_COMMIT_SHA}"
          RELEASE_ARCHIVE="/tmp/JATO_deploy.tar.gz"
          RELEASE_REMOTE="https://github.com/tristan419/JATO_Analysis_System.git"
          DEPLOY_SOURCE="github_sparse_checkout"
          RUNTIME_PRESERVE_DIR="$(mktemp -d /tmp/JATO_deploy_runtime.XXXXXX)"
          RUNTIME_PRESERVE_PATHS="
          03_Scripts/diagnostics/artifacts
          03_Scripts/logs
          06_AppPlatform/frontend/dist
          hermes/reports
          "

          rm -rf "$RELEASE_WORKTREE"
          mkdir -p "$RELEASE_WORKTREE"
          if [ -f "$RELEASE_ARCHIVE" ] && ! tar tzf "$RELEASE_ARCHIVE" >/dev/null 2>&1; then
            echo "[WARN] Uploaded deploy archive is incomplete or invalid; falling back to sparse Git fetch"
            rm -f "$RELEASE_ARCHIVE"
          fi
          ARCHIVE_READY=false
          if [ -f "$RELEASE_ARCHIVE" ]; then
            echo "[INFO] Inspecting uploaded deploy archive: $RELEASE_ARCHIVE"
            if tar xzf "$RELEASE_ARCHIVE" -C "$RELEASE_WORKTREE"; then
              ARCHIVE_COMMIT="$(python3 -c 'import json, sys; from pathlib import Path; p = Path(sys.argv[1]); payload = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; print(payload.get("expectedCommitSha") or payload.get("commitSha") or "")' "$RELEASE_WORKTREE/hermes/deploy_release.json")"
              if [ "$ARCHIVE_COMMIT" = "$DEPLOY_COMMIT_SHA" ]; then
                echo "[INFO] Using uploaded deploy archive for ${DEPLOY_SHORT_SHA:-$DEPLOY_COMMIT_SHA}"
                DEPLOY_SOURCE="github_actions_archive"
                ARCHIVE_READY=true
                rm -f "$RELEASE_ARCHIVE"
              else
                echo "[WARN] Uploaded deploy archive commit mismatch: archive=${ARCHIVE_COMMIT:-missing} expected=$DEPLOY_COMMIT_SHA; falling back to sparse Git fetch"
                rm -rf "$RELEASE_WORKTREE"
                mkdir -p "$RELEASE_WORKTREE"
                rm -f "$RELEASE_ARCHIVE"
              fi
            else
              echo "[WARN] Uploaded deploy archive extraction failed; falling back to sparse Git fetch"
              rm -rf "$RELEASE_WORKTREE"
              mkdir -p "$RELEASE_WORKTREE"
              rm -f "$RELEASE_ARCHIVE"
            fi
          fi
          if [ "$ARCHIVE_READY" != "true" ]; then
            echo "[WARN] Uploaded deploy archive not found; falling back to sparse Git fetch"
            git -C "$RELEASE_WORKTREE" init
            git -C "$RELEASE_WORKTREE" remote add origin "$RELEASE_REMOTE"
            git -C "$RELEASE_WORKTREE" config advice.detachedHead false
            git -C "$RELEASE_WORKTREE" config core.sparseCheckout true
            git -C "$RELEASE_WORKTREE" config core.sparseCheckoutCone false
            git -C "$RELEASE_WORKTREE" config http.version HTTP/1.1
            git -C "$RELEASE_WORKTREE" config http.lowSpeedLimit 1
            git -C "$RELEASE_WORKTREE" config http.lowSpeedTime 600
            mkdir -p "$RELEASE_WORKTREE/.git/info"
            cat > "$RELEASE_WORKTREE/.git/info/sparse-checkout" <<'SPARSE'
          /03_Scripts/
          /06_AppPlatform/
          /07_ScrapingToolkit/
          /hermes/
          /01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx
          /.nvmrc
          /requirements.txt
          /CODEX.md
          SPARSE
            FETCH_RC=1
            for fetch_attempt in 1 2 3 4 5; do
              echo "[INFO] Sparse fetch attempt ${fetch_attempt}/5 for ${DEPLOY_SHORT_SHA:-$DEPLOY_COMMIT_SHA}"
              if git -C "$RELEASE_WORKTREE" fetch --depth=1 --filter=blob:none origin "$DEPLOY_COMMIT_SHA"; then
                FETCH_RC=0
                break
              fi
              FETCH_RC=$?
              rm -f "$RELEASE_WORKTREE/.git/FETCH_HEAD.lock" \
                "$RELEASE_WORKTREE/.git/index.lock" \
                "$RELEASE_WORKTREE/.git/shallow.lock"
              sleep $((fetch_attempt * 10))
            done
            if [ "$FETCH_RC" -ne 0 ]; then
              echo "[ERROR] Sparse fetch failed after retries"
              exit "$FETCH_RC"
            fi
            git -C "$RELEASE_WORKTREE" checkout --force FETCH_HEAD
          fi

          for runtime_path in $RUNTIME_PRESERVE_PATHS; do
            if [ -e "$REPO_DIR/$runtime_path" ]; then
              mkdir -p "$RUNTIME_PRESERVE_DIR/$(dirname "$runtime_path")"
              cp -a "$REPO_DIR/$runtime_path" "$RUNTIME_PRESERVE_DIR/$runtime_path"
              echo "[INFO] Preserved runtime path: $runtime_path"
            fi
          done

          sudo mkdir -p "$REPO_DIR"
          sudo chown -R "$USER":"$USER" "$REPO_DIR"
          for release_path in 03_Scripts 06_AppPlatform 07_ScrapingToolkit hermes; do
            if [ -e "$RELEASE_WORKTREE/$release_path" ]; then
              rm -rf "$REPO_DIR/$release_path"
              (cd "$RELEASE_WORKTREE" && tar cf - "$release_path") | (cd "$REPO_DIR" && tar xf -)
            fi
          done
          if [ ! -f "$RELEASE_WORKTREE/01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx" ]; then
            echo "[ERROR] Sparse deploy missing required workbook"
            exit 1
          fi
          mkdir -p "$REPO_DIR/01_RAW_DATA"
          cp -f "$RELEASE_WORKTREE/01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx" \
            "$REPO_DIR/01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
          for release_file in .nvmrc requirements.txt CODEX.md; do
            if [ -f "$RELEASE_WORKTREE/$release_file" ]; then
              cp -f "$RELEASE_WORKTREE/$release_file" "$REPO_DIR/$release_file"
            fi
          done
          for runtime_path in $RUNTIME_PRESERVE_PATHS; do
            if [ -e "$RUNTIME_PRESERVE_DIR/$runtime_path" ]; then
              rm -rf "$REPO_DIR/$runtime_path"
              mkdir -p "$(dirname "$REPO_DIR/$runtime_path")"
              cp -a "$RUNTIME_PRESERVE_DIR/$runtime_path" "$REPO_DIR/$runtime_path"
              echo "[INFO] Restored runtime path: $runtime_path"
            fi
          done
          rm -rf "$RUNTIME_PRESERVE_DIR"
          rm -rf "$RELEASE_WORKTREE"

          echo "[INFO] Refreshing local mihomo subscription before backend restart..."
          mkdir -p "$REPO_DIR/hermes/reports"
          MIHOMO_REFRESH_LOG="$REPO_DIR/hermes/reports/mihomo_refresh_status.txt"
          PACKAGED_MIHOMO_CONFIG="$REPO_DIR/hermes/runtime/mihomo/config.yaml"
          {
            date -u
            if [ -n "${MIHOMO_SUB_URL:-}" ]; then
              echo "[mihomo-sub] MIHOMO_SUB_URL configured from deploy environment"
            else
              echo "[mihomo-sub] MIHOMO_SUB_URL not configured; trying local protected file and 0dcloud discovery"
            fi
            echo "[mihomo-sub] MIHOMO_SUB_URL_FILE=${MIHOMO_SUB_URL_FILE:-/etc/mihomo/subscription_url}"
            echo "[mihomo-sub] MIHOMO_DB_PATH=${MIHOMO_DB_PATH:-auto}"
            if [ -r "$PACKAGED_MIHOMO_CONFIG" ]; then
              echo "[mihomo-sub] Using packaged mihomo config from GitHub runner"
              MIHOMO_LOCAL=true MIHOMO_SOURCE_CONFIG="$PACKAGED_MIHOMO_CONFIG" \
                bash "$REPO_DIR/03_Scripts/deploy/update_mihomo_subscription.sh"
            else
              MIHOMO_LOCAL=true bash "$REPO_DIR/03_Scripts/deploy/update_mihomo_subscription.sh"
            fi
            rm -f "$PACKAGED_MIHOMO_CONFIG"
          } > "$MIHOMO_REFRESH_LOG" 2>&1 \
            || echo "[WARN] Local mihomo refresh failed; continuing with existing proxy config" >> "$MIHOMO_REFRESH_LOG"

          export REPO_DIR DEPLOY_SOURCE
          python3 - <<'PY'
          import datetime as _dt
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["REPO_DIR"])
          commit_sha = os.environ.get("DEPLOY_COMMIT_SHA", "")
          payload = {
              "releaseId": os.environ.get("DEPLOY_RELEASE_ID", ""),
              "service": "jato-fullstack-backend",
              "environment": "production",
              "expectedCommitSha": commit_sha,
              "commitSha": commit_sha,
              "shortSha": os.environ.get("DEPLOY_SHORT_SHA") or commit_sha[:8],
              "branch": os.environ.get("DEPLOY_BRANCH", "main"),
              "repository": os.environ.get("DEPLOY_REPOSITORY", "tristan419/JATO_Analysis_System"),
              "workflow": os.environ.get("DEPLOY_WORKFLOW", "deploy-fullstack-tencent"),
              "workflowRunId": os.environ.get("DEPLOY_RUN_ID", ""),
              "workflowRunAttempt": os.environ.get("DEPLOY_RUN_ATTEMPT", ""),
              "deployMethod": "github_actions",
              "packagedAt": _dt.datetime.now(_dt.UTC).isoformat(),
              "source": os.environ.get("DEPLOY_SOURCE", "github_sparse_checkout"),
          }
          out = root / "hermes" / "deploy_release.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"[INFO] Wrote {out.relative_to(root)} for release {payload['shortSha']}")
          PY

          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "[INFO] Configuring DeepSeek in backend env..."
            sudo -n mkdir -p "$(dirname "$ENV_FILE")" 2>/dev/null || true
            if sudo -n test -f "$ENV_FILE" 2>/dev/null; then
              sudo -n sed -i '/^DEEPSEEK_API_KEY=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^HERMES_SYNC_TOKEN=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_COUNTRY_CHAT_DEEPSEEK_TIMEOUT_SECONDS=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_COUNTRY_CHAT_MODEL_OPTIONS=/d' "$ENV_FILE" 2>/dev/null || true
              {
                echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
                echo "HERMES_SYNC_TOKEN=$HERMES_SYNC_TOKEN"
                echo "APP_COUNTRY_CHAT_DEEPSEEK_TIMEOUT_SECONDS=60"
                echo "APP_COUNTRY_CHAT_MODEL_OPTIONS=deepseek:deepseek-chat"
              } | sudo -n tee -a "$ENV_FILE" > /dev/null 2>&1 || true
              echo "[INFO] DeepSeek config updated"
            fi
          fi

          if [ -n "${GOOGLE_CLIENT_ID:-}" ]; then
            echo "[INFO] Configuring Google OAuth in backend env..."
            sudo -n mkdir -p "$(dirname "$ENV_FILE")" 2>/dev/null || true
            if sudo -n test -f "$ENV_FILE" 2>/dev/null; then
              sudo -n sed -i '/^APP_GOOGLE_CLIENT_ID=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_CLIENT_SECRET=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_REDIRECT_URI=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_FRONTEND_ORIGIN=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_FRONTEND_ORIGINS=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_CORS_ORIGINS=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_OAUTH_PROXY_URL=/d' "$ENV_FILE" 2>/dev/null || true
              sudo -n sed -i '/^APP_GOOGLE_OAUTH_TIMEOUT_SECONDS=/d' "$ENV_FILE" 2>/dev/null || true
              GOOGLE_OAUTH_PROXY_URL="${GOOGLE_OAUTH_PROXY_URL:-http://127.0.0.1:7897}"
              {
                echo "APP_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
                echo "APP_GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
                echo "APP_GOOGLE_REDIRECT_URI=https://www.ojeur.cloud/v1/auth/google/callback"
                echo "APP_FRONTEND_ORIGIN=https://www.ojeur.cloud"
                echo "APP_FRONTEND_ORIGINS=https://www.ojeur.cloud,https://intl.ojeur.cloud"
                echo "APP_CORS_ORIGINS=https://www.ojeur.cloud,https://intl.ojeur.cloud,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
                echo "APP_GOOGLE_OAUTH_PROXY_URL=$GOOGLE_OAUTH_PROXY_URL"
                echo "APP_GOOGLE_OAUTH_TIMEOUT_SECONDS=30"
              } | sudo -n tee -a "$ENV_FILE" > /dev/null 2>&1 || true
              echo "[INFO] Google OAuth config updated"
            fi
            check_google_oauth_proxy() {
              local label="$1"
              local proxy_url="${GOOGLE_OAUTH_PROXY_URL:-http://127.0.0.1:7897}"
              echo "[INFO] Google OAuth proxy check (${label}) via ${proxy_url}"
              curl -I --max-time 20 --proxy "$proxy_url" https://oauth2.googleapis.com/token
            }
            if ! check_google_oauth_proxy "before-mihomo-restart"; then
              echo "[WARN] Google OAuth proxy check failed; restarting mihomo"
              sudo -n systemctl restart mihomo.service 2>/dev/null \
                || sudo -n systemctl restart mihomo 2>/dev/null \
                || true
              sleep 5
              if ! check_google_oauth_proxy "after-mihomo-restart"; then
                echo "[WARN] Google OAuth proxy still failed; selecting a working mihomo node"
                bash "$REPO_DIR/03_Scripts/deploy/select_mihomo_google_proxy.sh" || true
                check_google_oauth_proxy "after-mihomo-select" || true
              fi
            fi
          fi

          cd "$REPO_DIR"
          export REPO_DIR SKIP_GIT_SYNC=true
          export BACKEND_SERVICE_NAME="jato-fullstack-backend@8000"
          export VITE_API_BASE="/v1"
          export VITE_ASSET_BASE_URL="${VITE_ASSET_BASE_URL:-}"
          export VITE_USER_ROLE="viewer"
          export VITE_USER_NAME="github-actions"
          set +e
          bash 03_Scripts/deploy_fullstack_server.sh 2>&1
          DEPLOY_RC=$?
          set -e

          FRONTEND_ROOT="$REPO_DIR/06_AppPlatform/frontend/dist"

          if [ "$DEPLOY_RC" -eq 0 ] && [ -n "$DEPLOY_SERVER_NAME" ] && [ "$DEPLOY_SERVER_NAME" != "_" ]; then
            if [ "${DEPLOY_ENABLE_HTTPS,,}" = "true" ]; then
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                CERTBOT_EMAIL="$DEPLOY_CERTBOT_EMAIL" CERTBOT_RENEW_DRY_RUN=false \
                bash 03_Scripts/deploy/nginx/enable_jato_fullstack_https.sh
            else
              sudo SERVER_NAME="$DEPLOY_SERVER_NAME" BACKEND_PORT=8000 FRONTEND_ROOT="$FRONTEND_ROOT" \
                bash 03_Scripts/deploy/nginx/install_jato_fullstack_nginx.sh
            fi
            NGINX_CONF=$(sudo -n nginx -T 2>/dev/null | grep -l 'proxy_pass http://jato_fullstack_api' /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null | head -1 || echo "")
            if [ -n "$NGINX_CONF" ] && sudo -n test -f "$NGINX_CONF"; then
              sudo -n sed -i 's/proxy_buffering on;/proxy_buffering off;/g' "$NGINX_CONF" 2>/dev/null || true
              sudo -n nginx -t 2>/dev/null && sudo -n systemctl reload nginx 2>/dev/null || true
              echo "[INFO] nginx proxy_buffering disabled for SSE streaming"
            fi
          fi

          DIST="$REPO_DIR/06_AppPlatform/frontend/dist"
          mkdir -p "$DIST"
          {
            echo "deploy_exit_code=$DEPLOY_RC"
            echo "timestamp=$(date -u)"
            echo "---systemctl---"
            sudo -n systemctl status jato-fullstack-backend@8000 --no-pager 2>&1 || true
            echo "---healthz---"
            curl --noproxy '*' -fsS http://127.0.0.1:8000/healthz 2>&1 || echo "HEALTHZ_FAILED"
            echo "---google oauth proxy---"
            sudo -n awk -F= '/^(APP_GOOGLE_OAUTH_PROXY_URL|APP_GOOGLE_OAUTH_TIMEOUT_SECONDS|APP_GOOGLE_REDIRECT_URI|APP_FRONTEND_ORIGIN|APP_FRONTEND_ORIGINS|APP_CORS_ORIGINS)=/ {print}' "$ENV_FILE" 2>&1 || true
            systemctl is-active mihomo 2>&1 || true
            ss -ltnp | grep -E '(:7897)\b' 2>&1 || true
            curl -I --max-time 20 --proxy "${GOOGLE_OAUTH_PROXY_URL:-http://127.0.0.1:7897}" https://oauth2.googleapis.com/token 2>&1 || true
            echo "---mihomo refresh---"
            cat "$REPO_DIR/hermes/reports/mihomo_refresh_status.txt" 2>&1 || echo "MIHOMO_REFRESH_STATUS_MISSING"
            echo "---release---"
            cat "$REPO_DIR/hermes/deploy_release.json" 2>&1 || echo "RELEASE_METADATA_MISSING"
            echo "---deploy failure context---"
            cat "$REPO_DIR/hermes/deploy_failure_context.txt" 2>&1 || echo "DEPLOY_FAILURE_CONTEXT_MISSING"
            echo "---nginx---"
            sudo -n systemctl status nginx --no-pager 2>&1 | head -5 || true
            echo "---msrp scheduler---"
            sudo -n systemctl status jato-msrp-dryrun.timer --no-pager 2>&1 || true
            sudo -n systemctl status jato-msrp-sync@dryrun.service --no-pager 2>&1 || true
            echo "---msrp timers---"
            sudo -n systemctl list-timers --all 'jato-msrp*' --no-pager 2>&1 || true
            echo "---msrp env---"
            bash "$REPO_DIR/03_Scripts/ops/print_msrp_env_status.sh" 2>&1 || true
            echo "---msrp artifacts---"
            for artifact_path in \
              03_Scripts/diagnostics/artifacts/dryrun_report.json \
              03_Scripts/diagnostics/artifacts/dryrun_runs_index.json \
              hermes/reports/msrp_country_progress.json \
              hermes/reports/pipeline_status/msrp_dryrun.json
            do
              if [ -e "$REPO_DIR/$artifact_path" ]; then
                stat -c "$artifact_path size=%s mtime=%y" "$REPO_DIR/$artifact_path" 2>&1 || true
              else
                echo "missing $artifact_path"
              fi
            done
            echo "---index.html---"
            head -1 "$DIST/index.html" 2>&1 || echo "INDEX_MISSING"
          } > "$DIST/_deploy_status.txt" 2>&1

          if [ "$DEPLOY_RC" -ne 0 ]; then
            exit "$DEPLOY_RC"
          fi
          curl --noproxy '*' -fsS http://127.0.0.1:8000/healthz >/dev/null
          EOF
