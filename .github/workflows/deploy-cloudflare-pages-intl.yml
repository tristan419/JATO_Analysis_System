name: deploy-cloudflare-pages-intl

on:
  push:
    branches: ["main"]
    paths:
      - "06_AppPlatform/frontend/**"
      - ".github/workflows/deploy-cloudflare-pages-intl.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages-intl
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Cloudflare deploy configuration
        id: cloudflare_config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          missing=()
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            missing+=("CLOUDFLARE_API_TOKEN secret")
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID secret")
          fi
          if [ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]; then
            missing+=("CLOUDFLARE_PAGES_PROJECT_NAME variable or secret")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '[WARN] Skipping direct Cloudflare Pages deploy; missing: %s\n' "${missing[*]}"
            printf '[WARN] Cloudflare GitHub App deployments can still publish the Pages project when configured in Cloudflare.\n'
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.cloudflare_config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: 06_AppPlatform/frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.cloudflare_config.outputs.configured == 'true'
        working-directory: 06_AppPlatform/frontend
        run: npm ci

      - name: Build Cloudflare Pages assets
        if: steps.cloudflare_config.outputs.configured == 'true'
        working-directory: 06_AppPlatform/frontend
        env:
          CF_PAGES: "1"
          VITE_API_BASE: /v1
          VITE_ASSET_BASE_URL: ""
          VITE_USER_ROLE: viewer
          VITE_USER_NAME: github-actions
        run: npm run build

      - name: Deploy intl Pages project
        if: steps.cloudflare_config.outputs.configured == 'true'
        working-directory: 06_AppPlatform/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_SHA" \
            --commit-dirty=true

      - name: Verify intl build metadata
        if: steps.cloudflare_config.outputs.configured == 'true'
        working-directory: 06_AppPlatform/frontend
        env:
          JATO_INTL_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
        run: |
          node - <<'NODE'
          const expected = process.env.GITHUB_SHA;
          const origin = String(process.env.JATO_INTL_ORIGIN || "https://intl.ojeur.cloud").replace(/\/+$/, "");
          const deadline = Date.now() + 5 * 60 * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchCommit() {
            const response = await fetch(`${origin}/build-meta.json?ts=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) return "";
            const payload = await response.json();
            return typeof payload.commit === "string" ? payload.commit.trim() : "";
          }

          for (;;) {
            const commit = await fetchCommit().catch(() => "");
            console.log(`intl build commit: ${commit || "<unavailable>"}`);
            if (commit === expected) process.exit(0);
            if (Date.now() > deadline) {
              console.error(`intl build metadata did not reach ${expected} within the propagation window`);
              process.exit(1);
            }
            await sleep(15000);
          }
          NODE

      - name: Prewarm intl edge cache
        if: steps.cloudflare_config.outputs.configured == 'true'
        continue-on-error: true
        timeout-minutes: 8
        working-directory: 06_AppPlatform/frontend
        env:
          JATO_PREWARM_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
          JATO_PREWARM_USERNAME: ${{ secrets.JATO_PREWARM_USERNAME }}
          JATO_PREWARM_PASSWORD: ${{ secrets.JATO_PREWARM_PASSWORD }}
          JATO_PREWARM_ROLES: ${{ vars.JATO_PREWARM_ROLES || 'viewer,order_filler' }}
          JATO_PREWARM_REPETITIONS: "2"
          JATO_PREWARM_TIMEOUT_MS: "20000"
          JATO_PREWARM_FAIL_ON_ERROR: "0"
          JATO_PREWARM_COUNTRIES: ${{ vars.JATO_PREWARM_COUNTRIES || '丹麦,克罗地亚,匈牙利,奥地利,希腊,德国,意大利,挪威,捷克,斯洛伐克,斯洛文尼亚,比利时,法国,波兰,瑞典,瑞士,罗马尼亚,芬兰,荷兰,葡萄牙,西班牙' }}
          JATO_PREWARM_POWERTRAINS: ${{ vars.JATO_PREWARM_POWERTRAINS || 'ICE,HEV,BEV,MHEV,PHEV' }}
          JATO_PREWARM_GROUP_BY: ${{ vars.JATO_PREWARM_GROUP_BY || '动总规整,国家,四驱占比,Business/Private 占比' }}
        run: npm run perf:prewarm-edge
