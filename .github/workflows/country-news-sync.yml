name: country-news-sync

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      persist:
        description: "Write to database (true) or dry-run (false)"
        required: false
        default: "false"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_AppPlatform/backend/requirements.txt
          pip install -e 07_ScrapingToolkit

      - name: Country news sync dry-run
        env:
          APP_DATABASE_ENABLED: "false"
          APP_COUNTRY_NEWS_LIVE_FETCH: "false"
        run: |
          python 03_Scripts/sync_country_news_digest.py --dry-run --workers 4 --no-gemini

  persist:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.persist == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: dry-run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_AppPlatform/backend/requirements.txt
          pip install -e 07_ScrapingToolkit

      - name: Country news sync persist
        env:
          APP_DATABASE_ENABLED: "true"
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python 03_Scripts/sync_country_news_digest.py --workers 4