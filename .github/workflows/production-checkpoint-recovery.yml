name: production-checkpoint-recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect only, or apply the reviewed pre-switch abort
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: Apply only — type ABORT 2026-07-30-ce5 PRE-SWITCH
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  recovery_coordination_guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate recovery dispatch intent
        env:
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$RECOVERY_MODE" in
            dry-run)
              test -z "$RECOVERY_CONFIRMATION"
              ;;
            apply)
              test "$RECOVERY_CONFIRMATION" = \
                "ABORT 2026-07-30-ce5 PRE-SWITCH"
              ;;
            *)
              echo "::error::Unsupported checkpoint recovery mode"
              exit 1
              ;;
          esac

      - name: Validate unpublished release coordination
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          production
          --main-sha "$GITHUB_SHA"
          --plan-output "$RUNNER_TEMP/recovery-coordination-plan.json"

      - name: Freeze recovery coordination plan
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-recovery-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-coordination-plan.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 7

  recover_checkpoint:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: recovery_coordination_guard
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download frozen recovery coordination plan
        uses: actions/download-artifact@v5
        with:
          name: checkpoint-recovery-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-coordination-plan

      - name: Revalidate frozen coordination plan after approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          verify-plan
          --main-sha "$GITHUB_SHA"
          --plan
          "$RUNNER_TEMP/recovery-coordination-plan/recovery-coordination-plan.json"

      - name: Revalidate recovery dispatch intent after approval
        env:
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$RECOVERY_MODE" in
            dry-run)
              test -z "$RECOVERY_CONFIRMATION"
              ;;
            apply)
              test "$RECOVERY_CONFIRMATION" = \
                "ABORT 2026-07-30-ce5 PRE-SWITCH"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Build immutable recovery control bundle
        id: bundle
        run: |
          set -euo pipefail
          plan=".github/recovery-plans/2026-07-30-ce5-pre-switch-db-evidence.json"
          bundle_root="$RUNNER_TEMP/checkpoint-recovery-control"
          archive="$RUNNER_TEMP/checkpoint-recovery-control.tar.gz"
          rm -rf "$bundle_root" "$archive"
          mkdir -p "$bundle_root"
          required=(
            "$plan"
            03_Scripts/deploy/pre_switch_checkpoint_recovery.py
            03_Scripts/deploy/release_checkpoint.py
            03_Scripts/deploy/tencent_pre_switch_checkpoint_recovery.sh
            03_Scripts/deploy/lib/production_mutation_lock.sh
            06_AppPlatform/backend/alembic.ini
          )
          for source in "${required[@]}"; do
            test -f "$source"
            cp --parents "$source" "$bundle_root"
          done
          cp -a --parents \
            06_AppPlatform/backend/alembic/env.py \
            06_AppPlatform/backend/alembic/script.py.mako \
            06_AppPlatform/backend/alembic/versions \
            "$bundle_root"

          BUNDLE_ROOT="$bundle_root" PLAN_PATH="$plan" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["BUNDLE_ROOT"])
          files = {}
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  files[path.relative_to(root).as_posix()] = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
          plan = Path(os.environ["PLAN_PATH"])
          payload = {
              "schemaVersion": 1,
              "commit": os.environ["GITHUB_SHA"],
              "planPath": plan.as_posix(),
              "planSha256": hashlib.sha256(plan.read_bytes()).hexdigest(),
              "files": files,
          }
          (root / "recovery-control-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          tar \
            --sort=name \
            --format=gnu \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mtime='@0' \
            -C "$bundle_root" \
            -cf "$RUNNER_TEMP/checkpoint-recovery-control.tar" .
          gzip -n -f "$RUNNER_TEMP/checkpoint-recovery-control.tar"
          archive_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          plan_sha256="$(sha256sum "$plan" | awk '{print $1}')"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive-bytes=$archive_bytes" >> "$GITHUB_OUTPUT"
          echo "archive-sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "plan-sha256=$plan_sha256" >> "$GITHUB_OUTPUT"

      - name: Validate Tencent recovery credentials
        id: auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_KNOWN_HOSTS:?Missing production secret SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          known_host="$SSH_HOST"
          if [ "$SSH_PORT" != "22" ]; then
            known_host="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            echo "mode=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            exit 1
          fi

      - name: Reconfirm current main before recovery transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          verify-plan
          --main-sha "$GITHUB_SHA"
          --plan
          "$RUNNER_TEMP/recovery-coordination-plan/recovery-coordination-plan.json"

      - name: Run reviewed checkpoint recovery on Tencent
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          RECOVERY_ARCHIVE: ${{ steps.bundle.outputs.archive }}
          RECOVERY_ARCHIVE_BYTES: ${{ steps.bundle.outputs.archive-bytes }}
          RECOVERY_ARCHIVE_SHA256: ${{ steps.bundle.outputs.archive-sha256 }}
          RECOVERY_PLAN_SHA256: ${{ steps.bundle.outputs.plan-sha256 }}
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          ssh_options=(
            -T -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          missing_packages=()
          command -v rsync >/dev/null || missing_packages+=(rsync)
          if [ "$AUTH_MODE" = "password" ]; then
            command -v sshpass >/dev/null || missing_packages+=(sshpass)
          fi
          if [ "${#missing_packages[@]}" -gt 0 ]; then
            sudo apt-get update -y
            sudo apt-get install -y "${missing_packages[@]}"
          fi
          if [ "$AUTH_MODE" = "key" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
            chmod 600 ~/.ssh/github_actions_tencent_key
            ssh_command=(
              ssh -o BatchMode=yes -i ~/.ssh/github_actions_tencent_key
            )
          else
            export SSHPASS="$SSH_PASSWORD"
            ssh_command=(
              sshpass -e ssh
              -o PreferredAuthentications=password
              -o PubkeyAuthentication=no
            )
          fi
          ssh_target="$SSH_USER@$SSH_HOST"
          remote_root=".cache/jato-recovery-controls/${GITHUB_SHA}"
          remote_archive="$remote_root/${RECOVERY_ARCHIVE_SHA256}.tar.gz"
          remote_partial="${remote_archive}.partial"
          remote_lock="${remote_archive}.lock"
          printf -v rsync_rsh '%q ' "${ssh_command[@]}" "${ssh_options[@]}"
          rsync_rsh="${rsync_rsh% }"

          "${ssh_command[@]}" "${ssh_options[@]}" "$ssh_target" \
            "set -eu; umask 077; mkdir -p '$remote_root'"
          timeout 300s rsync \
            --partial \
            --append-verify \
            --timeout=120 \
            --protect-args \
            --chmod=F600 \
            -e "$rsync_rsh" \
            --rsync-path="umask 077 && exec flock -w 270 '$remote_lock' rsync" \
            "$RECOVERY_ARCHIVE" "$ssh_target:$remote_partial"

          control="$RUNNER_TEMP/checkpoint-recovery-control.sh"
          umask 077
          : > "$control"
          chmod 600 "$control"
          write_export() {
            printf 'export %s=%q\n' "$1" "$2" >> "$control"
          }
          write_export RECOVERY_ARCHIVE "$remote_archive"
          write_export RECOVERY_PARTIAL "$remote_partial"
          write_export RECOVERY_ARCHIVE_BYTES "$RECOVERY_ARCHIVE_BYTES"
          write_export RECOVERY_ARCHIVE_SHA256 "$RECOVERY_ARCHIVE_SHA256"
          write_export RECOVERY_PLAN_SHA256 "$RECOVERY_PLAN_SHA256"
          write_export RECOVERY_MODE "$RECOVERY_MODE"
          write_export RECOVERY_CONFIRMATION "$RECOVERY_CONFIRMATION"
          write_export RECOVERY_IMPLEMENTATION_COMMIT "$GITHUB_SHA"
          cat >> "$control" <<'REMOTE'
          set -Eeuo pipefail
          actual_bytes="$(wc -c < "$RECOVERY_PARTIAL" | tr -d '[:space:]')"
          actual_sha256="$(sha256sum "$RECOVERY_PARTIAL" | awk '{print $1}')"
          test "$actual_bytes" = "$RECOVERY_ARCHIVE_BYTES"
          test "$actual_sha256" = "$RECOVERY_ARCHIVE_SHA256"
          if [ -e "$RECOVERY_ARCHIVE" ]; then
            test -f "$RECOVERY_ARCHIVE"
            test ! -L "$RECOVERY_ARCHIVE"
            test "$(wc -c < "$RECOVERY_ARCHIVE" | tr -d '[:space:]')" = \
              "$RECOVERY_ARCHIVE_BYTES"
            test "$(sha256sum "$RECOVERY_ARCHIVE" | awk '{print $1}')" = \
              "$RECOVERY_ARCHIVE_SHA256"
            rm -f "$RECOVERY_PARTIAL"
          else
            ln "$RECOVERY_PARTIAL" "$RECOVERY_ARCHIVE"
            chmod 600 "$RECOVERY_ARCHIVE"
            rm -f "$RECOVERY_PARTIAL"
          fi
          worktree="$(mktemp -d "/tmp/jato-checkpoint-recovery.XXXXXX")"
          trap 'rm -rf "$worktree"' EXIT
          python3 - "$RECOVERY_ARCHIVE" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("empty recovery bundle")
              seen = set()
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  normalized = name.as_posix()
                  if (
                      name.is_absolute()
                      or ".." in name.parts
                      or normalized in seen
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit(f"unsafe recovery bundle member: {member.name}")
                  seen.add(normalized)
          PY
          tar xzf "$RECOVERY_ARCHIVE" -C "$worktree"
          python3 - "$worktree" "$RECOVERY_IMPLEMENTATION_COMMIT" \
            "$RECOVERY_PLAN_SHA256" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          commit = sys.argv[2]
          plan_sha = sys.argv[3]
          manifest = json.loads(
              (root / "recovery-control-manifest.json").read_text(encoding="utf-8")
          )
          if (
              manifest.get("schemaVersion") != 1
              or manifest.get("commit") != commit
              or manifest.get("planSha256") != plan_sha
          ):
              raise SystemExit("recovery bundle identity mismatch")
          files = manifest.get("files")
          if not isinstance(files, dict) or not files:
              raise SystemExit("recovery bundle file manifest is invalid")
          actual = {}
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "recovery-control-manifest.json":
                  actual[path.relative_to(root).as_posix()] = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
          if actual != files:
              raise SystemExit("recovery bundle file digest mismatch")
          PY
          export RECOVERY_BUNDLE_ROOT="$worktree"
          exec bash \
            "$worktree/03_Scripts/deploy/tencent_pre_switch_checkpoint_recovery.sh"
          REMOTE

          timeout 900s "${ssh_command[@]}" "${ssh_options[@]}" "$ssh_target" \
            "umask 077; exec bash -s" < "$control" \
            | tee "$RUNNER_TEMP/checkpoint-recovery-result.json"
          python3 - "$RUNNER_TEMP/checkpoint-recovery-result.json" \
            "$RECOVERY_MODE" <<'PY'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = (
              "dry-run-eligible"
              if sys.argv[2] == "dry-run"
              else "pre-switch-aborted"
          )
          if result.get("decision") not in {expected, "already-pre-switch-aborted"}:
              raise SystemExit("unexpected recovery result")
          if result.get("trafficChanged") not in {None, False}:
              raise SystemExit("recovery changed public traffic")
          PY

      - name: Upload checkpoint recovery result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-recovery-result-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint-recovery-result.json
          if-no-files-found: warn
          compression-level: 0
          overwrite: false
          retention-days: 30
