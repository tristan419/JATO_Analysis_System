name: hermes-devsync

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  devsync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Hermes dev event from commit
        run: python 03_Scripts/hermes/hermes_dev_event_generator.py

      - name: Commit updated dev_events.jsonl
        id: commit_dev_event
        run: |
          if git diff --quiet hermes/dev_events/dev_events.jsonl; then
            echo "No new dev event to commit."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            git config user.name "hermes-bot"
            git config user.email "hermes-bot@jato-analysis.local"
            git add hermes/dev_events/dev_events.jsonl
            SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-8)
            git commit -m "hermes: auto dev event from push $SHA_SHORT"
            git pull --rebase origin main
            git push origin main
            echo "dev_event_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Hermes DevSync on server
        if: always() && steps.commit_dev_event.outcome == 'success'
        run: |
          SYNC_URL="${{ secrets.HERMES_BASE_URL }}/v1/hermes/dev/sync?source=github_actions"
          echo "Calling Hermes DevSync..."

          set +e
          HTTP_CODE=$(curl -s -o /tmp/sync_resp.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 30 \
            -X POST "$SYNC_URL" \
            -H "Authorization: Bearer ${{ secrets.HERMES_SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"github_actions\",\"commitSha\":\"$GITHUB_SHA\",\"workflowRunId\":\"$GITHUB_RUN_ID\",\"workflowRunAttempt\":\"$GITHUB_RUN_ATTEMPT\",\"repository\":\"$GITHUB_REPOSITORY\",\"branch\":\"$GITHUB_REF_NAME\"}")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "DevSync curl failed with exit $CURL_EXIT (non-blocking warning)"
            cat /tmp/sync_resp.json 2>/dev/null || true
            exit 0
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            echo "DevSync succeeded:"
            python3 -c "import json; d=json.load(open('/tmp/sync_resp.json')); print(json.dumps(d, indent=2))"
          else
            echo "DevSync returned HTTP $HTTP_CODE (non-blocking warning)"
            cat /tmp/sync_resp.json 2>/dev/null || true
          fi

      - name: Setup Node for intl prewarm
        if: steps.commit_dev_event.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Wait for intl Pages Hermes commit
        if: steps.commit_dev_event.outputs.skipped == 'false'
        working-directory: 06_AppPlatform/frontend
        env:
          EXPECTED_COMMIT: ${{ steps.commit_dev_event.outputs.dev_event_sha }}
          JATO_PREWARM_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
        run: |
          node - <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const origin = String(process.env.JATO_PREWARM_ORIGIN || "https://intl.ojeur.cloud").replace(/\/+$/, "");
          const deadline = Date.now() + 5 * 60 * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchCommit() {
            const response = await fetch(`${origin}/build-meta.json?ts=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) return "";
            const payload = await response.json();
            if (typeof payload.deployCommit === "string" && payload.deployCommit.trim()) {
              return payload.deployCommit.trim();
            }
            return typeof payload.commit === "string" ? payload.commit.trim() : "";
          }

          for (;;) {
            const commit = await fetchCommit().catch(() => "");
            console.log(`intl build commit: ${commit || "<unavailable>"}`);
            if (commit === expected) process.exit(0);
            if (Date.now() > deadline) {
              console.error(`intl build metadata did not reach ${expected} within the propagation window`);
              process.exit(1);
            }
            await sleep(15000);
          }
          NODE

      - name: Prewarm intl edge after Hermes commit
        if: steps.commit_dev_event.outputs.skipped == 'false'
        working-directory: 06_AppPlatform/frontend
        env:
          JATO_PREWARM_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
          JATO_PREWARM_ROLES: "viewer,order_filler,editor,admin"
          JATO_PREWARM_REPETITIONS: "2"
          JATO_PREWARM_TIMEOUT_MS: "120000"
          JATO_PREWARM_FAIL_ON_ERROR: "1"
        run: npm run perf:prewarm-edge
