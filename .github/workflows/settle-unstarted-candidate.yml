name: settle-unstarted-candidate

on:
  workflow_dispatch:
    inputs:
      confirm_settlement:
        description: I confirm the exact reviewed unstarted Candidate may be settled
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SETTLEMENT_PLAN: .github/recovery-plans/2026-08-04-aa1d-unstarted-candidate.json

    steps:
      - name: Checkout settlement control plane
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate exact reviewed settlement request
        env:
          CONFIRM_SETTLEMENT: ${{ inputs.confirm_settlement }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRM_SETTLEMENT" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          python3 -m py_compile .github/scripts/settle_unstarted_candidate.py
          python3 - "$SETTLEMENT_PLAN" <<'PY'
          import json
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          identity = plan["identity"]
          expected = {
              "repository": "tristan419/JATO_Analysis_System",
              "commit": "aa1d424b284497497973dd2e57dc6059b3d1ab8b",
              "archiveSha256": (
                  "cea83f12e6cb7b088ab5b0516ab08d379943714d7977682ff98f30ecc0943799"
              ),
              "runId": 30905118347,
              "runAttempt": 1,
          }
          for key, value in expected.items():
              if identity.get(key) != value:
                  raise SystemExit(f"settlement plan identity mismatch for {key}")
          if plan.get("incidentId") != "2026-08-04-aa1d-procfs-boot-id-preimage":
              raise SystemExit("settlement incident identity mismatch")
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/30905118347" \
            > "$RUNNER_TEMP/failed-prepare-run.json"
          python3 - "$RUNNER_TEMP/failed-prepare-run.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "head_branch": "main",
              "head_sha": "aa1d424b284497497973dd2e57dc6059b3d1ab8b",
              "status": "completed",
              "conclusion": "failure",
              "run_attempt": 1,
              "path": ".github/workflows/production-release.yml",
          }
          mismatches = {
              key: {"expected": value, "actual": run.get(key)}
              for key, value in expected.items()
              if str(run.get(key) or "").split("@", 1)[0] != str(value)
          }
          if mismatches:
              raise SystemExit(
                  "failed prepare run identity mismatch: "
                  + json.dumps(mismatches, sort_keys=True)
              )
          PY

      - name: Download exact failed Candidate evidence
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-aa1d424b284497497973dd2e57dc6059b3d1ab8b-1
          path: ${{ runner.temp }}/failed-candidate
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: 30905118347

      - name: Verify failure evidence against reviewed plan
        run: |
          set -euo pipefail
          python3 - "$SETTLEMENT_PLAN" "$RUNNER_TEMP/failed-candidate" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          root = Path(sys.argv[2])
          checkpoint = root / "server/backend-healthy.json"
          evidence = root / "server/backend-healthy.evidence.json"
          preview = root / "server/candidate-preview.json"
          status = json.loads(
              (root / "server/fetch-status.json").read_text(encoding="utf-8")
          )
          for path, field in (
              (checkpoint, "checkpointSha256"),
              (evidence, "evidenceSha256"),
          ):
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != plan[field]:
                  raise SystemExit(f"failed Candidate {field} mismatch")
          payload = json.loads(checkpoint.read_text(encoding="utf-8"))
          if (
              payload.get("phase") != "migrated"
              or payload.get("status") != "completed"
              or payload.get("retryClass") != "automatic"
              or payload.get("identity") != plan["identity"]
          ):
              raise SystemExit("failed Candidate checkpoint contract mismatch")
          if preview.read_bytes() != b"":
              raise SystemExit("failed Candidate unexpectedly produced preview metadata")
          if status != {
              "backendHealthyAttested": False,
              "exitCode": 7,
              "schemaVersion": 1,
          }:
              raise SystemExit("failed Candidate fetch status changed")
          PY

      - name: Validate Tencent settlement credentials
        id: auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          known_host="$SSH_HOST"
          if [ "$SSH_PORT" != "22" ]; then
            known_host="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            echo "mode=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            exit 1
          fi

      - name: Capture Active identity before settlement
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/settlement-evidence"
          install -d -m 700 "$evidence"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            https://www.ojeur.cloud/healthz > "$evidence/before-healthz.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            https://www.ojeur.cloud/release-provenance.json \
            > "$evidence/before-provenance.json"

      - name: Settle exact unstarted Candidate on Tencent
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          SETTLEMENT_OUTPUT: ${{ runner.temp }}/settlement-evidence/result.json
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          bash .github/scripts/github_settle_unstarted_candidate.sh

      - name: Verify Active remained unchanged
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/settlement-evidence"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            https://www.ojeur.cloud/healthz > "$evidence/after-healthz.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            https://www.ojeur.cloud/release-provenance.json \
            > "$evidence/after-provenance.json"
          cmp "$evidence/before-healthz.json" "$evidence/after-healthz.json"
          cmp "$evidence/before-provenance.json" "$evidence/after-provenance.json"
          python3 - "$evidence/result.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result.get("active", {}).get("commit") != (
              "cd4557cb932374a0fefb6c80a5fac9fb75a67d62"
          ):
              raise SystemExit("Active commit differs after settlement")
          PY

      - name: Upload immutable settlement receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unstarted-candidate-settlement-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/settlement-evidence
          if-no-files-found: error
          retention-days: 30
