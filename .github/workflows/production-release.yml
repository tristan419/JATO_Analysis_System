name: production-release

on:
  push:
    branches: ["main"]
    paths:
      - "06_AppPlatform/**"
      - "07_ScrapingToolkit/**"
      - "03_Scripts/**"
      - "hermes/**"
      - "!hermes/dev_events/**"
      - "01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
      - ".nvmrc"
      - ".github/scripts/production_release_hold.py"
      - ".github/recovery-plans/2026-08-03-29df-pre-switch-candidate-residue.json"
      - ".github/recovery-plans/2026-08-03-29df-pre-switch-candidate-residue-production-hold.v1.json"
      - ".github/recovery-plans/2026-08-03-29df-pre-switch-candidate-residue-production-hold-retirement.v1.json"
      - ".github/workflows/production-release.yml"
  workflow_dispatch:
    inputs:
      release_mode:
        description: Prepare, approve, discard, or release one exact reviewed Candidate
        required: true
        type: choice
        default: prepare-candidate
        options:
          - prepare-candidate
          - approve-candidate-to-active
          - discard-candidate
          - release-candidate
      candidate_prepare_run_id:
        description: Exact successful prepare-candidate workflow run id (approval only)
        required: false
        type: string
      candidate_prepare_run_attempt:
        description: Exact successful prepare-candidate run attempt (approval only)
        required: false
        type: string
      candidate_commit_sha:
        description: Exact reviewed 40-character Candidate main SHA (approval only)
        required: false
        type: string
      candidate_archive_sha256:
        description: Exact reviewed Candidate archive SHA-256 (approval only)
        required: false
        type: string
      candidate_attestation_sha256:
        description: Exact reviewed server attestation SHA-256 (approval only)
        required: false
        type: string
      confirm_www_activation:
        description: I confirm this exact Candidate may replace www Active
        required: true
        type: boolean
        default: false
      confirm_candidate_cleanup:
        description: I confirm the exact reviewed Candidate may be cleaned up
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: production-release-main
  cancel-in-progress: false

env:
  FRONTEND_NODE_VERSION: "20.19.0"
  WRANGLER_VERSION: "4.86.0"
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || 'prepare-candidate' }}

jobs:
  release_coordination_guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-action: ${{ steps.production_hold.outputs.release-action }}

    steps:
      - name: Checkout release coordination guard
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate unpublished release coordination
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          production
          --main-sha "$GITHUB_SHA"
          --plan-output "$RUNNER_TEMP/release-coordination-plan.json"

      - name: Resolve reviewed production release hold
        id: production_hold
        run: >-
          python3 .github/scripts/production_release_hold.py
          resolve
          --github-output "$GITHUB_OUTPUT"

      - name: Freeze release coordination plan
        uses: actions/upload-artifact@v4
        with:
          name: release-coordination-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-coordination-plan.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 7

  build_frontend:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      needs.release_coordination_guard.outputs.release-action == 'deploy' &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.release_mode == 'prepare-candidate') }}
    needs: release_coordination_guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact-name }}
      artifact_identity: ${{ steps.release.outputs.artifact-identity }}
      artifact_checksum: ${{ steps.release.outputs.artifact-checksum }}
      github_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      github_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      frontend_build_id: ${{ steps.release.outputs.frontend-build-id }}
      node_version: ${{ steps.release.outputs.node-version }}
      app_commit: ${{ steps.release.outputs.app-commit }}
      release_id: ${{ steps.release_metadata.outputs.release-id }}
      workflow_run_attempt: ${{ steps.release_metadata.outputs.workflow-run-attempt }}
      build_timestamp: ${{ steps.release_metadata.outputs.build-timestamp }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Setup fixed frontend Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: 06_AppPlatform/frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: 06_AppPlatform/frontend
        run: npm ci

      - name: Build production frontend once
        working-directory: 06_AppPlatform/frontend
        env:
          CF_PAGES: "1"
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          VITE_API_BASE: /v1
          VITE_ASSET_BASE_URL: ""
          VITE_USER_ROLE: viewer
          VITE_USER_NAME: github-actions
        run: npm run build

      - name: Create immutable frontend release
        id: release
        env:
          ARTIFACT_NAME: frontend-dist-${{ github.sha }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/frontend-release"
          rm -rf "$release_dir"
          python3 03_Scripts/deploy/frontend_release_artifact.py create \
            --dist-dir 06_AppPlatform/frontend/dist \
            --functions-dir 06_AppPlatform/frontend/functions \
            --release-dir "$release_dir" \
            --github-sha "$GITHUB_SHA" \
            --artifact-name "$ARTIFACT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Read immutable frontend release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "frontend-release/frontend-release.json")
              .read_text(encoding="utf-8")
          )
          release = manifest.get("release")
          if not isinstance(release, dict):
              raise SystemExit("frontend release manifest is missing release metadata")
          values = {
              "release-id": release.get("releaseId"),
              "workflow-run-attempt": release.get("workflowRunAttempt"),
              "build-timestamp": release.get("buildTimestamp"),
          }
          for name, value in values.items():
              if not isinstance(value, str) or not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"invalid release metadata field: {name}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Upload the only frontend artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: ${{ runner.temp }}/frontend-release
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

      - name: Validate strict build outputs
        env:
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact-name }}
          ARTIFACT_IDENTITY: ${{ steps.release.outputs.artifact-identity }}
          ARTIFACT_CHECKSUM: ${{ steps.release.outputs.artifact-checksum }}
          GITHUB_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          GITHUB_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          FRONTEND_BUILD_ID: ${{ steps.release.outputs.frontend-build-id }}
          NODE_VERSION: ${{ steps.release.outputs.node-version }}
          APP_COMMIT: ${{ steps.release.outputs.app-commit }}
          RELEASE_ID: ${{ steps.release_metadata.outputs.release-id }}
          BUILD_RUN_ATTEMPT: ${{ steps.release_metadata.outputs.workflow-run-attempt }}
          BUILD_TIMESTAMP: ${{ steps.release_metadata.outputs.build-timestamp }}
        run: |
          set -euo pipefail
          expected_name="frontend-dist-$GITHUB_SHA"
          test "$ARTIFACT_NAME" = "$expected_name"
          test -n "$ARTIFACT_IDENTITY"
          [[ "$ARTIFACT_CHECKSUM" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_BUILD_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$NODE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APP_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_ID" = "$GITHUB_RUN_ID-$BUILD_RUN_ATTEMPT"
          [[ "$BUILD_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test -n "$BUILD_TIMESTAMP"

  deploy_tencent:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      needs.release_coordination_guard.outputs.release-action == 'deploy' &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.release_mode == 'prepare-candidate') }}
    needs: [release_coordination_guard, build_frontend]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download frozen release coordination plan
        uses: actions/download-artifact@v5
        with:
          name: release-coordination-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-coordination-plan

      - name: Revalidate frozen coordination plan after approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          verify-plan
          --main-sha "$GITHUB_SHA"
          --plan "$RUNNER_TEMP/release-coordination-plan/release-coordination-plan.json"

      - name: Setup fixed Cloudflare Node
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}

      - name: Download immutable frontend artifact by id
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build_frontend.outputs.github_artifact_id }}
          path: ${{ runner.temp }}/frontend-release

      - name: Verify frontend artifact before Tencent deployment
        env:
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          ARTIFACT_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          ARTIFACT_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
        run: |
          set -euo pipefail
          python3 03_Scripts/deploy/frontend_release_artifact.py verify \
            --release-dir "$RUNNER_TEMP/frontend-release" \
            --expected-github-sha "$GITHUB_SHA" \
            --expected-artifact-name "$ARTIFACT_NAME" \
            --expected-artifact-identity "$ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$ARTIFACT_CHECKSUM" \
            --expected-build-id "$FRONTEND_BUILD_ID" \
            --expected-node-version "$NODE_VERSION" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$BUILD_RUN_ATTEMPT" \
            --github-artifact-id "$GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$GITHUB_ARTIFACT_DIGEST" \
            --materialize-dir "$RUNNER_TEMP/frontend-dist" \
            --materialize-functions-dir "$RUNNER_TEMP/cloudflare-pages-project/functions"

      - name: Validate Tencent deploy credentials
        id: auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_KNOWN_HOSTS:?Missing production secret SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          known_host="$SSH_HOST"
          if [ "$SSH_PORT" != "22" ]; then
            known_host="[$SSH_HOST]:$SSH_PORT"
          fi
          if ! ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::SSH_KNOWN_HOSTS does not pin the configured Tencent host and port"
            exit 1
          fi
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            echo "mode=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            exit 1
          fi

      - name: Validate Cloudflare deploy configuration
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        working-directory: ${{ runner.temp }}/cloudflare-pages-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_PAGES_PROJECT_NAME:?Missing CLOUDFLARE_PAGES_PROJECT_NAME}"
          worker_bundle="$RUNNER_TEMP/cloudflare-pages-worker.js"
          routes_manifest="$RUNNER_TEMP/cloudflare-pages-routes.json"
          npx --yes "wrangler@$WRANGLER_VERSION" pages functions build functions \
            --project-directory . \
            --outfile "$worker_bundle" \
            --output-routes-path "$routes_manifest"
          test -s "$worker_bundle"
          test -s "$routes_manifest"
          python3 - "$routes_manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          routes = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          included = set(routes.get("include", []))
          required = {"/healthz", "/oauth-relay/*", "/v1/*"}
          missing = sorted(required - included)
          if missing:
              raise SystemExit(f"Missing Cloudflare Pages Function routes: {missing}")
          print(f"Validated Cloudflare Pages Function routes: {sorted(required)}")
          PY

      - name: Package backend release with verified frontend artifact
        env:
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          ARTIFACT_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          ARTIFACT_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
          APP_COMMIT: ${{ needs.build_frontend.outputs.app_commit }}
          RELEASE_ID: ${{ needs.build_frontend.outputs.release_id }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          BUILD_TIMESTAMP: ${{ needs.build_frontend.outputs.build_timestamp }}
        run: |
          set -euo pipefail
          required_workbook="01_RAW_DATA/VOC_Nordic_SUV_Users_100.xlsx"
          if [ ! -f "$required_workbook" ]; then
            echo "::error::Missing required workbook: $required_workbook"
            exit 1
          fi
          msrp_pack="03_Scripts/diagnostics/artifacts/msrp_backfill/sweden_swiss_top30_suv"
          msrp_candidates="$msrp_pack/top30_suv_price_movement_candidates.json"
          msrp_evidence="$msrp_pack/official_evidence_leads.json"
          for required_file in "$msrp_candidates" "$msrp_evidence"; do
            if [ ! -f "$required_file" ]; then
              echo "::error::Missing required MSRP monitor pack file: $required_file"
              exit 1
            fi
          done

          rm -rf hermes/frontend_release
          mkdir -p hermes/frontend_release
          cp "$RUNNER_TEMP/frontend-release/frontend-dist.tar.gz" hermes/frontend_release/
          cp "$RUNNER_TEMP/frontend-release/frontend-release.json" hermes/frontend_release/

          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          manifest = json.loads(
              (root / "hermes/frontend_release/frontend-release.json").read_text(encoding="utf-8")
          )
          release = manifest.get("release")
          if not isinstance(release, dict):
              raise SystemExit("frontend release manifest is missing release metadata")
          expected_release = {
              "releaseId": os.environ["RELEASE_ID"],
              "workflowRunAttempt": os.environ["BUILD_RUN_ATTEMPT"],
              "buildTimestamp": os.environ["BUILD_TIMESTAMP"],
          }
          for key, expected in expected_release.items():
              if release.get(key) != expected:
                  raise SystemExit(
                      f"frontend release metadata mismatch for {key}: "
                      f"{release.get(key)!r} != {expected!r}"
                  )
          timestamp = str(release["buildTimestamp"])
          parsed_timestamp = dt.datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
          if parsed_timestamp.tzinfo is None:
              raise SystemExit("frontend buildTimestamp must include a timezone")
          (Path(os.environ["RUNNER_TEMP"]) / "release-source-date-epoch").write_text(
              f"{int(parsed_timestamp.timestamp())}\n",
              encoding="utf-8",
          )
          frontend_release = dict(manifest)
          frontend_release["artifact"] = dict(frontend_release["artifact"])
          frontend_release["artifact"]["githubId"] = os.environ["GITHUB_ARTIFACT_ID"]
          digest = os.environ["GITHUB_ARTIFACT_DIGEST"]
          frontend_release["artifact"]["githubDigest"] = (
              digest if digest.startswith("sha256:") else f"sha256:{digest}"
          )
          sha = os.environ["GITHUB_SHA"]
          payload = {
              "releaseId": release["releaseId"],
              "service": "jato-fullstack-backend",
              "environment": "production",
              "expectedCommitSha": sha,
              "expectedShortSha": sha[:8],
              "actualCommitSha": "",
              "actualShortSha": "",
              "commitSha": "",
              "shortSha": "",
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "repository": release["repository"],
              "workflow": release["workflow"],
              "workflowRunId": release["workflowRunId"],
              "workflowRunAttempt": release["workflowRunAttempt"],
              "deployMethod": "github_actions",
              "packagedAt": release["buildTimestamp"],
              "source": "github_actions_archive",
              "frontendRelease": frontend_release,
          }
          out = root / "hermes/deploy_release.json"
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          msrp_local_paths_file="$RUNNER_TEMP/msrp-local-paths.bin"
          MSRP_CANDIDATES="$msrp_candidates" \
          MSRP_EVIDENCE="$msrp_evidence" \
          MSRP_LOCAL_PATHS_FILE="$msrp_local_paths_file" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          referenced: set[str] = set()

          def collect_local_paths(value: object) -> None:
              if isinstance(value, dict):
                  local_path = value.get("localPath")
                  if local_path is not None:
                      if not isinstance(local_path, str) or not local_path:
                          raise SystemExit("MSRP localPath must be a non-empty string")
                      referenced.add(local_path)
                  for child in value.values():
                      collect_local_paths(child)
              elif isinstance(value, list):
                  for child in value:
                      collect_local_paths(child)

          for env_name in ("MSRP_CANDIDATES", "MSRP_EVIDENCE"):
              source = root / os.environ[env_name]
              collect_local_paths(json.loads(source.read_text(encoding="utf-8")))

          safe_paths: list[str] = []
          for local_path in sorted(referenced):
              pure = PurePosixPath(local_path)
              if pure.is_absolute() or ".." in pure.parts:
                  raise SystemExit(f"unsafe MSRP localPath: {local_path!r}")
              source = root.joinpath(*pure.parts)
              if not source.is_file():
                  raise SystemExit(f"missing MSRP localPath evidence: {local_path}")
              if source.resolve() != source.absolute():
                  raise SystemExit(f"MSRP localPath may not traverse symlinks: {local_path}")
              safe_paths.append(pure.as_posix())

          output = Path(os.environ["MSRP_LOCAL_PATHS_FILE"])
          output.write_bytes(b"".join(path.encode("utf-8") + b"\0" for path in safe_paths))
          print(f"Validated {len(safe_paths)} unique MSRP localPath evidence files")
          PY

          source_date_epoch="$(tr -d '[:space:]' < "$RUNNER_TEMP/release-source-date-epoch")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          tar_common=(
            --sort=name
            --format=gnu
            --owner=0
            --group=0
            --numeric-owner
            --mtime="@$source_date_epoch"
            --no-acls
            --no-xattrs
            --no-selinux
          )
          tar_normalize=("${tar_common[@]}" --mode='u=rwX,go=rX')
          tar_private_normalize=("${tar_common[@]}" --mode='u=rwX,go=X')
          tar "${tar_normalize[@]}" -cf "$RUNNER_TEMP/JATO_deploy.tar" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='.claude' \
            --exclude='tmp' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='01_RAW_DATA' \
            --exclude='04_Processed_data' \
            --exclude='06_AppPlatform/backend/*.parquet' \
            --exclude='*.ipynb' \
            --exclude='03_Scripts/diagnostics/artifacts' \
            --exclude='03_Scripts/probe_results' \
            --exclude='data_wangler' \
            --exclude='Markdown_Readme' \
            -C "$GITHUB_WORKSPACE" .
          mapfile -d '' -t msrp_local_paths < "$msrp_local_paths_file"
          private_dirs_file="$RUNNER_TEMP/release-private-dirs.bin"
          private_files_file="$RUNNER_TEMP/release-private-files.bin"
          REQUIRED_WORKBOOK="$required_workbook" \
          MSRP_PACK="$msrp_pack" \
          MSRP_LOCAL_PATHS_FILE="$msrp_local_paths_file" \
          PRIVATE_DIRS_FILE="$private_dirs_file" \
          PRIVATE_FILES_FILE="$private_files_file" \
          python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          workbook = PurePosixPath(os.environ["REQUIRED_WORKBOOK"])
          pack = PurePosixPath(os.environ["MSRP_PACK"])
          private_prefixes = (
              PurePosixPath("01_RAW_DATA"),
              PurePosixPath("03_Scripts/diagnostics/artifacts"),
          )
          local_paths = [
              PurePosixPath(raw.decode("utf-8"))
              for raw in Path(os.environ["MSRP_LOCAL_PATHS_FILE"])
              .read_bytes()
              .split(b"\0")
              if raw
          ]
          files = {workbook, *local_paths}
          pack_path = root.joinpath(*pack.parts)
          for candidate in pack_path.rglob("*"):
              relative = PurePosixPath(candidate.relative_to(root).as_posix())
              if candidate.is_symlink():
                  raise SystemExit(
                      f"private release path may not be a symlink: {relative}"
                  )
              if candidate.is_file():
                  files.add(relative)
              elif not candidate.is_dir():
                  raise SystemExit(
                      f"private release path has unsupported type: {relative}"
                  )
          directories: set[PurePosixPath] = set()
          for relative in sorted(files, key=str):
              source = root.joinpath(*relative.parts)
              if (
                  not source.is_file()
                  or source.is_symlink()
                  or source.resolve() != source.absolute()
              ):
                  raise SystemExit(
                      f"private release file is missing or unsafe: {relative}"
                  )
              prefix = next(
                  (
                      candidate
                      for candidate in private_prefixes
                      if relative == candidate
                      or candidate in relative.parents
                  ),
                  None,
              )
              if prefix is None:
                  raise SystemExit(
                      f"private release file escaped reviewed prefixes: {relative}"
                  )
              cursor = relative.parent
              while cursor != PurePosixPath("."):
                  if cursor == prefix or prefix in cursor.parents:
                      directories.add(cursor)
                  if cursor == prefix:
                      break
                  cursor = cursor.parent
          for relative in directories:
              source = root.joinpath(*relative.parts)
              if (
                  not source.is_dir()
                  or source.is_symlink()
                  or source.resolve() != source.absolute()
              ):
                  raise SystemExit(
                      f"private release directory is missing or unsafe: {relative}"
                  )
          Path(os.environ["PRIVATE_DIRS_FILE"]).write_bytes(
              b"".join(
                  str(path).encode("utf-8") + b"\0"
                  for path in sorted(directories, key=str)
              )
          )
          Path(os.environ["PRIVATE_FILES_FILE"]).write_bytes(
              b"".join(
                  str(path).encode("utf-8") + b"\0"
                  for path in sorted(files, key=str)
              )
          )
          PY
          mapfile -d '' -t private_dirs < "$private_dirs_file"
          mapfile -d '' -t private_files < "$private_files_file"
          tar "${tar_private_normalize[@]}" --no-recursion \
            -rf "$RUNNER_TEMP/JATO_deploy.tar" \
            -C "$GITHUB_WORKSPACE" "${private_dirs[@]}"
          tar "${tar_private_normalize[@]}" \
            -rf "$RUNNER_TEMP/JATO_deploy.tar" \
            -C "$GITHUB_WORKSPACE" "${private_files[@]}"
          gzip -n -f "$RUNNER_TEMP/JATO_deploy.tar"
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" ./hermes/frontend_release/frontend-release.json
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" ./hermes/frontend_release/frontend-dist.tar.gz
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" "$required_workbook"
          tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" "$msrp_candidates" "$msrp_evidence"
          for evidence_path in "${msrp_local_paths[@]}"; do
            tar tzf "$RUNNER_TEMP/JATO_deploy.tar.gz" "$evidence_path"
          done

      - name: Upload complete release archive without fallback
        id: upload_release
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          archive="$RUNNER_TEMP/JATO_deploy.tar.gz"
          archive_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          remote_dir=".cache/jato-releases/archives/${GITHUB_SHA}"
          remote_archive="${remote_dir}/${archive_sha256}.tar.gz"
          remote_temp="${remote_archive}.partial"
          remote_checksum="${remote_archive}.sha256"
          remote_lock="${remote_archive}.lock"

          ssh_options=(
            -T -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=18
            -o IPQoS=none
          )
          missing_packages=()
          command -v rsync >/dev/null || missing_packages+=(rsync)
          if [ "$AUTH_MODE" = "password" ]; then
            command -v sshpass >/dev/null || missing_packages+=(sshpass)
          fi
          if [ "${#missing_packages[@]}" -gt 0 ]; then
            sudo apt-get update -y
            sudo apt-get install -y "${missing_packages[@]}"
          fi
          if [ "$AUTH_MODE" = "key" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
            chmod 600 ~/.ssh/github_actions_tencent_key
            ssh_command=(ssh -o BatchMode=yes -i ~/.ssh/github_actions_tencent_key)
          else
            command -v sshpass >/dev/null
            export SSHPASS="$SSH_PASSWORD"
            ssh_command=(sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no)
          fi
          test -s "$HOME/.ssh/known_hosts"

          ssh_target="$SSH_USER@$SSH_HOST"
          run_remote() {
            local remote_command="$1"
            local remote_attempt
            local remote_output
            for remote_attempt in 1 2 3; do
              if remote_output="$(
                timeout 360s "${ssh_command[@]}" "${ssh_options[@]}" \
                  "$ssh_target" "$remote_command"
              )"; then
                printf '%s' "$remote_output"
                return 0
              fi
              echo "::warning::Remote command attempt ${remote_attempt}/3 failed" >&2
              sleep $((remote_attempt * 5))
            done
            return 1
          }

          require_rsync_3() {
            local version="$1"
            local major="${version%%.*}"
            local remainder="${version#*.}"
            local minor="${remainder%%.*}"
            case "$major:$minor" in
              *[!0-9:]*|:*) return 1 ;;
            esac
            [ "$major" -gt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -ge 0 ]; }
          }

          local_rsync_version="$(rsync --version | awk 'NR == 1 {print $3}')"
          if ! require_rsync_3 "$local_rsync_version"; then
            echo "::error::Local rsync >= 3.0 is required; found $local_rsync_version"
            exit 1
          fi
          remote_rsync_version="$(
            run_remote \
              "set -eu; \
               command -v flock >/dev/null; \
               command -v sha256sum >/dev/null; \
               command -v rsync >/dev/null; \
               rsync --version | awk 'NR == 1 {print \$3}'"
          )"
          if ! require_rsync_3 "$remote_rsync_version"; then
            echo "::error::Remote rsync >= 3.0 is required; found $remote_rsync_version"
            exit 1
          fi

          run_remote \
            "set -eu; \
             umask 077; \
             install -d -m 700 '.cache' '.cache/jato-releases' \
               '.cache/jato-releases/archives' '$remote_dir'; \
             test ! -L '$remote_dir'"

          inspect_remote_state() {
            run_remote \
              "set -eu; \
               umask 077; \
               exec 9>'$remote_lock'; \
               flock -w 300 9; \
               if [ -e '$remote_archive' ]; then \
                 if [ ! -f '$remote_archive' ] || [ -L '$remote_archive' ]; then \
                   printf 'FINAL_BAD|not-a-regular-file'; exit 0; \
                 fi; \
                 final_size=\$(wc -c < '$remote_archive' | tr -d '[:space:]'); \
                 final_sha=\$(sha256sum '$remote_archive' | awk '{print \$1}'); \
                 if [ \"\$final_size\" = '$archive_bytes' ] && [ \"\$final_sha\" = '$archive_sha256' ]; then \
                   rm -f '$remote_temp' '$remote_checksum'; \
                   printf 'REUSE|%s|%s' \"\$final_size\" \"\$final_sha\"; \
                 else \
                   printf 'FINAL_BAD|%s|%s' \"\$final_size\" \"\$final_sha\"; \
                 fi; \
                 exit 0; \
               fi; \
               saved_sha=''; \
               if [ -f '$remote_checksum' ]; then saved_sha=\$(cat '$remote_checksum'); fi; \
               if [ -e '$remote_temp' ]; then \
                 if [ ! -f '$remote_temp' ] || [ -L '$remote_temp' ]; then \
                   printf 'PARTIAL_BAD|not-a-regular-file'; exit 0; \
                 fi; \
                 partial_size=\$(wc -c < '$remote_temp' | tr -d '[:space:]'); \
                 if [ \"\$saved_sha\" != '$archive_sha256' ] || [ \"\$partial_size\" -gt '$archive_bytes' ]; then \
                   printf 'PARTIAL_BAD|%s|%s' \"\$partial_size\" \"\$saved_sha\"; exit 0; \
                 fi; \
                 if [ \"\$partial_size\" -eq '$archive_bytes' ]; then \
                   partial_sha=\$(sha256sum '$remote_temp' | awk '{print \$1}'); \
                   if [ \"\$partial_sha\" != '$archive_sha256' ]; then \
                     printf 'PARTIAL_BAD|%s|%s' \"\$partial_size\" \"\$partial_sha\"; exit 0; \
                   fi; \
                 fi; \
               else \
                 if [ -n \"\$saved_sha\" ] && [ \"\$saved_sha\" != '$archive_sha256' ]; then \
                   printf 'PARTIAL_BAD|missing|%s' \"\$saved_sha\"; exit 0; \
                 fi; \
                 : > '$remote_temp'; \
                 partial_size=0; \
               fi; \
               printf '%s\n' '$archive_sha256' > '$remote_checksum'; \
               available_kib=\$(df -Pk '$remote_dir' | awk 'NR == 2 {print \$4}'); \
               case \"\$available_kib\" in ''|*[!0-9]*) printf 'DISK_BAD|%s' \"\$available_kib\"; exit 0;; esac; \
               available_bytes=\$((available_kib * 1024)); \
               expected_bytes='$archive_bytes'; \
               required_bytes=\$((expected_bytes - partial_size + 67108864)); \
               if [ \"\$available_bytes\" -lt \"\$required_bytes\" ]; then \
                 printf 'NO_SPACE|%s|%s' \"\$available_bytes\" \"\$required_bytes\"; exit 0; \
               fi; \
               printf 'READY|%s|%s' \"\$partial_size\" \"\$available_bytes\""
          }

          partial_reset_used=0
          reset_bad_partial() {
            if [ "$partial_reset_used" -ne 0 ]; then
              echo "::error::Remote partial archive remained invalid after its one allowed reset"
              return 1
            fi
            run_remote \
              "set -eu; \
               umask 077; \
               exec 9>'$remote_lock'; \
               flock -w 300 9; \
               test ! -e '$remote_archive'; \
               rm -f '$remote_temp' '$remote_checksum'; \
               : > '$remote_temp'; \
               printf '%s\n' '$archive_sha256' > '$remote_checksum'"
            partial_reset_used=1
            echo "::warning::Cleared one invalid remote partial; the next transfer is a full verified upload"
          }

          printf -v rsync_rsh '%q ' "${ssh_command[@]}" "${ssh_options[@]}"
          rsync_rsh="${rsync_rsh% }"
          upload_complete=0
          for transfer_cycle in 1 2; do
            remote_state="$(inspect_remote_state)"
            state_kind="${remote_state%%|*}"
            case "$state_kind" in
              REUSE)
                upload_complete=1
                echo "Reusing verified immutable remote archive"
                break
                ;;
              PARTIAL_BAD)
                reset_bad_partial
                remote_state="$(inspect_remote_state)"
                state_kind="${remote_state%%|*}"
                ;;
              FINAL_BAD)
                echo "::error::Remote immutable archive exists but size or SHA-256 is wrong: $remote_state"
                exit 1
                ;;
              NO_SPACE)
                echo "::error::Insufficient remote disk space for resumable release upload: $remote_state"
                exit 1
                ;;
              DISK_BAD)
                echo "::error::Could not determine remote disk capacity: $remote_state"
                exit 1
                ;;
            esac
            if [ "$state_kind" != "READY" ]; then
              echo "::error::Unexpected remote upload state: $remote_state"
              exit 1
            fi

            upload_succeeded=0
            for upload_attempt in 1 2 3 4 5 6; do
              echo "Rsync append-verify attempt ${upload_attempt}/6 (${remote_state#READY|})"
              if timeout 900s rsync \
                --partial \
                --append-verify \
                --timeout=300 \
                --protect-args \
                --chmod=F600 \
                -e "$rsync_rsh" \
                --rsync-path="umask 077 && exec flock -w 870 '$remote_lock' rsync" \
                "$archive" "$ssh_target:$remote_temp"; then
                upload_succeeded=1
                break
              fi
              echo "::warning::Rsync attempt ${upload_attempt}/6 disconnected; retained partial will resume"
              sleep $((upload_attempt * 5))
            done
            if [ "$upload_succeeded" -ne 1 ]; then
              echo "::error::Rsync exhausted six resumable transfer attempts"
              exit 1
            fi

            finalize_state="$(
              run_remote \
                "set -eu; \
                 umask 077; \
                 exec 9>'$remote_lock'; \
                 flock -w 300 9; \
                 if [ -e '$remote_archive' ]; then \
                   if [ ! -f '$remote_archive' ] || [ -L '$remote_archive' ]; then \
                     printf 'FINAL_BAD|not-a-regular-file'; exit 0; \
                   fi; \
                   final_size=\$(wc -c < '$remote_archive' | tr -d '[:space:]'); \
                   final_sha=\$(sha256sum '$remote_archive' | awk '{print \$1}'); \
                   if [ \"\$final_size\" = '$archive_bytes' ] && [ \"\$final_sha\" = '$archive_sha256' ]; then \
                     rm -f '$remote_temp' '$remote_checksum'; \
                     printf 'REUSE|%s|%s' \"\$final_size\" \"\$final_sha\"; \
                   else \
                     printf 'FINAL_BAD|%s|%s' \"\$final_size\" \"\$final_sha\"; \
                   fi; \
                   exit 0; \
                 fi; \
                 partial_size=\$(wc -c < '$remote_temp' | tr -d '[:space:]'); \
                 partial_sha=\$(sha256sum '$remote_temp' | awk '{print \$1}'); \
                 if [ \"\$partial_size\" != '$archive_bytes' ] || [ \"\$partial_sha\" != '$archive_sha256' ]; then \
                   printf 'PARTIAL_BAD|%s|%s' \"\$partial_size\" \"\$partial_sha\"; exit 0; \
                 fi; \
                 test ! -e '$remote_archive'; \
                 ln '$remote_temp' '$remote_archive'; \
                 chmod 600 '$remote_archive'; \
                 rm -f '$remote_temp' '$remote_checksum'; \
                 printf 'SEALED|%s|%s' \"\$partial_size\" \"\$partial_sha\""
            )"
            case "${finalize_state%%|*}" in
              SEALED|REUSE)
                upload_complete=1
                break
                ;;
              PARTIAL_BAD)
                reset_bad_partial
                ;;
              FINAL_BAD)
                echo "::error::Remote immutable archive failed closed: $finalize_state"
                exit 1
                ;;
              *)
                echo "::error::Unexpected remote finalization state: $finalize_state"
                exit 1
                ;;
            esac
          done
          if [ "$upload_complete" -ne 1 ]; then
            echo "::error::Remote archive was not sealed after the allowed full retransmit"
            exit 1
          fi

          echo "remote-archive=$remote_archive" >> "$GITHUB_OUTPUT"
          echo "archive-bytes=$archive_bytes" >> "$GITHUB_OUTPUT"
          echo "archive-sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Tencent release transport"
            echo "- Remote path: \`$remote_archive\`"
            echo "- Bytes: \`$archive_bytes\`"
            echo "- SHA-256: \`$archive_sha256\`"
            echo "- Rsync: local \`$local_rsync_version\`, remote \`$remote_rsync_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record transport-verified candidate checkpoint
        env:
          ARCHIVE_BYTES: ${{ steps.upload_release.outputs.archive-bytes }}
          ARCHIVE_SHA256: ${{ steps.upload_release.outputs.archive-sha256 }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          FRONTEND_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          FRONTEND_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
        run: |
          set -euo pipefail
          checkpoint_dir="$RUNNER_TEMP/release-checkpoint"
          install -d -m 700 "$checkpoint_dir"
          python3 03_Scripts/deploy/release_checkpoint.py write \
            --checkpoint "$checkpoint_dir/candidate.json" \
            --journal "$checkpoint_dir/journal.jsonl" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --archive-bytes "$ARCHIVE_BYTES" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$BUILD_RUN_ATTEMPT" \
            --frontend-identity "$FRONTEND_IDENTITY" \
            --frontend-checksum "$FRONTEND_CHECKSUM" \
            --phase transport_verified \
            --status completed \
            --retry-class inspect_then_resume \
            --message "Immutable SSH archive size and SHA-256 verified on Tencent"

      - name: Reconfirm current main before first production mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          verify-plan
          --main-sha "$GITHUB_SHA"
          --plan "$RUNNER_TEMP/release-coordination-plan/release-coordination-plan.json"

      - name: Deploy verified release on Tencent
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          DEPLOY_ARCHIVE_PATH: ${{ steps.upload_release.outputs.remote-archive }}
          DEPLOY_ARCHIVE_BYTES: ${{ steps.upload_release.outputs.archive-bytes }}
          DEPLOY_ARCHIVE_SHA256: ${{ steps.upload_release.outputs.archive-sha256 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HERMES_SYNC_TOKEN: ${{ secrets.HERMES_SYNC_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_PROXY_URL: ${{ secrets.GOOGLE_OAUTH_PROXY_URL }}
          GOOGLE_OAUTH_RELAY_URL: ${{ secrets.GOOGLE_OAUTH_RELAY_URL }}
          GOOGLE_OAUTH_RELAY_TOKEN: ${{ secrets.GOOGLE_OAUTH_RELAY_TOKEN }}
          MIHOMO_SUB_URL: ${{ secrets.MIHOMO_SUB_URL }}
          MIHOMO_DB_PATH: ${{ vars.MIHOMO_DB_PATH }}
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          ARTIFACT_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          ARTIFACT_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
          RELEASE_ID: ${{ needs.build_frontend.outputs.release_id }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          DEPLOY_SERVER_NAME="${DEPLOY_SERVER_NAME:-ojeur.cloud www.ojeur.cloud}"
          DEPLOY_ENABLE_HTTPS="${DEPLOY_ENABLE_HTTPS:-true}"
          deploy_short_sha="${GITHUB_SHA:0:8}"

          ssh_options=(
            -T -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          if [ "$AUTH_MODE" = "key" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
            chmod 600 ~/.ssh/github_actions_tencent_key
            ssh_command=(ssh -o BatchMode=yes -i ~/.ssh/github_actions_tencent_key)
          else
            command -v sshpass >/dev/null
            export SSHPASS="$SSH_PASSWORD"
            ssh_command=(sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no)
          fi

          control_payload="$RUNNER_TEMP/tencent-release-control.sh"
          archive_validator="03_Scripts/deploy/validate_release_archive.py"
          archive_validator_sha256="$(sha256sum "$archive_validator" | awk '{print $1}')"
          archive_validator_b64="$(base64 -w 0 "$archive_validator")"
          umask 077
          : > "$control_payload"
          chmod 600 "$control_payload"
          trap 'rm -f "$control_payload"' EXIT
          write_remote_export() {
            local name="$1"
            local value="$2"
            printf 'export %s=%q\n' "$name" "$value" >> "$control_payload"
          }
          write_remote_export DEPLOY_SERVER_NAME "$DEPLOY_SERVER_NAME"
          write_remote_export DEPLOY_ENABLE_HTTPS "$DEPLOY_ENABLE_HTTPS"
          write_remote_export DEPLOY_CERTBOT_EMAIL "${DEPLOY_CERTBOT_EMAIL:-}"
          # export DEPLOY_BRANCH=main is carried inside the private stdin payload.
          write_remote_export DEPLOY_BRANCH main
          write_remote_export DEPLOY_BLUEGREEN_MODE "$RELEASE_MODE"
          write_remote_export DEPLOY_COMMIT_SHA "$GITHUB_SHA"
          write_remote_export DEPLOY_SHORT_SHA "$deploy_short_sha"
          write_remote_export DEPLOY_RELEASE_ID "$RELEASE_ID"
          write_remote_export DEPLOY_RUN_ID "$GITHUB_RUN_ID"
          write_remote_export DEPLOY_RUN_ATTEMPT "$BUILD_RUN_ATTEMPT"
          write_remote_export DEPLOY_ARCHIVE_PATH "$DEPLOY_ARCHIVE_PATH"
          write_remote_export DEPLOY_ARCHIVE_BYTES "$DEPLOY_ARCHIVE_BYTES"
          write_remote_export DEPLOY_ARCHIVE_SHA256 "$DEPLOY_ARCHIVE_SHA256"
          write_remote_export RELEASE_ARCHIVE_VALIDATOR_B64 "$archive_validator_b64"
          write_remote_export RELEASE_ARCHIVE_VALIDATOR_SHA256 \
            "$archive_validator_sha256"
          write_remote_export DEPLOY_REPOSITORY "$GITHUB_REPOSITORY"
          write_remote_export DEPLOY_WORKFLOW "$GITHUB_WORKFLOW"
          write_remote_export FRONTEND_ARTIFACT_NAME "$ARTIFACT_NAME"
          write_remote_export FRONTEND_ARTIFACT_IDENTITY "$ARTIFACT_IDENTITY"
          write_remote_export FRONTEND_ARTIFACT_CHECKSUM "$ARTIFACT_CHECKSUM"
          write_remote_export FRONTEND_GITHUB_ARTIFACT_ID "$GITHUB_ARTIFACT_ID"
          write_remote_export FRONTEND_GITHUB_ARTIFACT_DIGEST "$GITHUB_ARTIFACT_DIGEST"
          write_remote_export FRONTEND_BUILD_ID "$FRONTEND_BUILD_ID"
          write_remote_export FRONTEND_NODE_VERSION "$NODE_VERSION"
          for secret_name in DEEPSEEK_API_KEY HERMES_SYNC_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_OAUTH_PROXY_URL GOOGLE_OAUTH_RELAY_URL GOOGLE_OAUTH_RELAY_TOKEN MIHOMO_SUB_URL MIHOMO_DB_PATH; do
            write_remote_export "$secret_name" "${!secret_name:-}"
          done
          cat 03_Scripts/deploy/fullstack_remote_release.sh >> "$control_payload"

          timeout 5400s "${ssh_command[@]}" "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "umask 077; exec bash -s" < "$control_payload"

      - name: Fetch and attest server release checkpoint
        if: ${{ always() && steps.upload_release.outcome == 'success' }}
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          REMOTE_ARCHIVE_PATH: ${{ steps.upload_release.outputs.remote-archive }}
          ARCHIVE_BYTES: ${{ steps.upload_release.outputs.archive-bytes }}
          ARCHIVE_SHA256: ${{ steps.upload_release.outputs.archive-sha256 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          RELEASE_ID: ${{ needs.build_frontend.outputs.release_id }}
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          FRONTEND_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          FRONTEND_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          ssh_options=(
            -T -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          if [ "$AUTH_MODE" = "key" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_tencent_key
            chmod 600 ~/.ssh/github_actions_tencent_key
            ssh_command=(ssh -o BatchMode=yes -i ~/.ssh/github_actions_tencent_key)
          else
            command -v sshpass >/dev/null
            export SSHPASS="$SSH_PASSWORD"
            ssh_command=(sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no)
          fi
          command -v rsync >/dev/null
          test -s "$HOME/.ssh/known_hosts"
          ssh_target="$SSH_USER@$SSH_HOST"
          server_dir="$RUNNER_TEMP/release-checkpoint/server"
          install -d -m 700 "$server_dir"
          attestation_complete=false
          record_checkpoint_fetch_exit() {
            local rc="$?"
            trap - EXIT
            python3 - "$server_dir/fetch-status.json" "$rc" \
              "$attestation_complete" <<'PY' || true
          import json
          from pathlib import Path
          import sys

          output, exit_code, attested = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "exitCode": int(exit_code),
                      "backendHealthyAttested": attested == "true",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
            exit "$rc"
          }
          trap record_checkpoint_fetch_exit EXIT

          remote_home="$(
            timeout 60s "${ssh_command[@]}" "${ssh_options[@]}" "$ssh_target" \
              'set -eu; printf "%s" "$HOME"'
          )"
          case "$remote_home" in
            /*) remote_home="${remote_home%/}" ;;
            *) echo "::error::Tencent SSH returned an invalid home directory"; exit 1 ;;
          esac
          remote_state_dir=".local/state/jato-production-release/checkpoints/${GITHUB_SHA}"
          remote_checkpoint="${remote_state_dir}/${ARCHIVE_SHA256}.json"
          remote_evidence="${remote_state_dir}/${ARCHIVE_SHA256}.evidence.json"
          preview_metadata="$server_dir/candidate-preview.json"
          printf -v rsync_rsh '%q ' "${ssh_command[@]}" "${ssh_options[@]}"
          rsync_rsh="${rsync_rsh% }"
          timeout 120s rsync --links --times --protect-args --chmod=F600 \
            --no-owner --no-group -e "$rsync_rsh" \
            "$ssh_target:$remote_checkpoint" "$server_dir/backend-healthy.json"
          timeout 120s rsync --links --times --protect-args --chmod=F600 \
            --no-owner --no-group -e "$rsync_rsh" \
            "$ssh_target:$remote_evidence" "$server_dir/backend-healthy.evidence.json"
          if [ "$RELEASE_MODE" = "prepare-candidate" ]; then
            timeout 60s "${ssh_command[@]}" "${ssh_options[@]}" "$ssh_target" \
              "curl --noproxy '*' --fail --silent --show-error --max-time 20 \
                http://127.0.0.1:18002/candidate-preview.json" \
              > "$preview_metadata"
          else
            printf '{}\n' > "$preview_metadata"
          fi

          python3 03_Scripts/deploy/release_checkpoint.py show \
            --checkpoint "$server_dir/backend-healthy.json" >/dev/null
          python3 - \
            "$server_dir/backend-healthy.json" \
            "$server_dir/backend-healthy.evidence.json" \
            "$server_dir/attestation.json" \
            "$remote_home/$remote_evidence" \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$ARCHIVE_SHA256" "$ARCHIVE_BYTES" \
            "$GITHUB_RUN_ID" "$BUILD_RUN_ATTEMPT" "$FRONTEND_IDENTITY" \
            "$FRONTEND_CHECKSUM" "$RELEASE_ID" "$RELEASE_MODE" \
            "$preview_metadata" "$REMOTE_ARCHIVE_PATH" "$ARTIFACT_NAME" \
            "$GITHUB_ARTIFACT_ID" "$GITHUB_ARTIFACT_DIGEST" \
            "$FRONTEND_BUILD_ID" "$NODE_VERSION" "$GITHUB_WORKFLOW" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import stat
          import sys

          (
              checkpoint_name,
              evidence_name,
              attestation_name,
              remote_evidence_path,
              repository,
              commit,
              archive_sha256,
              archive_bytes,
              run_id,
              run_attempt,
              frontend_identity,
              frontend_checksum,
              release_id,
              release_mode,
              preview_metadata_name,
              remote_archive_path,
              artifact_name,
              github_artifact_id,
              github_artifact_digest,
              frontend_build_id,
              node_version,
              workflow_name,
          ) = sys.argv[1:]

          def read_private_json(name: str, label: str) -> tuple[dict[str, object], bytes]:
              path = Path(name)
              mode = path.lstat().st_mode
              if not stat.S_ISREG(mode) or path.is_symlink():
                  raise SystemExit(f"{label} must be a regular non-symlink file")
              raw = path.read_bytes()
              if not raw or len(raw) > 1_048_576:
                  raise SystemExit(f"{label} has an invalid size")
              payload = json.loads(raw.decode("utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit(f"{label} root must be an object")
              return payload, raw

          checkpoint, checkpoint_raw = read_private_json(
              checkpoint_name,
              "server checkpoint",
          )
          evidence, evidence_raw = read_private_json(
              evidence_name,
              "server evidence",
          )
          expected_identity = {
              "repository": repository,
              "commit": commit,
              "archiveSha256": archive_sha256,
              "archiveBytes": int(archive_bytes),
              "runId": int(run_id),
              "runAttempt": int(run_attempt),
              "frontendIdentity": frontend_identity,
              "frontendChecksum": frontend_checksum,
          }
          if checkpoint.get("identity") != expected_identity:
              raise SystemExit("server checkpoint identity mismatch")
          expected_remote_archive = (
              f".cache/jato-releases/archives/{commit}/{archive_sha256}.tar.gz"
          )
          if remote_archive_path != expected_remote_archive:
              raise SystemExit("server archive path identity mismatch")
          if artifact_name != f"frontend-dist-{commit}":
              raise SystemExit("frontend artifact name identity mismatch")
          if re.fullmatch(r"[1-9][0-9]*", github_artifact_id) is None:
              raise SystemExit("frontend GitHub artifact id is invalid")
          if re.fullmatch(
              r"(?:sha256:)?[0-9a-f]{64}",
              github_artifact_digest,
          ) is None:
              raise SystemExit("frontend GitHub artifact digest is invalid")
          if re.fullmatch(r"[0-9a-f]{64}", frontend_build_id) is None:
              raise SystemExit("frontend build id is invalid")
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", node_version) is None:
              raise SystemExit("frontend Node version is invalid")
          if workflow_name != "production-release":
              raise SystemExit("Candidate source workflow identity mismatch")
          expected_phase = (
              "candidate_ready"
              if release_mode == "prepare-candidate"
              else "backend_healthy"
          )
          expected_retry_class = (
              "inspect_then_resume"
              if release_mode == "prepare-candidate"
              else "automatic"
          )
          if (
              checkpoint.get("phase") != expected_phase
              or checkpoint.get("status") != "completed"
          ):
              raise SystemExit(
                  f"server checkpoint is not {expected_phase}/completed"
              )
          if checkpoint.get("retryClass") != expected_retry_class:
              raise SystemExit("server checkpoint has an unexpected retry class")

          evidence_sha256 = hashlib.sha256(evidence_raw).hexdigest()
          message = checkpoint.get("message")
          if not isinstance(message, str):
              raise SystemExit("server checkpoint does not bind release evidence")
          binding = re.search(
              r"(?:^|[; ])evidence_path=(\S+) evidence_sha256=([0-9a-f]{64})(?:$|[; ])",
              message,
          )
          if (
              binding is None
              or binding.group(1) != remote_evidence_path
              or binding.group(2) != evidence_sha256
          ):
              raise SystemExit("server checkpoint evidence binding mismatch")
          if evidence.get("identity") != expected_identity:
              raise SystemExit("server evidence identity mismatch")

          backup = evidence.get("backup")
          if not isinstance(backup, dict):
              raise SystemExit("server evidence is missing backup metadata")
          manifest_path = backup.get("manifestPath")
          manifest_bytes = backup.get("manifestBytes")
          manifest_sha256 = backup.get("manifestSha256")
          if (
              not isinstance(manifest_path, str)
              or not manifest_path.startswith("/")
              or not isinstance(manifest_bytes, int)
              or manifest_bytes <= 0
              or not isinstance(manifest_sha256, str)
              or re.fullmatch(r"[0-9a-f]{64}", manifest_sha256) is None
          ):
              raise SystemExit("server evidence backup manifest identity is incomplete")
          migration = evidence.get("migration")
          if not isinstance(migration, dict) or migration.get("status") not in {
              "completed",
              "not_required",
          }:
              raise SystemExit("server evidence migration outcome is not final")

          preview = None
          if release_mode == "prepare-candidate":
              preview, _ = read_private_json(
                  preview_metadata_name,
                  "Candidate preview metadata",
              )
              if (
                  preview.get("role") != "candidate"
                  or preview.get("commitSha") != commit
                  or preview.get("archiveSha256") != archive_sha256
                  or preview.get("candidateSlot") not in {8000, 8001}
                  or preview.get("previewPort") != 18002
              ):
                  raise SystemExit("Candidate preview metadata identity mismatch")

          attestation = {
              "schemaVersion": 1,
              "releaseId": release_id,
              "releaseMode": release_mode,
              "identity": expected_identity,
              "approvalHandoff": {
                  "workflow": workflow_name,
                  "remoteArchivePath": remote_archive_path,
                  "frontendArtifactName": artifact_name,
                  "frontendGithubArtifactId": int(github_artifact_id),
                  "frontendGithubArtifactDigest": github_artifact_digest,
                  "frontendBuildId": frontend_build_id,
                  "frontendNodeVersion": node_version,
              },
              "serverCheckpoint": {
                  "remotePath": remote_evidence_path.removesuffix(".evidence.json") + ".json",
                  "sha256": hashlib.sha256(checkpoint_raw).hexdigest(),
                  "phase": expected_phase,
                  "status": "completed",
              },
              "serverEvidence": {
                  "remotePath": remote_evidence_path,
                  "sha256": evidence_sha256,
                  "backupManifestBytes": manifest_bytes,
                  "backupManifestSha256": manifest_sha256,
                  "migrationStatus": migration["status"],
              },
          }
          if preview is not None:
              attestation["candidatePreview"] = preview
          output = Path(attestation_name)
          output.write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          output.chmod(0o600)
          PY
          attestation_sha256="$(sha256sum "$server_dir/attestation.json" | awk '{print $1}')"
          # Keep the digest in the immutable artifact. GitHub can suppress a
          # cross-job output when its secret scanner finds a coincidental match.
          echo "Server checkpoint/evidence attestation SHA-256: $attestation_sha256"
          # Continue the runner-side lifecycle from the attested server state.
          # This prevents a synthetic transport_verified -> www_verified jump.
          install -m 600 \
            "$server_dir/backend-healthy.json" \
            "$RUNNER_TEMP/release-checkpoint/candidate.json"
          if [ "$RELEASE_MODE" = "prepare-candidate" ]; then
            {
              echo "## Candidate ready for manual review"
              echo
              echo "- Commit: \`$GITHUB_SHA\`"
              echo "- Prepare run id: \`$GITHUB_RUN_ID\`"
              echo "- Prepare run attempt: \`$BUILD_RUN_ATTEMPT\`"
              echo "- Archive SHA-256: \`$ARCHIVE_SHA256\`"
              echo "- Attestation SHA-256: \`$attestation_sha256\`"
              echo "- Server origin: \`127.0.0.1:18002\` (loopback only)"
              echo "- Local link after SSH forwarding: http://127.0.0.1:18002"
              echo "- Active www and its background workers were not switched."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          attestation_complete=true

      - name: Verify Tencent public release provenance
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        env:
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          ARTIFACT_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          ARTIFACT_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          PUBLIC_ORIGINS: ${{ vars.DEPLOY_PUBLIC_BUILD_META_URLS || 'https://www.ojeur.cloud https://ojeur.cloud' }}
        run: |
          set -euo pipefail
          origin_args=()
          for origin in $PUBLIC_ORIGINS; do
            origin_args+=(--origin "$origin")
          done
          python3 03_Scripts/deploy/frontend_release_artifact.py audit-public \
            --release-dir "$RUNNER_TEMP/frontend-release" \
            --expected-github-sha "$GITHUB_SHA" \
            --expected-artifact-name "$ARTIFACT_NAME" \
            --expected-artifact-identity "$ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$ARTIFACT_CHECKSUM" \
            --expected-build-id "$FRONTEND_BUILD_ID" \
            --expected-node-version "$NODE_VERSION" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$BUILD_RUN_ATTEMPT" \
            --github-artifact-id "$GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$GITHUB_ARTIFACT_DIGEST" \
            --attempts 24 \
            --delay-seconds 10 \
            "${origin_args[@]}"

      - name: Verify www runtime API contract
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        env:
          PUBLIC_ORIGINS: ${{ vars.DEPLOY_PUBLIC_BUILD_META_URLS || 'https://www.ojeur.cloud https://ojeur.cloud' }}
        run: |
          set -euo pipefail
          for origin in $PUBLIC_ORIGINS; do
            python3 03_Scripts/deploy/verify_intl_runtime_contract.py \
              --profile www \
              --origin "$origin" \
              --attempts 24 \
              --delay-seconds 10 \
              --timeout-seconds 20
          done

      - name: Record www-verified candidate checkpoint
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        env:
          ARCHIVE_BYTES: ${{ steps.upload_release.outputs.archive-bytes }}
          ARCHIVE_SHA256: ${{ steps.upload_release.outputs.archive-sha256 }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          FRONTEND_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          FRONTEND_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
        run: |
          set -euo pipefail
          python3 03_Scripts/deploy/release_checkpoint.py write \
            --checkpoint "$RUNNER_TEMP/release-checkpoint/candidate.json" \
            --journal "$RUNNER_TEMP/release-checkpoint/journal.jsonl" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --archive-bytes "$ARCHIVE_BYTES" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$BUILD_RUN_ATTEMPT" \
            --frontend-identity "$FRONTEND_IDENTITY" \
            --frontend-checksum "$FRONTEND_CHECKSUM" \
            --phase www_verified \
            --status completed \
            --retry-class automatic

      - name: Check whether intl already serves the immutable release
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        id: intl_current
        env:
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          ARTIFACT_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          ARTIFACT_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          JATO_INTL_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
        run: |
          set -euo pipefail
          if python3 03_Scripts/deploy/frontend_release_artifact.py audit-public \
            --release-dir "$RUNNER_TEMP/frontend-release" \
            --expected-github-sha "$GITHUB_SHA" \
            --expected-artifact-name "$ARTIFACT_NAME" \
            --expected-artifact-identity "$ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$ARTIFACT_CHECKSUM" \
            --expected-build-id "$FRONTEND_BUILD_ID" \
            --expected-node-version "$NODE_VERSION" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$BUILD_RUN_ATTEMPT" \
            --github-artifact-id "$GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$GITHUB_ARTIFACT_DIGEST" \
            --origin "$JATO_INTL_ORIGIN" \
            --attempts 1 \
            --delay-seconds 0; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Intl already serves the exact immutable release; deployment will be skipped"
            exit 0
          fi

          provenance="$RUNNER_TEMP/intl-current-provenance.json"
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "$provenance" --write-out '%{http_code}' \
            "$JATO_INTL_ORIGIN/release-provenance.json?release_probe=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")"
          if [ "$status" != "200" ]; then
            echo "::error::Intl provenance probe was ambiguous (HTTP $status); refusing to redeploy"
            exit 1
          fi
          current_sha="$(python3 - "$provenance" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          source = payload.get("source")
          if not isinstance(source, dict):
              raise SystemExit("intl provenance is missing source metadata")
          sha = source.get("githubSha")
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit("intl provenance has an invalid githubSha")
          print(sha)
          PY
          )"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo "::error::Intl serves the target SHA with conflicting artifact provenance; refusing to redeploy"
            exit 1
          fi
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "Intl currently serves $current_sha; target deployment is required"

      - name: Record intl deployment ambiguity boundary
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        env:
          ARCHIVE_BYTES: ${{ steps.upload_release.outputs.archive-bytes }}
          ARCHIVE_SHA256: ${{ steps.upload_release.outputs.archive-sha256 }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          FRONTEND_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          FRONTEND_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
        run: |
          set -euo pipefail
          python3 03_Scripts/deploy/release_checkpoint.py write \
            --checkpoint "$RUNNER_TEMP/release-checkpoint/candidate.json" \
            --journal "$RUNNER_TEMP/release-checkpoint/journal.jsonl" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --archive-bytes "$ARCHIVE_BYTES" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$BUILD_RUN_ATTEMPT" \
            --frontend-identity "$FRONTEND_IDENTITY" \
            --frontend-checksum "$FRONTEND_CHECKSUM" \
            --phase intl_deploy_started \
            --status in_progress \
            --retry-class inspect_then_resume \
            --message "Inspect public intl provenance before retrying an interrupted deploy"

      - name: Deploy downloaded dist to Cloudflare Pages
        if: >-
          ${{ env.RELEASE_MODE == 'prepare-and-switch' &&
          steps.intl_current.outputs.current != 'true' }}
        working-directory: ${{ runner.temp }}/cloudflare-pages-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          for deploy_attempt in 1 2 3; do
            if npx --yes "wrangler@$WRANGLER_VERSION" pages deploy "$RUNNER_TEMP/frontend-dist" \
              --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
              --branch "$GITHUB_REF_NAME" \
              --commit-hash "$GITHUB_SHA" \
              --commit-message "$GITHUB_SHA" \
              --commit-dirty=true; then
              exit 0
            fi
            if [ "$deploy_attempt" -eq 3 ]; then
              echo "::error::Cloudflare deployment failed after three bounded attempts"
              exit 1
            fi
            sleep $((deploy_attempt * 10))
          done

      - name: Verify intl public release provenance
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        env:
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          ARTIFACT_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          ARTIFACT_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          JATO_INTL_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
        run: |
          set -euo pipefail
          python3 03_Scripts/deploy/frontend_release_artifact.py audit-public \
            --release-dir "$RUNNER_TEMP/frontend-release" \
            --expected-github-sha "$GITHUB_SHA" \
            --expected-artifact-name "$ARTIFACT_NAME" \
            --expected-artifact-identity "$ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$ARTIFACT_CHECKSUM" \
            --expected-build-id "$FRONTEND_BUILD_ID" \
            --expected-node-version "$NODE_VERSION" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$BUILD_RUN_ATTEMPT" \
            --github-artifact-id "$GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$GITHUB_ARTIFACT_DIGEST" \
            --origin "$JATO_INTL_ORIGIN" \
            --attempts 24 \
            --delay-seconds 10

      - name: Verify intl API routing contract
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        env:
          JATO_INTL_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
        run: |
          set -euo pipefail
          python3 03_Scripts/deploy/verify_intl_runtime_contract.py \
            --origin "$JATO_INTL_ORIGIN" \
            --attempts 24 \
            --delay-seconds 10 \
            --timeout-seconds 20

      - name: Record intl-verified candidate checkpoint
        if: ${{ env.RELEASE_MODE == 'prepare-and-switch' }}
        env:
          ARCHIVE_BYTES: ${{ steps.upload_release.outputs.archive-bytes }}
          ARCHIVE_SHA256: ${{ steps.upload_release.outputs.archive-sha256 }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          FRONTEND_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          FRONTEND_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
        run: |
          set -euo pipefail
          python3 03_Scripts/deploy/release_checkpoint.py write \
            --checkpoint "$RUNNER_TEMP/release-checkpoint/candidate.json" \
            --journal "$RUNNER_TEMP/release-checkpoint/journal.jsonl" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --archive-bytes "$ARCHIVE_BYTES" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$BUILD_RUN_ATTEMPT" \
            --frontend-identity "$FRONTEND_IDENTITY" \
            --frontend-checksum "$FRONTEND_CHECKSUM" \
            --phase intl_verified \
            --status completed \
            --retry-class automatic

      - name: Retain candidate release checkpoint
        if: ${{ always() && steps.upload_release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-checkpoint
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

  approve_candidate_to_active:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_mode == 'approve-candidate-to-active' &&
      needs.release_coordination_guard.outputs.release-action == 'deploy' }}
    needs: release_coordination_guard
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout approval source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download frozen release coordination plan
        uses: actions/download-artifact@v5
        with:
          name: release-coordination-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-coordination-plan

      - name: Revalidate frozen coordination plan after approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          verify-plan
          --main-sha "$GITHUB_SHA"
          --plan "$RUNNER_TEMP/release-coordination-plan/release-coordination-plan.json"

      - name: Validate exact Candidate approval request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_prepare_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_prepare_run_attempt }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          CANDIDATE_ATTESTATION_SHA256: ${{ inputs.candidate_attestation_sha256 }}
          CONFIRM_WWW_ACTIVATION: ${{ inputs.confirm_www_activation }}
        run: |
          set -euo pipefail
          test "$CONFIRM_WWW_ACTIVATION" = "true" || {
            echo "::error::confirm_www_activation must be explicitly checked"
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CANDIDATE_COMMIT_SHA" = "$GITHUB_SHA" || {
            echo "::error::Reviewed Candidate SHA is not current main; prepare a new Candidate"
            exit 1
          }

          request_dir="$RUNNER_TEMP/candidate-approval"
          install -d -m 700 "$request_dir"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            > "$request_dir/prepare-run.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
            > "$request_dir/prepare-artifacts.json"
          python3 - \
            "$request_dir/prepare-run.json" \
            "$CANDIDATE_RUN_ATTEMPT" "$CANDIDATE_COMMIT_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          attempt = int(sys.argv[2])
          commit = sys.argv[3]
          workflow_path = str(run.get("path") or "").split("@", maxsplit=1)[0]
          expected = {
              "head_branch": "main",
              "head_sha": commit,
              "status": "completed",
              "conclusion": "success",
              "run_attempt": attempt,
          }
          mismatches = {
              key: {"expected": value, "actual": run.get(key)}
              for key, value in expected.items()
              if run.get(key) != value
          }
          if workflow_path != ".github/workflows/production-release.yml":
              mismatches["path"] = {
                  "expected": ".github/workflows/production-release.yml",
                  "actual": workflow_path,
              }
          if run.get("event") not in {"push", "workflow_dispatch"}:
              mismatches["event"] = {
                  "expected": "push or workflow_dispatch",
                  "actual": run.get("event"),
              }
          if mismatches:
              raise SystemExit(
                  "prepare-candidate run identity/status mismatch: "
                  + json.dumps(mismatches, sort_keys=True)
              )
          PY

      - name: Download exact Candidate handoff artifact
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-${{ inputs.candidate_commit_sha }}-${{ inputs.candidate_prepare_run_attempt }}
          path: ${{ runner.temp }}/candidate-approval/release-candidate
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_prepare_run_id }}

      - name: Download exact reviewed frontend artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist-${{ inputs.candidate_commit_sha }}
          path: ${{ runner.temp }}/candidate-approval/frontend-release
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_prepare_run_id }}

      - name: Verify immutable Candidate handoff
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_prepare_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_prepare_run_attempt }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          CANDIDATE_ATTESTATION_SHA256: ${{ inputs.candidate_attestation_sha256 }}
        run: |
          set -euo pipefail
          request_dir="$RUNNER_TEMP/candidate-approval"
          python3 03_Scripts/deploy/verify_candidate_handoff.py \
            --checkpoint "$request_dir/release-candidate/candidate.json" \
            --attestation "$request_dir/release-candidate/server/attestation.json" \
            --artifacts "$request_dir/prepare-artifacts.json" \
            --env-output "$request_dir/verified.env" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT_SHA" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --attestation-sha256 "$CANDIDATE_ATTESTATION_SHA256"
          source "$request_dir/verified.env"
          python3 03_Scripts/deploy/frontend_release_artifact.py verify \
            --release-dir "$request_dir/frontend-release" \
            --expected-github-sha "$CANDIDATE_COMMIT_SHA" \
            --expected-artifact-name "$CANDIDATE_FRONTEND_ARTIFACT_NAME" \
            --expected-artifact-identity "$CANDIDATE_FRONTEND_ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$CANDIDATE_FRONTEND_ARTIFACT_CHECKSUM" \
            --expected-build-id "$CANDIDATE_FRONTEND_BUILD_ID" \
            --expected-node-version "$CANDIDATE_FRONTEND_NODE_VERSION" \
            --expected-run-id "$CANDIDATE_RUN_ID" \
            --expected-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --github-artifact-id "$CANDIDATE_GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$CANDIDATE_GITHUB_ARTIFACT_DIGEST"

      - name: Validate Tencent approval credentials
        id: approval_auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_KNOWN_HOSTS:?Missing production secret SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          known_host="$SSH_HOST"
          if [ "$SSH_PORT" != "22" ]; then
            known_host="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::SSH_KNOWN_HOSTS does not pin the Tencent host and port"
            exit 1
          }
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            echo "mode=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            exit 1
          fi

      - name: Revalidate frozen coordination plan immediately before Active mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          verify-plan
          --main-sha "$GITHUB_SHA"
          --plan "$RUNNER_TEMP/release-coordination-plan/release-coordination-plan.json"

      - name: Approve exact Candidate on Tencent
        id: approve_active
        env:
          AUTH_MODE: ${{ steps.approval_auth.outputs.mode }}
          CANDIDATE_VERIFIED_ENV: ${{ runner.temp }}/candidate-approval/verified.env
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HERMES_SYNC_TOKEN: ${{ secrets.HERMES_SYNC_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_PROXY_URL: ${{ secrets.GOOGLE_OAUTH_PROXY_URL }}
          GOOGLE_OAUTH_RELAY_URL: ${{ secrets.GOOGLE_OAUTH_RELAY_URL }}
          GOOGLE_OAUTH_RELAY_TOKEN: ${{ secrets.GOOGLE_OAUTH_RELAY_TOKEN }}
          MIHOMO_SUB_URL: ${{ secrets.MIHOMO_SUB_URL }}
          MIHOMO_DB_PATH: ${{ vars.MIHOMO_DB_PATH }}
        run: |
          set -euo pipefail
          bash 03_Scripts/deploy/github_candidate_control.sh approve-candidate-to-active

      - name: Record failed approval restore boundary
        if: ${{ failure() && steps.approve_active.outcome == 'failure' }}
        run: |
          {
            echo "## Candidate approval failed"
            echo
            echo "- The workflow remains failed; no success receipt is emitted."
            echo "- The controller enforces automatic restore previous successful Active."
            echo "- The previous Active is the server's current Active release identity,"
            echo "  not the most recent green GitHub Actions run."
            echo "- www verification was not completed; intl was not touched."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Verify www serves the exact approved Candidate
        id: verify_www
        continue-on-error: true
        env:
          PUBLIC_ORIGINS: ${{ vars.DEPLOY_PUBLIC_BUILD_META_URLS || 'https://www.ojeur.cloud https://ojeur.cloud' }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/candidate-approval/verified.env"
          origin_args=()
          for origin in $PUBLIC_ORIGINS; do
            origin_args+=(--origin "$origin")
          done
          python3 03_Scripts/deploy/frontend_release_artifact.py audit-public \
            --release-dir "$RUNNER_TEMP/candidate-approval/frontend-release" \
            --expected-github-sha "$CANDIDATE_COMMIT_SHA" \
            --expected-artifact-name "$CANDIDATE_FRONTEND_ARTIFACT_NAME" \
            --expected-artifact-identity "$CANDIDATE_FRONTEND_ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$CANDIDATE_FRONTEND_ARTIFACT_CHECKSUM" \
            --expected-build-id "$CANDIDATE_FRONTEND_BUILD_ID" \
            --expected-node-version "$CANDIDATE_FRONTEND_NODE_VERSION" \
            --expected-run-id "$CANDIDATE_RUN_ID" \
            --expected-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --github-artifact-id "$CANDIDATE_GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$CANDIDATE_GITHUB_ARTIFACT_DIGEST" \
            --attempts 24 \
            --delay-seconds 10 \
            "${origin_args[@]}"
          for origin in $PUBLIC_ORIGINS; do
            python3 03_Scripts/deploy/verify_intl_runtime_contract.py \
              --profile www \
              --origin "$origin" \
              --attempts 24 \
              --delay-seconds 10 \
              --timeout-seconds 20
          done

      - name: Restore previous Active after failed www audit
        id: restore_previous_active
        if: ${{ steps.verify_www.outcome == 'failure' }}
        env:
          AUTH_MODE: ${{ steps.approval_auth.outputs.mode }}
          CANDIDATE_VERIFIED_ENV: ${{ runner.temp }}/candidate-approval/verified.env
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HERMES_SYNC_TOKEN: ${{ secrets.HERMES_SYNC_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_PROXY_URL: ${{ secrets.GOOGLE_OAUTH_PROXY_URL }}
          GOOGLE_OAUTH_RELAY_URL: ${{ secrets.GOOGLE_OAUTH_RELAY_URL }}
          GOOGLE_OAUTH_RELAY_TOKEN: ${{ secrets.GOOGLE_OAUTH_RELAY_TOKEN }}
          MIHOMO_SUB_URL: ${{ secrets.MIHOMO_SUB_URL }}
          MIHOMO_DB_PATH: ${{ vars.MIHOMO_DB_PATH }}
        run: |
          set -euo pipefail
          bash 03_Scripts/deploy/github_candidate_control.sh restore-previous-active
          {
            echo "## www audit rejected the approved Candidate"
            echo
            echo "- Automatic restore previous successful Active completed."
            echo "- No approval success receipt was emitted."
            echo "- intl was not touched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep failed www audit red after automatic restore
        if: >-
          ${{ steps.verify_www.outcome == 'failure' &&
          steps.restore_previous_active.outcome == 'success' }}
        run: |
          echo "::error::www audit failed; previous successful Active was restored"
          exit 1

      - name: Fetch and attest Active update checkpoint
        if: ${{ steps.verify_www.outcome == 'success' }}
        env:
          AUTH_MODE: ${{ steps.approval_auth.outputs.mode }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/candidate-approval/verified.env"
          SSH_PORT="${SSH_PORT:-22}"
          ssh_options=(
            -T -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          if [ "$AUTH_MODE" = "key" ]; then
            ssh_command=(ssh -o BatchMode=yes -i ~/.ssh/github_actions_tencent_key)
          else
            export SSHPASS="$SSH_PASSWORD"
            ssh_command=(
              sshpass -e ssh
              -o PreferredAuthentications=password
              -o PubkeyAuthentication=no
            )
          fi
          receipt_dir="$RUNNER_TEMP/candidate-approval/active-receipt"
          server_dir="$receipt_dir/server"
          install -d -m 700 "$server_dir"
          remote_journal_dir=".local/state/jato-production-release/journals/$CANDIDATE_COMMIT_SHA"
          remote_checkpoint="$CANDIDATE_SERVER_CHECKPOINT_PATH"
          remote_evidence="$CANDIDATE_SERVER_EVIDENCE_PATH"
          remote_journal="$remote_journal_dir/$CANDIDATE_ARCHIVE_SHA256.jsonl"
          printf -v rsync_rsh '%q ' "${ssh_command[@]}" "${ssh_options[@]}"
          rsync_rsh="${rsync_rsh% }"
          ssh_target="$SSH_USER@$SSH_HOST"
          timeout 120s rsync --links --times --protect-args --chmod=F600 \
            --no-owner --no-group -e "$rsync_rsh" \
            "$ssh_target:$remote_checkpoint" "$server_dir/active-updated.json"
          timeout 120s rsync --links --times --protect-args --chmod=F600 \
            --no-owner --no-group -e "$rsync_rsh" \
            "$ssh_target:$remote_evidence" "$server_dir/active-updated.evidence.json"
          timeout 120s rsync --links --times --protect-args --chmod=F600 \
            --no-owner --no-group -e "$rsync_rsh" \
            "$ssh_target:$remote_journal" "$server_dir/active-updated.journal.jsonl"
          python3 - \
            "$RUNNER_TEMP/candidate-approval/release-candidate/candidate.json" \
            "$server_dir/active-updated.json" \
            "$server_dir/active-updated.evidence.json" \
            "$server_dir/active-updated.journal.jsonl" \
            "$CANDIDATE_SERVER_EVIDENCE_PATH" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import stat
          import sys

          (
              reviewed_name,
              checkpoint_name,
              evidence_name,
              journal_name,
              expected_evidence_path,
          ) = sys.argv[1:]
          reviewed = json.loads(Path(reviewed_name).read_text(encoding="utf-8"))
          checkpoint_raw = Path(checkpoint_name).read_bytes()
          evidence_raw = Path(evidence_name).read_bytes()
          journal_path = Path(journal_name)
          journal_metadata = journal_path.lstat()
          if journal_path.is_symlink() or not stat.S_ISREG(journal_metadata.st_mode):
              raise SystemExit(
                  "canonical Active update journal must be a regular non-symlink file"
              )
          journal_raw = journal_path.read_bytes()
          checkpoint = json.loads(checkpoint_raw.decode("utf-8"))
          evidence = json.loads(evidence_raw.decode("utf-8"))
          identity = reviewed.get("identity")
          if checkpoint.get("identity") != identity or evidence.get("identity") != identity:
              raise SystemExit("Active update changed the reviewed Candidate identity")
          if (
              checkpoint.get("phase") != "active_updated"
              or checkpoint.get("status") != "completed"
              or checkpoint.get("retryClass") != "inspect_then_resume"
          ):
              raise SystemExit("server checkpoint is not active_updated/completed")
          message = checkpoint.get("message")
          binding = re.search(
              r"(?:^|[; ])evidence_path=(\S+) evidence_sha256=([0-9a-f]{64})(?:$|[; ])",
              message if isinstance(message, str) else "",
          )
          if (
              binding is None
              or binding.group(1) != expected_evidence_path
              or binding.group(2) != hashlib.sha256(evidence_raw).hexdigest()
          ):
              raise SystemExit("Active update evidence binding mismatch")
          if not journal_raw or len(journal_raw) > 16 * 1024 * 1024:
              raise SystemExit("canonical Active update journal has an invalid size")
          try:
              events = [
                  json.loads(line)
                  for line in journal_raw.decode("utf-8").splitlines()
                  if line
              ]
          except (UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("canonical Active update journal is invalid JSONL") from exc
          if len(events) < 2:
              raise SystemExit("canonical Active update journal is incomplete")
          for sequence, event in enumerate(events, start=1):
              if (
                  not isinstance(event, dict)
                  or event.get("event") != "checkpoint_transition"
                  or event.get("sequence") != sequence
                  or event.get("identity") != identity
              ):
                  raise SystemExit(
                      "canonical Active update journal sequence/identity mismatch"
                  )
          started, updated = events[-2:]
          if (
              started.get("phase") != "active_update_started"
              or started.get("status") != "in_progress"
              or started.get("retryClass") != "rollback_required"
              or updated.get("phase") != "active_updated"
              or updated.get("status") != "completed"
              or updated.get("retryClass") != "inspect_then_resume"
          ):
              raise SystemExit(
                  "canonical journal does not end in Active update started/completed"
              )
          journal_tail = dict(updated)
          journal_tail.pop("event", None)
          if journal_tail != checkpoint:
              raise SystemExit("canonical Active update journal tail/checkpoint mismatch")
          PY
          install -m 600 "$server_dir/active-updated.json" "$receipt_dir/candidate.json"
          install -m 600 "$server_dir/active-updated.journal.jsonl" \
            "$receipt_dir/journal.jsonl"

      - name: Seal www approval receipt
        if: ${{ steps.verify_www.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/candidate-approval/verified.env"
          receipt_dir="$RUNNER_TEMP/candidate-approval/active-receipt"
          python3 03_Scripts/deploy/release_checkpoint.py write \
            --checkpoint "$receipt_dir/candidate.json" \
            --journal "$receipt_dir/journal.jsonl" \
            --repository "$CANDIDATE_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT_SHA" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --archive-bytes "$CANDIDATE_ARCHIVE_BYTES" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --frontend-identity "$CANDIDATE_FRONTEND_ARTIFACT_IDENTITY" \
            --frontend-checksum "$CANDIDATE_FRONTEND_ARTIFACT_CHECKSUM" \
            --phase www_verified \
            --status completed \
            --retry-class automatic \
            --message \
              "www verified by approval run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT; intl unchanged"
          {
            echo "## Candidate approved for www"
            echo
            echo "- Candidate commit: \`$CANDIDATE_COMMIT_SHA\`"
            echo "- Prepare run: \`$CANDIDATE_RUN_ID/$CANDIDATE_RUN_ATTEMPT\`"
            echo "- Approval run: \`$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT\`"
            echo "- Server checkpoint: \`active_updated/completed\`"
            echo "- www: exact provenance and runtime contract verified"
            echo "- intl: unchanged; separate confirmation is still required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain immutable www approval receipt
        if: ${{ steps.verify_www.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-www-approved-${{ inputs.candidate_commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-approval/active-receipt
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

  cleanup_candidate:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.release_mode == 'discard-candidate' ||
      inputs.release_mode == 'release-candidate') &&
      needs.release_coordination_guard.outputs.release-action == 'deploy' }}
    needs: release_coordination_guard
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout cleanup source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download frozen release coordination plan
        uses: actions/download-artifact@v5
        with:
          name: release-coordination-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-coordination-plan

      - name: Revalidate frozen coordination plan after cleanup approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_coordination_guard.py
          verify-plan
          --main-sha "$GITHUB_SHA"
          --plan "$RUNNER_TEMP/release-coordination-plan/release-coordination-plan.json"

      - name: Validate exact Candidate cleanup request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_prepare_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_prepare_run_attempt }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          CANDIDATE_ATTESTATION_SHA256: ${{ inputs.candidate_attestation_sha256 }}
          CONFIRM_CANDIDATE_CLEANUP: ${{ inputs.confirm_candidate_cleanup }}
        run: |
          set -euo pipefail
          test "$CONFIRM_CANDIDATE_CLEANUP" = "true" || {
            echo "::error::confirm_candidate_cleanup must be explicitly checked"
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [ "$CANDIDATE_COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::Cleaning an exact reviewed prior-main Candidate; current main remains control-plane source"
          fi
          request_dir="$RUNNER_TEMP/candidate-cleanup"
          install -d -m 700 "$request_dir"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            > "$request_dir/prepare-run.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
            > "$request_dir/prepare-artifacts.json"
          python3 - \
            "$request_dir/prepare-run.json" \
            "$CANDIDATE_RUN_ATTEMPT" "$CANDIDATE_COMMIT_SHA" \
            "$RELEASE_MODE" <<'PY'
          import json
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "head_branch": "main",
              "head_sha": sys.argv[3],
              "status": "completed",
              "run_attempt": int(sys.argv[2]),
          }
          mismatches = {
              key: {"expected": value, "actual": run.get(key)}
              for key, value in expected.items()
              if run.get(key) != value
          }
          mode = sys.argv[4]
          allowed_conclusions = (
              {"success", "failure"}
              if mode == "discard-candidate"
              else {"success"}
          )
          if run.get("conclusion") not in allowed_conclusions:
              mismatches["conclusion"] = {
                  "expected": sorted(allowed_conclusions),
                  "actual": run.get("conclusion"),
              }
          workflow_path = str(run.get("path") or "").split("@", maxsplit=1)[0]
          if workflow_path != ".github/workflows/production-release.yml":
              mismatches["path"] = {
                  "expected": ".github/workflows/production-release.yml",
                  "actual": workflow_path,
              }
          if run.get("event") not in {"push", "workflow_dispatch"}:
              mismatches["event"] = {
                  "expected": "push or workflow_dispatch",
                  "actual": run.get("event"),
              }
          if mismatches:
              raise SystemExit(
                  "prepare-candidate run identity/status mismatch: "
                  + json.dumps(mismatches, sort_keys=True)
              )
          PY

      - name: Resolve Candidate cleanup handoff source
        id: cleanup_handoff
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_prepare_run_attempt }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/candidate-cleanup/prepare-artifacts.json" \
            "$GITHUB_OUTPUT" "$CANDIDATE_COMMIT_SHA" \
            "$CANDIDATE_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import sys

          artifacts_name, output_name, commit, run_attempt = sys.argv[1:]
          pages = json.loads(Path(artifacts_name).read_text(encoding="utf-8"))
          if isinstance(pages, dict):
              pages = [pages]
          if not isinstance(pages, list):
              raise SystemExit("prepare-run artifact response is invalid")
          artifacts = []
          for page in pages:
              if not isinstance(page, dict) or not isinstance(
                  page.get("artifacts"), list
              ):
                  raise SystemExit("prepare-run artifact page is invalid")
              artifacts.extend(page["artifacts"])
          names = (
              f"release-candidate-{commit}-{run_attempt}",
              f"frontend-dist-{commit}",
          )
          selected = {
              name: [artifact for artifact in artifacts if artifact.get("name") == name]
              for name in names
          }
          duplicates = [name for name, matches in selected.items() if len(matches) > 1]
          if duplicates:
              raise SystemExit(
                  "Candidate cleanup artifact identity is ambiguous: "
                  + ", ".join(sorted(duplicates))
              )
          source = "github-artifact"
          if any(
              len(matches) != 1 or matches[0].get("expired") is not False
              for matches in selected.values()
          ):
              source = "canonical-server"
          with Path(output_name).open("a", encoding="utf-8") as output:
              output.write(f"source={source}\n")
          print(f"Candidate cleanup handoff source: {source}")
          PY

      - name: Validate Tencent cleanup credentials
        id: cleanup_auth
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_KNOWN_HOSTS:?Missing production secret SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          known_host="$SSH_HOST"
          if [ "$SSH_PORT" != "22" ]; then
            known_host="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::SSH_KNOWN_HOSTS does not pin the Tencent host and port"
            exit 1
          }
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            echo "mode=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Provide either SSH_PRIVATE_KEY or SSH_PASSWORD"
            exit 1
          fi

      - name: Download exact Candidate cleanup handoff
        if: ${{ steps.cleanup_handoff.outputs.source == 'github-artifact' }}
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-${{ inputs.candidate_commit_sha }}-${{ inputs.candidate_prepare_run_attempt }}
          path: ${{ runner.temp }}/candidate-cleanup/release-candidate
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_prepare_run_id }}

      - name: Download exact Candidate cleanup frontend
        if: ${{ steps.cleanup_handoff.outputs.source == 'github-artifact' }}
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist-${{ inputs.candidate_commit_sha }}
          path: ${{ runner.temp }}/candidate-cleanup/frontend-release
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_prepare_run_id }}

      - name: Verify immutable Candidate cleanup handoff
        if: ${{ steps.cleanup_handoff.outputs.source == 'github-artifact' }}
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_prepare_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_prepare_run_attempt }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          CANDIDATE_ATTESTATION_SHA256: ${{ inputs.candidate_attestation_sha256 }}
        run: |
          set -euo pipefail
          request_dir="$RUNNER_TEMP/candidate-cleanup"
          python3 03_Scripts/deploy/verify_candidate_handoff.py \
            --checkpoint "$request_dir/release-candidate/candidate.json" \
            --attestation "$request_dir/release-candidate/server/attestation.json" \
            --artifacts "$request_dir/prepare-artifacts.json" \
            --env-output "$request_dir/verified.env" \
            --reviewed-checkpoint-output "$request_dir/reviewed-candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT_SHA" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --attestation-sha256 "$CANDIDATE_ATTESTATION_SHA256"
          source "$request_dir/verified.env"
          python3 03_Scripts/deploy/frontend_release_artifact.py verify \
            --release-dir "$request_dir/frontend-release" \
            --expected-github-sha "$CANDIDATE_COMMIT_SHA" \
            --expected-artifact-name "$CANDIDATE_FRONTEND_ARTIFACT_NAME" \
            --expected-artifact-identity "$CANDIDATE_FRONTEND_ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$CANDIDATE_FRONTEND_ARTIFACT_CHECKSUM" \
            --expected-build-id "$CANDIDATE_FRONTEND_BUILD_ID" \
            --expected-node-version "$CANDIDATE_FRONTEND_NODE_VERSION" \
            --expected-run-id "$CANDIDATE_RUN_ID" \
            --expected-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --github-artifact-id "$CANDIDATE_GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$CANDIDATE_GITHUB_ARTIFACT_DIGEST"

      - name: Capture canonical Candidate cleanup handoff
        if: ${{ steps.cleanup_handoff.outputs.source == 'canonical-server' }}
        env:
          AUTH_MODE: ${{ steps.cleanup_auth.outputs.mode }}
          CANDIDATE_CANONICAL_BUNDLE_OUTPUT: ${{ runner.temp }}/candidate-cleanup/canonical-server.json
          CANDIDATE_CLEANUP_MODE: ${{ inputs.release_mode }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_prepare_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_prepare_run_attempt }}
          CANDIDATE_REQUESTED_ATTESTATION_SHA256: ${{ inputs.candidate_attestation_sha256 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          bash 03_Scripts/deploy/github_candidate_control.sh \
            capture-canonical-cleanup

      - name: Verify canonical Candidate cleanup handoff
        if: ${{ steps.cleanup_handoff.outputs.source == 'canonical-server' }}
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_prepare_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_prepare_run_attempt }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          CANDIDATE_ATTESTATION_SHA256: ${{ inputs.candidate_attestation_sha256 }}
        run: |
          set -euo pipefail
          request_dir="$RUNNER_TEMP/candidate-cleanup"
          python3 03_Scripts/deploy/verify_candidate_handoff.py \
            --canonical-server-bundle "$request_dir/canonical-server.json" \
            --cleanup-mode "$RELEASE_MODE" \
            --env-output "$request_dir/verified.env" \
            --reviewed-checkpoint-output "$request_dir/reviewed-candidate.json" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT_SHA" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --attestation-sha256 "$CANDIDATE_ATTESTATION_SHA256"

      - name: Capture unchanged Active identity before cleanup
        env:
          JATO_WWW_ORIGIN: ${{ vars.JATO_WWW_ORIGIN || 'https://www.ojeur.cloud' }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/candidate-cleanup/active-evidence"
          install -d -m 700 "$evidence_dir"
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "$evidence_dir/before-healthz.json" --write-out '%{http_code}' \
            "$JATO_WWW_ORIGIN/healthz")"
          test "$status" = "200"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "$JATO_WWW_ORIGIN/release-provenance.json" \
            > "$evidence_dir/before-provenance.json"
          python3 - "$evidence_dir/before-provenance.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          source = payload.get("source")
          if not isinstance(source, dict) or not isinstance(source.get("githubSha"), str):
              raise SystemExit("Active provenance identity is incomplete")
          PY

      - name: Clean exact Candidate on Tencent
        id: cleanup_control
        env:
          AUTH_MODE: ${{ steps.cleanup_auth.outputs.mode }}
          CANDIDATE_VERIFIED_ENV: ${{ runner.temp }}/candidate-cleanup/verified.env
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SERVER_NAME: ${{ vars.DEPLOY_SERVER_NAME }}
          DEPLOY_ENABLE_HTTPS: ${{ vars.DEPLOY_ENABLE_HTTPS }}
          DEPLOY_CERTBOT_EMAIL: ${{ secrets.DEPLOY_CERTBOT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HERMES_SYNC_TOKEN: ${{ secrets.HERMES_SYNC_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_PROXY_URL: ${{ secrets.GOOGLE_OAUTH_PROXY_URL }}
          GOOGLE_OAUTH_RELAY_URL: ${{ secrets.GOOGLE_OAUTH_RELAY_URL }}
          GOOGLE_OAUTH_RELAY_TOKEN: ${{ secrets.GOOGLE_OAUTH_RELAY_TOKEN }}
          MIHOMO_SUB_URL: ${{ secrets.MIHOMO_SUB_URL }}
          MIHOMO_DB_PATH: ${{ vars.MIHOMO_DB_PATH }}
        run: |
          set -euo pipefail
          bash 03_Scripts/deploy/github_candidate_control.sh "$RELEASE_MODE"

      - name: Fetch canonical Candidate cleanup receipt
        env:
          AUTH_MODE: ${{ steps.cleanup_auth.outputs.mode }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/candidate-cleanup/verified.env"
          SSH_PORT="${SSH_PORT:-22}"
          ssh_options=(
            -T -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          if [ "$AUTH_MODE" = "key" ]; then
            ssh_command=(ssh -o BatchMode=yes -i ~/.ssh/github_actions_tencent_key)
          else
            export SSHPASS="$SSH_PASSWORD"
            ssh_command=(
              sshpass -e ssh
              -o PreferredAuthentications=password
              -o PubkeyAuthentication=no
            )
          fi
          receipt_dir="$RUNNER_TEMP/candidate-cleanup/receipt"
          server_dir="$receipt_dir/server"
          install -d -m 700 "$server_dir"
          remote_checkpoint_dir=".local/state/jato-production-release/checkpoints/$CANDIDATE_COMMIT_SHA"
          remote_journal_dir=".local/state/jato-production-release/journals/$CANDIDATE_COMMIT_SHA"
          remote_checkpoint="$remote_checkpoint_dir/$CANDIDATE_ARCHIVE_SHA256.json"
          remote_evidence="$remote_checkpoint_dir/$CANDIDATE_ARCHIVE_SHA256.evidence.json"
          remote_journal="$remote_journal_dir/$CANDIDATE_ARCHIVE_SHA256.jsonl"
          printf -v rsync_rsh '%q ' "${ssh_command[@]}" "${ssh_options[@]}"
          rsync_rsh="${rsync_rsh% }"
          ssh_target="$SSH_USER@$SSH_HOST"
          for remote_local in \
            "$remote_checkpoint:$server_dir/terminal.json" \
            "$remote_evidence:$server_dir/terminal.evidence.json" \
            "$remote_journal:$server_dir/terminal.journal.jsonl"
          do
            timeout 120s rsync --links --times --protect-args --chmod=F600 \
              --no-owner --no-group -e "$rsync_rsh" \
              "$ssh_target:${remote_local%%:*}" "${remote_local#*:}"
          done
          python3 - \
            "$RUNNER_TEMP/candidate-cleanup/reviewed-candidate.json" \
            "$server_dir/terminal.json" \
            "$server_dir/terminal.evidence.json" \
            "$server_dir/terminal.journal.jsonl" "$RELEASE_MODE" <<'PY'
          import json
          from pathlib import Path
          import stat
          import sys

          reviewed_name, checkpoint_name, evidence_name, journal_name, mode = sys.argv[1:]
          def read_regular_json(name, label):
              path = Path(name)
              metadata = path.lstat()
              if path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"{label} is unsafe")
              raw = path.read_bytes()
              if not raw or len(raw) > 16 * 1024 * 1024:
                  raise SystemExit(f"{label} has an invalid size")
              try:
                  payload = json.loads(raw.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"{label} is invalid JSON") from exc
              if not isinstance(payload, dict):
                  raise SystemExit(f"{label} root must be an object")
              return payload

          reviewed = read_regular_json(reviewed_name, "reviewed Candidate checkpoint")
          checkpoint = read_regular_json(checkpoint_name, "terminal checkpoint")
          evidence = read_regular_json(evidence_name, "terminal evidence")
          identity = reviewed.get("identity")
          if checkpoint.get("identity") != identity or evidence.get("identity") != identity:
              raise SystemExit("Candidate cleanup changed the reviewed identity")
          expected = {
              "discard-candidate": (
                  {"candidate_ready", "rollback_completed"},
                  "candidate_discarded",
              ),
              "release-candidate": ({"active_updated"}, "candidate_released"),
          }
          predecessors, terminal = expected.get(mode, (set(), None))
          if (
              terminal is None
              or checkpoint.get("phase") != terminal
              or checkpoint.get("status") != "completed"
              or checkpoint.get("retryClass") != "automatic"
          ):
              raise SystemExit("Candidate cleanup terminal checkpoint mismatch")
          journal_path = Path(journal_name)
          metadata = journal_path.lstat()
          if journal_path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
              raise SystemExit("Candidate cleanup journal is unsafe")
          try:
              events = [
                  json.loads(line)
                  for line in journal_path.read_text(encoding="utf-8").splitlines()
                  if line
              ]
          except (UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("Candidate cleanup journal is invalid JSONL") from exc
          if len(events) < 2:
              raise SystemExit("Candidate cleanup journal is incomplete")
          for sequence, event in enumerate(events, start=1):
              if (
                  not isinstance(event, dict)
                  or event.get("event") != "checkpoint_transition"
                  or event.get("sequence") != sequence
                  or event.get("identity") != identity
              ):
                  raise SystemExit("Candidate cleanup journal identity/sequence mismatch")
          previous, final = events[-2:]
          if (
              previous.get("phase") not in predecessors
              or final.get("phase") != terminal
          ):
              raise SystemExit("Candidate cleanup journal terminal transition mismatch")
          journal_tail = dict(final)
          journal_tail.pop("event", None)
          if journal_tail != checkpoint:
              raise SystemExit("Candidate cleanup journal tail/checkpoint mismatch")
          PY
          install -m 600 "$server_dir/terminal.json" "$receipt_dir/checkpoint.json"
          install -m 600 "$server_dir/terminal.evidence.json" "$receipt_dir/evidence.json"
          install -m 600 "$server_dir/terminal.journal.jsonl" "$receipt_dir/journal.jsonl"
          install -m 600 \
            "$RUNNER_TEMP/candidate-cleanup/reviewed-candidate.json" \
            "$receipt_dir/reviewed-candidate.json"
          if [ -f "$RUNNER_TEMP/candidate-cleanup/canonical-server.json" ]; then
            install -m 600 \
              "$RUNNER_TEMP/candidate-cleanup/canonical-server.json" \
              "$receipt_dir/canonical-server.json"
          fi

      - name: Verify Active identity and health remained unchanged
        env:
          JATO_WWW_ORIGIN: ${{ vars.JATO_WWW_ORIGIN || 'https://www.ojeur.cloud' }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/candidate-cleanup/active-evidence"
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "$evidence_dir/after-healthz.json" --write-out '%{http_code}' \
            "$JATO_WWW_ORIGIN/healthz")"
          test "$status" = "200"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "$JATO_WWW_ORIGIN/release-provenance.json" \
            > "$evidence_dir/after-provenance.json"
          python3 - \
            "$evidence_dir/before-provenance.json" \
            "$evidence_dir/after-provenance.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          before = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          after = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          before_source = before.get("source")
          after_source = after.get("source")
          if (
              not isinstance(before_source, dict)
              or before_source != after_source
          ):
              raise SystemExit("Active release identity changed during Candidate cleanup")
          PY
          receipt_dir="$RUNNER_TEMP/candidate-cleanup/receipt"
          install -d -m 700 "$receipt_dir/active-evidence"
          install -m 600 "$evidence_dir"/*.json "$receipt_dir/active-evidence/"
          {
            echo "## Candidate cleanup completed"
            echo
            echo "- Mode: \`$RELEASE_MODE\`"
            echo "- Candidate commit: \`${{ inputs.candidate_commit_sha }}\`"
            echo "- Handoff source: \`${{ steps.cleanup_handoff.outputs.source }}\`"
            echo "- Active identity and health remained unchanged."
            echo "- No release archive was rebuilt or uploaded; intl was not modified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain immutable Candidate cleanup receipt
        uses: actions/upload-artifact@v4
        with:
          name: candidate-cleanup-${{ inputs.release_mode }}-${{ inputs.candidate_commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-cleanup/receipt
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

  audit_frontend_parity:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      needs.release_coordination_guard.outputs.release-action == 'deploy' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_mode == 'prepare-and-switch' }}
    needs: [release_coordination_guard, build_frontend, deploy_tencent]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Download audited frontend artifact by id
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build_frontend.outputs.github_artifact_id }}
          path: ${{ runner.temp }}/frontend-release

      - name: Download candidate release checkpoint
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-checkpoint

      - name: Require www and intl immutable release parity
        env:
          ARTIFACT_NAME: ${{ needs.build_frontend.outputs.artifact_name }}
          ARTIFACT_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          ARTIFACT_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
          GITHUB_ARTIFACT_ID: ${{ needs.build_frontend.outputs.github_artifact_id }}
          GITHUB_ARTIFACT_DIGEST: ${{ needs.build_frontend.outputs.github_artifact_digest }}
          FRONTEND_BUILD_ID: ${{ needs.build_frontend.outputs.frontend_build_id }}
          NODE_VERSION: ${{ needs.build_frontend.outputs.node_version }}
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          WWW_ORIGIN: ${{ vars.JATO_WWW_ORIGIN || 'https://www.ojeur.cloud' }}
          INTL_ORIGIN: ${{ vars.JATO_INTL_ORIGIN || 'https://intl.ojeur.cloud' }}
        run: |
          set -euo pipefail
          python3 03_Scripts/deploy/frontend_release_artifact.py audit-public \
            --release-dir "$RUNNER_TEMP/frontend-release" \
            --expected-github-sha "$GITHUB_SHA" \
            --expected-artifact-name "$ARTIFACT_NAME" \
            --expected-artifact-identity "$ARTIFACT_IDENTITY" \
            --expected-artifact-checksum "$ARTIFACT_CHECKSUM" \
            --expected-build-id "$FRONTEND_BUILD_ID" \
            --expected-node-version "$NODE_VERSION" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$BUILD_RUN_ATTEMPT" \
            --github-artifact-id "$GITHUB_ARTIFACT_ID" \
            --github-artifact-digest "$GITHUB_ARTIFACT_DIGEST" \
            --origin "$WWW_ORIGIN" \
            --origin "$INTL_ORIGIN" \
            --attempts 6 \
            --delay-seconds 10

      - name: Seal verified production release checkpoint
        env:
          BUILD_RUN_ATTEMPT: ${{ needs.build_frontend.outputs.workflow_run_attempt }}
          FRONTEND_IDENTITY: ${{ needs.build_frontend.outputs.artifact_identity }}
          FRONTEND_CHECKSUM: ${{ needs.build_frontend.outputs.artifact_checksum }}
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/release-checkpoint/candidate.json"
          journal="$RUNNER_TEMP/release-checkpoint/journal.jsonl"
          attestation="$RUNNER_TEMP/release-checkpoint/server/attestation.json"
          # This file arrived inside the per-run, overwrite-disabled candidate
          # artifact, so hash it after download instead of trusting a job output.
          actual_attestation_sha256="$(sha256sum "$attestation" | awk '{print $1}')"
          python3 03_Scripts/deploy/release_checkpoint.py show \
            --checkpoint "$checkpoint" >/dev/null
          read -r archive_bytes archive_sha256 < <(
            python3 - "$checkpoint" "$attestation" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          checkpoint = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          attestation = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          candidate_identity = checkpoint.get("identity")
          if not isinstance(candidate_identity, dict):
              raise SystemExit("candidate checkpoint identity is missing")
          if candidate_identity != attestation.get("identity"):
              raise SystemExit("candidate checkpoint and server attestation identity mismatch")
          archive_bytes = candidate_identity.get("archiveBytes")
          archive_sha256 = candidate_identity.get("archiveSha256")
          if isinstance(archive_bytes, bool) or not isinstance(archive_bytes, int) or archive_bytes <= 0:
              raise SystemExit("attested archive bytes must be a positive integer")
          if not isinstance(archive_sha256, str) or not re.fullmatch(r"[0-9a-f]{64}", archive_sha256):
              raise SystemExit("attested archive SHA-256 is invalid")
          print(archive_bytes, archive_sha256)
          PY
          )
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          checkpoint_args=(
            --checkpoint "$checkpoint"
            --journal "$journal"
            --repository "$GITHUB_REPOSITORY"
            --commit "$GITHUB_SHA"
            --archive-sha256 "$archive_sha256"
            --archive-bytes "$archive_bytes"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$BUILD_RUN_ATTEMPT"
            --frontend-identity "$FRONTEND_IDENTITY"
            --frontend-checksum "$FRONTEND_CHECKSUM"
          )
          python3 03_Scripts/deploy/release_checkpoint.py write \
            "${checkpoint_args[@]}" \
            --phase parity_verified \
            --status completed \
            --retry-class automatic
          python3 03_Scripts/deploy/release_checkpoint.py write \
            "${checkpoint_args[@]}" \
            --phase complete \
            --status completed \
            --retry-class complete \
            --message "server_attestation_sha256=$actual_attestation_sha256"

      - name: Retain verified production release receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-verified-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-checkpoint
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30
