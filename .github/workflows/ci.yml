name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  production-deployment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow validation dependency
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate production workflow guards
        run: python .github/scripts/validate_production_workflow_guards.py

      - name: Test release coordination fail-closed behavior
        run: python -m unittest 03_Scripts/tests/test_release_coordination_guard.py -v

  frontend-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup fixed edge contract Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: 06_AppPlatform/frontend/package-lock.json

      - name: Install workflow validation dependency
        run: python -m pip install "PyYAML==6.0.2" "pytest<9"

      - name: Install locked edge contract dependencies
        working-directory: 06_AppPlatform/frontend
        run: npm ci

      - name: Validate immutable production release workflow
        run: python .github/scripts/validate_frontend_release_workflow.py

      - name: Test frontend release fail-closed behavior
        run: >-
          python -m unittest
          03_Scripts/tests/test_ci_workflow_guards.py
          03_Scripts/tests/test_frontend_release_artifact.py
          03_Scripts/tests/test_verify_intl_runtime_contract.py
          -v

      - name: Test release recovery and shell hardening
        run: |
          bash -n \
            03_Scripts/deploy/fullstack_remote_release.sh \
            03_Scripts/deploy/tencent_feature_candidate_canary.sh \
            03_Scripts/deploy/tencent_bluegreen_release.sh \
            03_Scripts/deploy/lib/production_mutation_lock.sh \
            03_Scripts/deploy/nginx/enable_jato_fullstack_https.sh \
            03_Scripts/deploy/nginx/install_jato_fullstack_nginx.sh \
            03_Scripts/ops/deploy_fullstack_server.sh \
            03_Scripts/ops/backup_production_data.sh \
            03_Scripts/ops/sync_data_to_cloud.sh \
            03_Scripts/ops/sync_msrp_db_to_cloud.sh
          python -m pytest -q \
            03_Scripts/tests/test_bluegreen_systemd_nginx_contract.py \
            03_Scripts/tests/test_jato_bluegreen_boot_reconcile.py \
            03_Scripts/tests/test_jato_quiescence_gate.py \
            03_Scripts/tests/test_jato_release_storage_guard.py \
            03_Scripts/tests/test_tencent_feature_candidate_canary.py \
            03_Scripts/tests/test_tencent_bluegreen_release.py \
            03_Scripts/tests/test_release_source_seal.py \
            03_Scripts/tests/test_release_checkpoint.py \
            03_Scripts/tests/test_release_evidence.py \
            03_Scripts/tests/test_release_shell_hardening.py \
            06_AppPlatform/backend/tests/unit/test_deploy_workflow.py

      - name: Test intl Pages Function contracts
        working-directory: 06_AppPlatform/frontend
        run: >-
          npx vitest run
          src/tests/unit/edgeCacheFunction.test.ts
          src/tests/unit/healthzEdgeFunction.test.ts

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Style check
        run: python 03_Scripts/style_check.py

      - name: Compile check
        run: |
          python -c "
          from pathlib import Path
          files = []
          for d in ['03_Scripts', '05_DashBoard']:
              for f in Path(d).rglob('*.py'):
                  if '.venv' not in f.parts and '__pycache__' not in f.parts:
                      files.append(str(f))
          print('\n'.join(sorted(set(files))))
          " > /tmp/pyfiles.txt
          cat /tmp/pyfiles.txt
          xargs python -m py_compile < /tmp/pyfiles.txt

      - name: CLI help checks
        run: |
          python 03_Scripts/elt_worker.py --help
          python 03_Scripts/data_pipeline/build_partitioned_dataset.py --help
          python 03_Scripts/data_pipeline/run_data_refresh_job.py --help

      - name: Regression checks
        run: |
          python 03_Scripts/diagnostics/regression_csv_download_guardrails.py
          python 03_Scripts/diagnostics/regression_render_strategy_defaults.py
          python 03_Scripts/diagnostics/regression_time_selector_consistency.py

  fullstack-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_AppPlatform/backend/requirements.txt
          pip install "pytest<9" httpx

      - name: Validate backend syntax
        run: |
          python -m compileall 06_AppPlatform/backend/app

      - name: API contract tests
        working-directory: 06_AppPlatform/backend
        run: |
          set -o pipefail
          pytest_log="$(mktemp)"
          status=0
          timeout 180s python -m pytest \
            tests/integration/test_api_contracts.py \
            tests/unit/test_jato_monthly_update_enabled_gate.py \
            tests/unit/test_readiness_service.py \
            -q 2>&1 | tee "$pytest_log" || status=$?
          if [ "$status" -eq 124 ] && grep -Eq '^[0-9]+ passed(, [0-9]+ warnings?)? in ' "$pytest_log"; then
            echo "::warning::pytest reported success but did not exit cleanly; cleaning up residual Python child processes."
            pkill -P $$ python || true
            exit 0
          fi
          pkill -P $$ python || true
          exit "$status"

  fullstack-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: 06_AppPlatform/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: 06_AppPlatform/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: 06_AppPlatform/frontend
        run: npx playwright install --with-deps chromium

      - name: Fixed frontend checks
        working-directory: 06_AppPlatform/frontend
        env:
          VITE_API_BASE: /v1
          VITE_AUTH_TOKEN: ci-token
          VITE_USER_ROLE: admin
          VITE_USER_NAME: github-actions
        run: npm run check:frontend
