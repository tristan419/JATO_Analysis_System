name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke checks
        run: |
          python 03_Scripts/ci_smoke_check.py

  fullstack-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_AppPlatform/backend/requirements.txt

      - name: Validate backend syntax
        run: |
          python -m compileall 06_AppPlatform/backend/app

  fullstack-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: 06_AppPlatform/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: 06_AppPlatform/frontend
        run: npm ci

      - name: Type check frontend
        working-directory: 06_AppPlatform/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: 06_AppPlatform/frontend
        env:
          VITE_API_BASE: /v1
          VITE_AUTH_TOKEN: ci-token
          VITE_USER_ROLE: admin
          VITE_USER_NAME: github-actions
        run: npm run build
