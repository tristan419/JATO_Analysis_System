name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Style check
        run: python 03_Scripts/style_check.py

      - name: Compile check
        run: |
          python -c "
          from pathlib import Path
          files = []
          for d in ['03_Scripts', '05_DashBoard']:
              for f in Path(d).rglob('*.py'):
                  if '.venv' not in f.parts and '__pycache__' not in f.parts:
                      files.append(str(f))
          print('\n'.join(sorted(set(files))))
          " > /tmp/pyfiles.txt
          cat /tmp/pyfiles.txt
          xargs python -m py_compile < /tmp/pyfiles.txt

      - name: CLI help checks
        run: |
          python 03_Scripts/elt_worker.py --help
          python 03_Scripts/data_pipeline/build_partitioned_dataset.py --help
          python 03_Scripts/data_pipeline/run_data_refresh_job.py --help

      - name: Regression checks
        run: |
          python 03_Scripts/diagnostics/regression_csv_download_guardrails.py
          python 03_Scripts/diagnostics/regression_render_strategy_defaults.py
          python 03_Scripts/diagnostics/regression_time_selector_consistency.py

  fullstack-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_AppPlatform/backend/requirements.txt
          pip install pytest httpx

      - name: Validate backend syntax
        run: |
          python -m compileall 06_AppPlatform/backend/app

      - name: API contract tests
        working-directory: 06_AppPlatform/backend
        run: python -m pytest tests/integration/test_api_contracts.py -q

  fullstack-frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: 06_AppPlatform/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: 06_AppPlatform/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: 06_AppPlatform/frontend
        run: npx playwright install --with-deps chromium

      - name: Fixed frontend checks
        working-directory: 06_AppPlatform/frontend
        env:
          VITE_API_BASE: /v1
          VITE_AUTH_TOKEN: ci-token
          VITE_USER_ROLE: admin
          VITE_USER_NAME: github-actions
        run: npm run check:frontend
