name: intl-edge-prewarm

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */4 * * *"
  workflow_run:
    workflows: ["deploy-cloudflare-pages-intl"]
    types: [completed]
  workflow_dispatch:
    inputs:
      origin:
        description: "Frontend origin to prewarm"
        required: false
        default: "https://intl.ojeur.cloud"
      roles:
        description: "Comma-separated role scopes to prewarm"
        required: false
        default: "viewer,order_filler,editor,admin"
      repetitions:
        description: "Number of prewarm rounds"
        required: false
        default: "2"
      dashboard_url:
        description: "Optional Dashboard URL whose filter params should be prewarmed exactly"
        required: false
        default: ""

concurrency:
  group: intl-edge-prewarm
  cancel-in-progress: true

jobs:
  prewarm:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Prewarm intl edge cache
        working-directory: 06_AppPlatform/frontend
        env:
          JATO_PREWARM_ORIGIN: ${{ inputs.origin || 'https://intl.ojeur.cloud' }}
          JATO_PREWARM_ROLES: ${{ inputs.roles || 'viewer,order_filler,editor,admin' }}
          JATO_PREWARM_REPETITIONS: ${{ inputs.repetitions || '2' }}
          JATO_PREWARM_DASHBOARD_URL: ${{ inputs.dashboard_url || '' }}
          JATO_PREWARM_TIMEOUT_MS: "30000"
          JATO_PREWARM_FAIL_ON_ERROR: "1"
        run: npm run perf:prewarm-edge
