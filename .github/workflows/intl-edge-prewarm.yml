name: intl-edge-prewarm

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */4 * * *"
  workflow_run:
    workflows: ["deploy-cloudflare-pages-intl"]
    types: [completed]
  workflow_dispatch:
    inputs:
      origin:
        description: "Frontend origin to prewarm"
        required: false
        default: "https://intl.ojeur.cloud"
      roles:
        description: "Comma-separated role scopes to prewarm"
        required: false
        default: "viewer,order_filler,editor,admin"
      repetitions:
        description: "Number of prewarm rounds"
        required: false
        default: "2"
      dashboard_url:
        description: "Optional Dashboard URL whose filter params should be prewarmed exactly"
        required: false
        default: ""

concurrency:
  group: intl-edge-prewarm
  cancel-in-progress: true

jobs:
  prewarm:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Wait for intl Pages commit
        if: github.event_name != 'schedule'
        working-directory: 06_AppPlatform/frontend
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          JATO_PREWARM_ORIGIN: ${{ inputs.origin || 'https://intl.ojeur.cloud' }}
        run: |
          node - <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const origin = String(process.env.JATO_PREWARM_ORIGIN || "https://intl.ojeur.cloud").replace(/\/+$/, "");
          const deadline = Date.now() + 5 * 60 * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchCommit() {
            const response = await fetch(`${origin}/build-meta.json?ts=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) return "";
            const payload = await response.json();
            return typeof payload.commit === "string" ? payload.commit.trim() : "";
          }

          for (;;) {
            const commit = await fetchCommit().catch(() => "");
            console.log(`intl build commit: ${commit || "<unavailable>"}`);
            if (commit === expected) process.exit(0);
            if (Date.now() > deadline) {
              console.error(`intl build metadata did not reach ${expected} within the propagation window`);
              process.exit(1);
            }
            await sleep(15000);
          }
          NODE

      - name: Prewarm intl edge cache
        working-directory: 06_AppPlatform/frontend
        env:
          JATO_PREWARM_ORIGIN: ${{ inputs.origin || 'https://intl.ojeur.cloud' }}
          JATO_PREWARM_ROLES: ${{ inputs.roles || 'viewer,order_filler,editor,admin' }}
          JATO_PREWARM_REPETITIONS: ${{ inputs.repetitions || '2' }}
          JATO_PREWARM_DASHBOARD_URL: ${{ inputs.dashboard_url || '' }}
          JATO_PREWARM_TIMEOUT_MS: "120000"
          JATO_PREWARM_FAIL_ON_ERROR: "1"
        run: npm run perf:prewarm-edge
