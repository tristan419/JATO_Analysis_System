- featureId: feature.dashboard
  title: Dashboard
  status: implemented
  category: backend
  source: claude_code
  summary: 'Root cause: load_slice(limit=500_000) used scanner.head() which on hive-partitioned
    datasets (by country) reads partitions alphabetically. The first 6 countries filled
    the 500k limit, causing the remaining 15 countries to be completely missing from
    grouped time-series aggregation. Fix: added limit=None support to load_slice (uses
    scanner.to_table() for unlimited scan) and changed query_grouped_time_series +
    _query_grouped_share_time_series to pass limit=None instead of 500_000.'
  linkedEventIds:
  - dev_evt_20260516_001
  - dev_evt_20260518_010411_331753
  endpoints: []
  frontend: []
  backend:
  - 'parquet_repository.py: load_slice now supports limit=None to disable row truncation
    via scanner.to_table()'
  - 'query_service.py: query_grouped_time_series and _query_grouped_share_time_series
    now pass limit=None for complete aggregation'
  - 06_AppPlatform/backend/tests/integration/test_api_contracts.py
  tests:
    backend: 17 passed (related unit tests)
    frontendTsc: not run
    frontendBuild: not run
    frontendVitest: not run
    backendPytest: 5 passed (tests/integration/test_api_contracts.py)
  risks:
  - Unlimited scan on very large filtered datasets (>5M rows) could increase memory
    usage
  - Other load_slice callers with 200_000 limit may have similar partition-truncation
    risk for different query types
  nextSteps:
  - Deploy to server and verify Top 10 shows all countries
  - Consider applying same fix to other load_slice callers (200_000 limits)
  - Consider pushing group-by aggregation to PyArrow for better memory efficiency
  - Wire contract tests into CI diagnostics
  - Expand only when a regression repeats
  createdAt: '2026-05-18T00:48:25.990657+00:00'
  lastUpdatedAt: '2026-05-18T01:28:10.749833+00:00'
  docs:
  - Markdown_Readme/features/feature.dashboard.md
- featureId: feature.scraping_toolkit
  title: Scraping Toolkit
  status: implemented
  category: governance
  source: git_commit
  summary: 'fix: replace abort controller with bootId counter for React StrictMode
    safety

    React StrictMode double-mounts components in dev. The abort controller

    pattern caused the second boot''s async work to be aborted by the first

    mount''s cleanup. Replaced with a bootId counter — old boots silently

    return instead of aborting.


    Also removed debug logs.'
