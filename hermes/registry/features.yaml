- featureId: hermes-command-gateway
  title: Hermes Chat Gateway implementation complete
  status: implemented
  category: governance
  source: claude_code
  summary: Web users can now ask Hermes natural-language questions via POST /hermes/chat.
    Added intent router (16 intents, rules-based, zero LLM cost), command execution
    layer (POST /hermes/commands/execute), session management (JSON file-based), and
    Ask Hermes bar in frontend with suggested prompts and structured response cards.
  linkedEventIds:
  - dev_evt_20260515_001
  endpoints:
  - POST /hermes/chat
  - GET /hermes/chat/sessions
  - GET /hermes/chat/sessions/{sessionId}
  - GET /hermes/commands
  - POST /hermes/commands/execute
  frontend:
  - Ask Hermes bar
  - Suggested prompt chips
  - HermesAskResponseCard component
  - Run buttons wired through commands/execute
  backend:
  - hermes_chat_service.py with intent router
  - 5 new endpoints in hermes.py
  - Activity log bug fix (no longer silent error swallowing)
  tests:
    backend: 647 passed
    frontendTsc: clean
    frontendBuild: succeeds
    frontendVitest: 126/127 passed (1 pre-existing unrelated failure)
  risks:
  - Not yet connected to real queue-worker execution
  - Claude Code dev events not yet auto-synced into Hermes
  nextSteps:
  - Implement Hermes DevSync
  - Create feature registry
  - Auto-generate markdown docs for each feature
  - Add Dev tab to Hermes UI
