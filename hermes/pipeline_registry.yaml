# Hermes Pipeline Registry
# Phase 1 — seeded from REPOSITORY_ASSET_MAP.md (2026-05-14)
# Phase 4.5 — scheduler roles and decisions added (2026-05-14)

pipelines:
  # --- systemd Timers ---
  - pipelineId: pipeline.news.country_systemd
    name: "Country News Sync (systemd timer)"
    type: systemd_timer
    role: production_scheduler
    schedulerDecision: "Systemd timer is the recommended production scheduler for Country News Sync (direct DB access, no network hop). See PIPELINE_SCHEDULER_DECISION_2026-05-14.md §3."
    path: "03_Scripts/deploy/systemd/jato-country-news-sync.service"
    trigger: "jato-country-news-sync.timer"
    schedule: "OnCalendar=*-*-* 23:15:00 UTC"
    producer: "03_Scripts/news/run_country_news_sync.sh → sync_country_news_digest.py"
    outputs:
      - "PostgreSQL: ops.country_news_digest"
      - "PostgreSQL: ops.country_news_article"
      - "03_Scripts/logs/scheduled_fetch_status.json"
    consumers:
      - "feature.country_copilot"
      - "feature.data_management"
    dependsOn:
      - "/etc/jato-fullstack/backend.env (APP_DATABASE_URL)"
      - "/etc/jato-fullstack/country-news.env"
    relatedFeatureIds:
      - "feature.country_copilot"
      - "feature.data_management"
    status: active
    riskLevel: medium
    governanceStatus: registered
    knownIssues:
      - "Duplicate scheduling risk: same function exists in Airflow DAG jato_country_news_sync at 06:15 UTC. Decision: systemd is production, Airflow should be manual fallback."
      - "Google News RSS blocked from Tencent Cloud China server — falls back to stale cache"
    lastObserved:
      lastRunAt: "2026-05-13T15:18:03Z"
      lastSuccessAt: "2026-05-13T15:18:03Z"
      lastFailureAt: null
      lastFailureReason: null
    owner: ""
    notes: "Production scheduler for news. Previously duplicated by GitHub Actions schedule (removed 2026-05-14)."

  - pipelineId: pipeline.voc.forum_systemd
    name: "VOC Forum Sync (systemd timer)"
    type: systemd_timer
    role: production_scheduler
    schedulerDecision: "Systemd timer is the sole scheduler for VOC. No Airflow or GitHub Actions overlap. See PIPELINE_SCHEDULER_DECISION_2026-05-14.md §5."
    path: "03_Scripts/deploy/systemd/jato-voc-forum-sync.service"
    trigger: "jato-voc-forum-sync.timer"
    schedule: "OnCalendar=*-*-* 01:45:00 UTC"
    producer: "03_Scripts/voc/run_voc_forum_sync.sh → voc_fetcher.py → voc_enricher.py"
    outputs:
      - "04_Processed_data/voc/ (raw artifacts)"
      - "04_Processed_data/voc/ (enriched signals)"
      - "04_Processed_data/voc/ (deck artifacts)"
      - "PostgreSQL: ops.voc_source_run"
      - "PostgreSQL: ops.voc_raw_document"
      - "03_Scripts/logs/scheduled_fetch_status.json"
    consumers:
      - "feature.customer_insights"
      - "feature.country_copilot"
      - "feature.data_management"
    dependsOn:
      - "/etc/jato-fullstack/backend.env (APP_DATABASE_URL)"
      - "/etc/jato-fullstack/voc.env"
      - ".venv/bin/python (scraping toolkit installed)"
    relatedFeatureIds:
      - "feature.customer_insights"
      - "feature.nordic_hev_insights"
      - "feature.country_copilot"
      - "feature.data_management"
    status: active
    riskLevel: medium
    governanceStatus: registered
    knownIssues:
      - "8 source errors per run — not tracked per-source"
      - "Soft-failure handling added 2026-05-14 (single source failure no longer kills entire batch)"
      - "Requires chmod +x on runner scripts (fixed 2026-05-14)"
    lastObserved:
      lastRunAt: "2026-05-14T07:54:31Z"
      lastSuccessAt: "2026-05-14T07:54:31Z"
      lastFailureAt: "2026-05-14T01:47:20Z"
      lastFailureReason: "status=203/EXEC (missing execute permission) + heredoc syntax error + bare python in PATH"
    owner: ""
    notes: "40 raw artifacts, 70 documents, 24 source runs in last successful execution."

  - pipelineId: pipeline.msrp.dryrun_systemd
    name: "MSRP Dry-run (systemd timer)"
    type: systemd_timer
    role: production_scheduler
    schedulerDecision: "Systemd timer is production scheduler for MSRP. Airflow DAG is manual fallback (schedule=None). Acceptable overlap. See PIPELINE_SCHEDULER_DECISION_2026-05-14.md §4."
    path: "03_Scripts/deploy/systemd/jato-msrp-sync@.service"
    trigger: "jato-msrp-dryrun.timer"
    schedule: "OnCalendar=*-*-* 03:30:00 UTC"
    producer: "03_Scripts/run_msrp_low_concurrency.sh → batch_dryrun.py"
    outputs:
      - "Dry-run reports (stdout/logs)"
    consumers:
      - "feature.msrp_workbench"
    dependsOn:
      - "/etc/jato-fullstack/msrp.env"
      - "07_ScrapingToolkit/source_drafts/"
    relatedFeatureIds:
      - "feature.msrp_workbench"
    status: active
    riskLevel: low
    governanceStatus: registered
    knownIssues: []
    lastObserved:
      lastRunAt: null
      lastSuccessAt: null
      lastFailureAt: null
      lastFailureReason: null
    owner: ""
    notes: "Tests all draft sources without writing to database."

  - pipelineId: pipeline.msrp.ingest_systemd
    name: "MSRP Ingest (systemd timer)"
    type: systemd_timer
    path: "03_Scripts/deploy/systemd/jato-msrp-sync@.service"
    trigger: "jato-msrp-ingest.timer"
    schedule: "OnCalendar=Sat 05:30:00 UTC"
    producer: "03_Scripts/run_msrp_low_concurrency.sh → batch_ingest.py"
    outputs:
      - "PostgreSQL: msrp.msrp_observation"
      - "PostgreSQL: msrp.current_price (after materialize)"
    consumers:
      - "feature.msrp_workbench"
      - "feature.current_price"
      - "feature.review_workbench"
      - "feature.country_copilot"
    dependsOn:
      - "/etc/jato-fullstack/backend.env (APP_DATABASE_URL)"
      - "/etc/jato-fullstack/msrp.env"
      - "pipeline.msrp.dryrun_systemd (dry-run must pass first)"
    relatedFeatureIds:
      - "feature.msrp_workbench"
      - "feature.current_price"
      - "feature.review_workbench"
    status: active
    riskLevel: high
    governanceStatus: registered
    knownIssues:
      - "Writes production pricing data — high blast radius"
      - "92/209 sources passing dry-run (44.0%)"
    lastObserved:
      lastRunAt: null
      lastSuccessAt: null
      lastFailureAt: null
      lastFailureReason: null
    owner: ""
    notes: "Weekly ingest. Only sources that pass dry-run should be promoted."

  # --- Airflow DAGs ---
  - pipelineId: pipeline.news.country_airflow
    name: "Country News Sync (Airflow DAG)"
    type: airflow_dag
    role: manual_fallback_or_experimental
    schedulerDecision: "Airflow DAG should not run as duplicate production scheduler. Recommended: set schedule=None (manual-only) and use as fallback. See PIPELINE_SCHEDULER_DECISION_2026-05-14.md §3."
    path: "airflow/dags/jato_country_news_sync.py"
    trigger: "schedule (needs verification: may be paused/manual on prod)"
    schedule: "cron: 15 6 * * * (06:15 UTC)"
    producer: "HTTP POST to /v1/assistant/country/news/refresh"
    outputs:
      - "PostgreSQL: ops.country_news_digest"
    consumers:
      - "feature.country_copilot"
    dependsOn:
      - "JATO_API_BASE env var"
      - "JATO_API_TOKEN env var"
      - "docker-compose airflow stack running"
    relatedFeatureIds:
      - "feature.country_copilot"
    status: active
    riskLevel: medium
    governanceStatus: needs_review
    knownIssues:
      - "DUPLICATE SCHEDULING with pipeline.news.country_systemd (23:15 UTC). Decision: systemd is production, Airflow should be manual fallback."
      - "Calls backend API (circular dependency: Airflow → Backend → DB)"
      - "Requires Airflow stack to be running"
      - "Needs verification: confirm Airflow DAG schedule is paused/manual on production instance"
    lastObserved:
      lastRunAt: null
      lastSuccessAt: null
      lastFailureAt: null
      lastFailureReason: null
    owner: ""
    notes: "Redundant with systemd timer. Consider deprecating or changing to manual-only."

  - pipelineId: pipeline.msrp.airflow
    name: "MSRP Low Concurrency (Airflow DAG)"
    type: airflow_dag
    path: "airflow/dags/jato_msrp_low_concurrency.py"
    trigger: "manual"
    schedule: "None (manual only)"
    producer: "03_Scripts/run_msrp_low_concurrency.sh"
    outputs:
