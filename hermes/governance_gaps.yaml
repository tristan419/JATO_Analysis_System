- gapId: gap.docs.no_runbook
  title: No operational runbook for scheduled fetch failure recovery
  category: docs
  severity: medium
  affectedAssets:
  - All scheduled pipelines
  evidence:
  - Markdown_Readme/Fullstack/04_DevOps/SCHEDULED_FETCH_OPERATIONS.md now documents manual test commands, journalctl troubleshooting, artifact paths, and failure recovery steps.
  - The runbook covers Country news sync, VOC forum sync, MSRP dry run, and MSRP ingest recovery.
  recommendedAction: Keep this runbook updated when scheduled fetch timers, service names, or log artifact paths change.
  status: resolved
  owner: ''
  notes: Resolved 2026-05-20 by adding the scheduled fetch operations runbook and linking it from the AI and roadmap indexes.
- gapId: gap.docs.no_adr
  title: No Architecture Decision Log (ADR)
  category: docs
  severity: low
