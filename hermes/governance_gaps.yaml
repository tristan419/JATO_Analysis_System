gaps:
- gapId: gap.prompt.unversioned_python_prompts
  title: 3 LLM prompts hardcoded in Python without versioning
  category: prompt
  severity: medium
  affectedAssets:
  - prompt.country_copilot.nvidia_system
  - prompt.country_copilot.deepseek_system
  - prompt.country_copilot.deepseek_stream
  evidence:
  - All prompts are inline string constants in country_chat_service.py and routes/assistant.py
  - No version scheme, no changelog, no prompt template files
  recommendedAction: Extract prompts to versioned template files.
  status: resolved
  owner: ''
  notes: Resolved 2026-05-15. 2 main prompts extracted to hermes/prompts/ with v1.
    Code loads from files with hardcoded fallback. proposal.prompt.versioning → implemented.
- gapId: gap.pipeline.duplicate_news_scheduling
  title: Country News Sync duplicated between systemd timer and Airflow DAG
  category: pipeline
  severity: high
  affectedAssets:
  - pipeline.news.country_systemd
  - pipeline.news.country_airflow
  evidence:
  - 'systemd timer: OnCalendar=*-*-* 23:15:00 UTC'
  - 'Airflow DAG: cron 15 6 * * * (06:15 UTC)'
  - Both write to ops.country_news_digest table
  - Risk of double ingestion, duplicate articles, wasted API calls
  recommendedAction: 'Decision documented in PIPELINE_SCHEDULER_DECISION_2026-05-14.md
    §3. Systemd = production scheduler. Airflow should be manual-only. Next step:
    verify Airflow DAG schedule on production instance and pause if active.'
  status: resolved
  owner: ''
  notes: 'Resolved 2026-05-14. Server verified: Airflow Docker stack not running on
    production. systemd timer is sole active scheduler. DAG file preserved for future
    manual use.'
- gapId: gap.pipeline.news_batch_b_unscheduled
  title: News Batch B (12 countries) has no scheduled fetch
  category: pipeline
  severity: medium
  affectedAssets:
  - source.news.batch_b
  - feature.country_copilot
  evidence:
  - Batch B config exists at 07_ScrapingToolkit/news_sources/batch_b.yaml
  - No systemd timer or Airflow DAG triggers Batch B
  - 12 Western/Southern European countries without automated news coverage
  recommendedAction: Add Batch B to existing news systemd timer, or create separate
    timer with offset schedule to avoid overwhelming RSS sources.
  status: open
  owner: ''
  notes: ''
- gapId: gap.env.empty_critical_vars
  title: Critical env vars empty or commented out in example files
  category: env
  severity: high
  affectedAssets:
  - jato-fullstack-backend.env.example
  - All systemd services depending on backend.env
  evidence:
  - APP_DATABASE_ENABLED=false (default — prevents all DB writes)
  - APP_DATABASE_URL= (empty)
  - DEEPSEEK_API_KEY= (commented out in 2026-05-14 fix)
  - GEMINI_API_KEY= (commented out)
  - No clear setup instructions for production values
  recommendedAction: Add startup validation that fails fast with clear error if DB
    is enabled but URL is empty. Add setup instructions in TENCENT_CLOUD_DEPLOY.md.
  status: resolved
  owner: ''
  notes: 'Partially addressed 2026-05-14: secrets commented out in example. Still
    needs startup validation. Resolved 2026-05-18: backend startup validation now
    fails fast when APP_DATABASE_ENABLED=true and APP_DATABASE_URL is empty; Tencent
    Cloud deployment docs and backend env template document strict/warn mode and Country
    Copilot LLM key behavior.'
- gapId: gap.test.missing_integration_contract_tests
  title: No integration tests or contract tests
  category: test
  severity: medium
  affectedAssets:
  - All backend services
  - All frontend pages
  evidence:
  - tests/unit/ directory has 40 test files — all unit tests
  - tests/integration/test_api_contracts.py added on 2026-05-18
  - API contract tests cover Market Scan deck, Analysis query, and Country Chat
  - Frontend API path/type sync smoke check added
  recommendedAction: 'Add at minimum: (1) API contract tests for critical endpoints,
    (2) one end-to-end pipeline test for the most critical flow (e.g., JATO ETL →
    Market Scan API → Frontend render).'
  status: resolved
  owner: ''
  notes: 'Resolved 2026-05-18: added route-level API contract tests in 06_AppPlatform/backend/tests/integration/test_api_contracts.py for Market Scan deck, Analysis query, and Country Chat. The suite also covers Market Scan custom time-range handling, request validation, and frontend API path/type sync smoke checks.'
- gapId: gap.source_quality.voc_errors_untracked
  title: VOC source errors not systematically tracked
  category: source_quality
  severity: medium
  affectedAssets:
  - source.voc.batch_a
  - pipeline.voc.forum_systemd
  evidence:
  - 'Last VOC run: 40 raw artifacts, 8 source errors per run (typical)'
  - voc-failed-sources.json generation scaffold added 2026-05-14
  - scheduled_fetch_status.json now records failedCount per run
  - hermes_source_quality.py detects unstructured failures and scores sources
  recommendedAction: 'Per-source tracking infrastructure exists. Next: verify voc-failed-sources.json
    is populated with actual per-source data on next VOC run. Surface in Phase 6 Data
    Management UI.'
  status: in_progress
  owner: ''
  notes: proposal.source_quality.voc_tracking → implemented. Infrastructure built.
    Needs production verification on next VOC run.
- gapId: gap.source_quality.no_quality_scoring
  title: No systematic source quality scoring
  category: source_quality
  severity: medium
  affectedAssets:
  - All source types (news, voc, msrp)
  evidence:
  - Source Registry quality fields are all null
  - No successRate, timeoutRate, http403Rate, extractionQualityScore tracked
  - No source health dashboard
  recommendedAction: Implement per-source quality scoring in crawler output. Write
    scores to Source Registry. Add source health view to Data Management.
  status: open
  owner: ''
  notes: ''
