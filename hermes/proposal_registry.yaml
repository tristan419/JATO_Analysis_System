    affectedFeatures:
      - "feature.customer_insights"
      - "feature.data_management"
    affectedPipelines:
      - "pipeline.voc.forum_systemd"
    affectedSources:
      - "source.voc.batch_a"
    affectedPrompts: []
    riskLevel: low
    expectedImpact: "Enables data-driven decisions about source retirement. Reduces manual troubleshooting time."
    rollbackPlan: "Remove failed_sources.json generation. VOC pipeline unchanged."
    status: implemented
    createdAt: "2026-05-14"
    implementedAt: "2026-05-14"
    notes: "voc-failed-sources.json scaffold was added in the 2026-05-14 VOC fix. Source Registry now reflects this tracking. Per-source quality scoring in hermes_source_quality.py covers VOC sources."

  - proposalId: proposal.ci.non_blocking_diagnostics
    type: test_coverage
    title: "Convert CI from failing quality gate to non-blocking diagnostics"
    summary: "Current CI consistently fails due to pre-existing style issues. Short-term: split into non-blocking diagnostic stages. Long-term: restore as quality gate with focused checks (YAML validation, frontend typecheck, backend smoke)."
    affectedFeatures: []
    affectedPipelines:
      - "pipeline.ci.github"
    affectedSources: []
    affectedPrompts: []
    riskLevel: medium
    expectedImpact: "Removes misleading red X noise from GitHub Actions page. Enables incremental quality gate restoration."
    rollbackPlan: "Re-enable full CI checks."
    status: implemented
    createdAt: "2026-05-14"
    implementedAt: "2026-05-18"
    notes: "Implemented 2026-05-18 in .github/workflows/ci.yml. Pre-existing smoke and frontend checks now run as non-blocking diagnostics via continue-on-error. Backend compile remains blocking, and the new tests/integration/test_api_contracts.py suite is added as a blocking backend API contract check with pytest/httpx installed only in CI. Deploy workflows were not changed."

