# Hermes Proposal Registry
# Phase 1 — initial proposals based on Phase 0 governance gaps
# IMPORTANT: All proposals require human review. Do not auto-execute.

proposals:
  - proposalId: proposal.prompt.versioning
    type: prompt_versioning
    title: "Version the 3 hardcoded Country Copilot prompts"
    summary: "Implemented 2026-05-15. Extracted 2 main prompts to hermes/prompts/ (country_copilot_nvidia_v1.txt, country_copilot_deepseek_v1.txt). country_chat_service.py loads from files with hardcoded fallback. Prompts are now independently versionable."
    affectedFeatures:
      - "feature.country_copilot"
    affectedPipelines: []
    affectedSources: []
    affectedPrompts:
      - "prompt.country_copilot.nvidia_system"
      - "prompt.country_copilot.deepseek_system"
      - "prompt.country_copilot.deepseek_stream"
    riskLevel: low
    expectedImpact: "Prompt changes become independently trackable. No functional change to LLM behavior."
    rollbackPlan: "Revert to inline prompt strings."
    status: implemented
    createdAt: "2026-05-14"
    implementedAt: "2026-05-15"
    notes: "Prompts live at hermes/prompts/. To update a prompt: edit the .txt file, bump version in filename, commit."

  - proposalId: proposal.pipeline.news_dedup
    type: pipeline_dedup
    title: "Resolve duplicate Country News Sync scheduling"
    summary: "Resolved 2026-05-14. Server check confirmed: Airflow Docker stack is NOT running on production. systemd timer is the sole active scheduler. DAG file exists on disk but has no running scheduler. Duplicate risk is resolved in practice. Airflow DAG can remain as manual fallback for future use."
    affectedFeatures:
      - "feature.country_copilot"
      - "feature.data_management"
    affectedPipelines:
      - "pipeline.news.country_systemd"
      - "pipeline.news.country_airflow"
    affectedSources:
      - "source.news.batch_a"
    affectedPrompts: []
    riskLevel: medium
    expectedImpact: "Eliminates double ingestion risk. Systemd timer is sole active production scheduler."
    rollbackPlan: "If Airflow is restarted, ensure DAG schedule is manual-only before enabling scheduler."
    status: implemented
    createdAt: "2026-05-14"
    implementedAt: "2026-05-14"
    notes: "Server verified: no airflow containers running, docker compose not available for airflow. systemd timer active and healthy (last success May 14 23:16 CST)."

  - proposalId: proposal.env.startup_validation
    type: env_hardening
    title: "Add startup validation for critical environment variables"
    summary: "Add fast-fail validation at backend startup that checks: APP_DATABASE_ENABLED=true requires APP_DATABASE_URL non-empty. DEEPSEEK_API_KEY required if Country Copilot is enabled. Output clear error messages instead of silent failures or confusing RuntimeErrors."
    affectedFeatures:
      - "feature.country_copilot"
      - "feature.data_management"
    affectedPipelines:
      - "pipeline.news.country_systemd"
      - "pipeline.voc.forum_systemd"
    affectedSources: []
    affectedPrompts: []
    riskLevel: low
    expectedImpact: "Faster diagnosis of misconfigured deployments. Prevents silent failures in scheduled jobs."
    rollbackPlan: "Remove validation checks. Backend starts with previous behavior."
    status: implemented
    createdAt: "2026-05-14"
    implementedAt: "2026-05-18"
    notes: "Implemented in app/core/startup_validation.py and app/main.py. DB-enabled-with-empty-URL is a startup error; Country Copilot LLM key can be enforced with APP_COUNTRY_COPILOT_REQUIRE_LLM_KEY or strict validation mode. Messages print variable names only, never secret values."

  - proposalId: proposal.test.integration_contract
    type: test_coverage
    title: "Add minimum integration and contract tests"
    summary: "Add: (1) API contract tests for 3 critical endpoints (market-scan/deck, assistant/country/chat, analysis/query). (2) One end-to-end pipeline test: ETL → Market Scan API → frontend type check. (3) Frontend type snapshot test vs backend serializer output."
    affectedFeatures:
      - "feature.market_scan"
      - "feature.country_copilot"
      - "feature.dashboard"
    affectedPipelines:
      - "pipeline.jato.etl"
    affectedSources: []
    affectedPrompts: []
    riskLevel: medium
    expectedImpact: "Catches API contract breaks before deployment. Reduces regression risk for critical user-facing features."
    rollbackPlan: "Tests are additive. Remove if they cause CI flakiness."
    status: implemented
    createdAt: "2026-05-14"
    implementedAt: "2026-05-18"
    notes: "Implemented 2026-05-18 in 06_AppPlatform/backend/tests/integration/test_api_contracts.py. Coverage includes Market Scan deck custom time-range contract, Analysis query route contract, Country Chat route contract, backend request validation, and a frontend API path/type sync smoke check."

  - proposalId: proposal.source_quality.voc_tracking
