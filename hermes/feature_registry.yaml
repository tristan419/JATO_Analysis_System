  - compile
  - frontendTsc
  - frontendVitest
  - integration
  dependencies:
  - pipeline.jato.etl
  owner: ''
  governanceStatus: registered
  knownIssues:
  - Auto-generated dev event from git commit — tests not auto-verified.
  - Cancel can kill tracked subprocess groups; direct in-thread validation remains
    best-effort until it reaches a cancellation checkpoint.
  - MarketScan first request after a real JATO publish still performs one cold compute;
    Redis/local warm path should be fast after that.
  - Existing runtime pipelines must run once to create fresh standard status files
    for MSRP dryrun/ingest; Hermes still falls back to legacy scheduled status until
    then.
  - Smart Merge rebuilds partition/manifest/fingerprint via subprocess — if the rebuild
    script fails, the job enters smart_merge_failed phase and user must retry
  - Works only for country_regression blocker, not sales_doubling (which indicates
    deeper data integrity issue)
  - No CSV upload support — only xlsx
  - Upload-time month check is best-effort; publish guard still runs separately
  lastAuditAt: '2026-05-29T06:03:38.913411+00:00'
