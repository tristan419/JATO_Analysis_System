[Service]
# Candidate writes only to its disposable PostgreSQL snapshot sandbox. The
# production database and shared JATO files remain outside its write surface.
EnvironmentFile=/etc/jato-fullstack/candidate-database.env
Environment=APP_RUNTIME_READ_ONLY=false
Environment="PGOPTIONS=-c default_transaction_read_only=off -c statement_timeout=120000 -c lock_timeout=5000"

# Candidate resource limits are part of the immutable unit contract.  Do not
# use systemctl set-property here: persistent system.control drop-ins would
# become a second, hidden source of runtime configuration.
MemoryHigh=3G
MemoryMax=4G
CPUQuota=200%

CacheDirectory=jato-candidate
CacheDirectoryMode=0750
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
RestrictNamespaces=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
LockPersonality=true
RestrictRealtime=true
RestrictSUIDSGID=true

ReadOnlyPaths=/opt/jato/shared
ReadOnlyPaths=/opt/JATO_Analysis_System-main/01_RAW_DATA
ReadOnlyPaths=/opt/JATO_Analysis_System-main/04_Processed_data
ReadWritePaths=/var/cache/jato-candidate
