# Fixed loopback-only Candidate preview. Public Nginx must never include it.
daemon off;
worker_processes 1;
pid /run/jato-candidate-preview/nginx.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /var/cache/jato-candidate-preview/client_temp;
    proxy_temp_path /var/cache/jato-candidate-preview/proxy_temp;

    server {
        listen 127.0.0.1:18002;
        server_name _;
        root /opt/jato/slots/8001/current/06_AppPlatform/frontend/dist;
        index index.html;
        client_max_body_size 1024m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /candidate-preview.json {
            alias /var/cache/jato-candidate-preview/candidate-preview.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8001/healthz;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }

        location = /readyz {
            proxy_pass http://127.0.0.1:8001/readyz;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /v1/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:8001/openapi.json;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /docs {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /build-meta.json {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /route-probe.txt {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
        }
    }
}
